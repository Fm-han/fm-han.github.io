<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宽高比计算器</title>
    <style>
                /* 顶部横幅广告 - 透明样式 */ .ad-banner-top { border-bottom: 1px solid #e0e0e0; padding: 6px 20px; text-align: center; min-height: 50px; display: flex; align-items: center; justify-content: center; } .ad-banner-bottom { border-top: 1px solid #e0e0e0; padding: 6px 20px; text-align: center; min-height: 50px; display: flex; align-items: center; justify-content: center; margin-top: 40px; } .ad-container { max-width: 728px; margin: 0 auto; min-height: 38px; display: flex; align-items: center; justify-content: center; }
        * { margin:0; padding:0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #fafafa; min-height: 100vh; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; }
        .card { background: #fff; border: 1px solid #e0e0e0; border-radius: 8px; padding: 24px; margin-bottom: 20px; }
        h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: 20px; color: #333; text-align: center; }
        .title { font-size: 1.25rem; font-weight: 600; margin-bottom: 16px; color: #333; }
        label { display: block; margin-bottom: 8px; color: #555; font-weight: 500; }
        input { border: 1px solid #ddd; border-radius: 4px; padding: 8px 12px; width: 100%; box-sizing: border-box; margin-bottom: 16px; }
        select { border: 1px solid #ddd; border-radius: 4px; padding: 8px 12px; width: 100%; box-sizing: border-box; margin-bottom: 16px; }
        button { background: #007bff; color: #fff; border: none; padding: 8px 20px; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
        button.calc-btn { background: #28a745; width: 100%; padding: 12px; font-size: 1.1rem; }
        .input-row { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: center; margin-bottom: 16px; }
        .ratio-display { font-size: 1.3rem; color: #007bff; font-weight: 600; }
        .result { background: #f0f7ff; border: 1px solid #007bff; border-radius: 4px; padding: 16px; margin-top: 16px; }
        .result-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #e0e0e0; }
        .result-row:last-child { border-bottom: none; }
        .result-label { color: #666; }
        .result-value { font-weight: 600; color: #007bff; }
        .common-ratios { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px; }
        .ratio-btn { padding: 8px; text-align: center; background: #f0f0f0; border-radius: 4px; cursor: pointer; border: none; font-size: 0.85rem; }
        .ratio-btn:hover { background: #e0e0e0; }
        .ratio-btn.active { background: #007bff; color: #fff; }
        .error { color: #dc3545; margin-top: 8px; font-size: 0.9rem; }
        .preview-box { margin-top: 16px; text-align: center; }
        .preview-rect { display: inline-block; background: #007bff; opacity: 0.7; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="ad-banner-top"><div class="ad-container"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-XXXXXXXXXX" data-ad-slot="XXXXXX" data-ad-format="auto" data-full-width-responsive="true"></ins></div></div>
    <div class="container">
        <h1>宽高比计算器</h1>
        <div class="card">
            <div class="title">计算宽高比</div>
            
            <div class="input-row">
                <div>
                    <label>宽度 (W)</label>
                    <input type="number" id="width" placeholder="宽度" step="any">
                </div>
                <div style="font-size: 1.5rem; color: #999;">:</div>
                <div>
                    <label>高度 (H)</label>
                    <input type="number" id="height" placeholder="高度" step="any">
                </div>
            </div>
            
            <div class="common-ratios">
                <button class="ratio-btn" onclick="setRatio(16,9,this)">16:9</button>
                <button class="ratio-btn" onclick="setRatio(4,3,this)">4:3</button>
                <button class="ratio-btn" onclick="setRatio(3,2,this)">3:2</button>
                <button class="ratio-btn" onclick="setRatio(1,1,this)">1:1</button>
                <button class="ratio-btn" onclick="setRatio(21,9,this)">21:9</button>
                <button class="ratio-btn" onclick="setRatio(9,16,this)">9:16</button>
            </div>
            
            <label>模式</label>
            <select id="mode" onchange="updateMode()">
                <option value="calc">计算宽高比</option>
                <option value="scale">按宽高比缩放</option>
            </select>
            
            <div id="scaleOptions" style="display:none;">
                <label>新宽度</label>
                <input type="number" id="newWidth" placeholder="输入新宽度" step="any">
                <label>或新高度</label>
                <input type="number" id="newHeight" placeholder="输入新高度" step="any">
            </div>
            
            <button class="calc-btn" onclick="calculate()">计算</button>
            
            <div id="result" class="result" style="display:none;">
                <div class="result-row">
                    <span class="result-label">简化宽高比</span>
                    <span id="simpleRatio" class="result-value"></span>
                </div>
                <div class="result-row">
                    <span class="result-label">小数比例 (W/H)</span>
                    <span id="decimalRatio" class="result-value"></span>
                </div>
                <div class="result-row">
                    <span class="result-label">缩放后的宽度</span>
                    <span id="scaledWidth" class="result-value"></span>
                </div>
                <div class="result-row">
                    <span class="result-label">缩放后的高度</span>
                    <span id="scaledHeight" class="result-value"></span>
                </div>
            </div>
            <div id="error" class="error" style="display:none;"></div>
            
            <div class="preview-box">
                <div id="previewRect" class="preview-rect" style="display:none;"></div>
            </div>
        </div>
    </div>

    <script>
        function setRatio(w, h, btn) {
            document.getElementById('width').value = w;
            document.getElementById('height').value = h;
            document.querySelectorAll('.ratio-btn').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');
        }
        
        function updateMode() {
            var mode = document.getElementById('mode').value;
            document.getElementById('scaleOptions').style.display = mode === 'scale' ? 'block' : 'none';
        }
        
        function gcd(a, b) {
            a = Math.abs(Math.round(a));
            b = Math.abs(Math.round(b));
            while (b) {
                var temp = b;
                b = a % b;
                a = temp;
            }
            return a;
        }

        function calculate() {
            var w = parseFloat(document.getElementById('width').value);
            var h = parseFloat(document.getElementById('height').value);
            var mode = document.getElementById('mode').value;
            
            var resultDiv = document.getElementById('result');
            var errorDiv = document.getElementById('error');
            
            resultDiv.style.display = 'none';
            errorDiv.style.display = 'none';
            
            if (isNaN(w) || isNaN(h) || w <= 0 || h <= 0) {
                errorDiv.textContent = '请输入有效的宽度和高度';
                errorDiv.style.display = 'block';
                return;
            }
            
            var g = gcd(w, h);
            var ratioW = w / g;
            var ratioH = h / g;
            var decimal = (w / h).toFixed(4);
            
            document.getElementById('simpleRatio').textContent = ratioW + ':' + ratioH;
            document.getElementById('decimalRatio').textContent = decimal;
            
            if (mode === 'scale') {
                var newW = parseFloat(document.getElementById('newWidth').value);
                var newH = parseFloat(document.getElementById('newHeight').value);
                
                if (!isNaN(newW) && newW > 0) {
                    var scaledH = Math.round(newW * h / w);
                    document.getElementById('scaledWidth').textContent = Math.round(newW);
                    document.getElementById('scaledHeight').textContent = scaledH;
                } else if (!isNaN(newH) && newH > 0) {
                    var scaledW = Math.round(newH * w / h);
                    document.getElementById('scaledWidth').textContent = scaledW;
                    document.getElementById('scaledHeight').textContent = Math.round(newH);
                } else {
                    document.getElementById('scaledWidth').textContent = '-';
                    document.getElementById('scaledHeight').textContent = '-';
                }
            } else {
                document.getElementById('scaledWidth').textContent = '-';
                document.getElementById('scaledHeight').textContent = '-';
            }
            
            var preview = document.getElementById('previewRect');
            var scale = Math.min(300 / w, 200 / h, 1);
            preview.style.width = (w * scale) + 'px';
            preview.style.height = (h * scale) + 'px';
            preview.style.display = 'block';
            
            resultDiv.style.display = 'block';
        }
    </script>
    <div class="ad-banner-bottom"><div class="ad-container"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-XXXXXXXXXX" data-ad-slot="XXXXXX" data-ad-format="auto" data-full-width-responsive="true"></ins></div></div>
</body>
</html>
