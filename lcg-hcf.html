<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>最大公约数/最小公倍数计算器</title>
    <style>
                /* 顶部横幅广告 - 透明样式 */ .ad-banner-top { border-bottom: 1px solid #e0e0e0; padding: 6px 20px; text-align: center; min-height: 50px; display: flex; align-items: center; justify-content: center; } .ad-banner-bottom { border-top: 1px solid #e0e0e0; padding: 6px 20px; text-align: center; min-height: 50px; display: flex; align-items: center; justify-content: center; margin-top: 40px; } .ad-container { max-width: 728px; margin: 0 auto; min-height: 38px; display: flex; align-items: center; justify-content: center; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #fafafa; min-height: 100vh; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; }
        .card { background: #fff; border: 1px solid #e0e0e0; border-radius: 8px; padding: 24px; margin-bottom: 20px; }
        h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: 20px; color: #333; text-align: center; }
        .title { font-size: 1.25rem; font-weight: 600; margin-bottom: 16px; color: #333; }
        label { display: block; margin-bottom: 8px; color: #555; font-weight: 500; }
        input { border: 1px solid #ddd; border-radius: 4px; padding: 8px 12px; width: 100%; box-sizing: border-box; margin-bottom: 16px; }
        button { background: #007bff; color: #fff; border: none; padding: 8px 20px; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
        button.calc-btn { background: #28a745; width: 100%; padding: 12px; font-size: 1.1rem; }
        .input-row { display: flex; gap: 16px; }
        .input-row input { width: 50%; }
        .result { background: #f0f7ff; border: 1px solid #007bff; border-radius: 4px; padding: 16px; margin-top: 16px; }
        .result-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .result-item { background: #fff; padding: 16px; border-radius: 8px; text-align: center; }
        .result-label { color: #666; font-size: 0.9rem; margin-bottom: 8px; }
        .result-value { color: #007bff; font-size: 1.5rem; font-weight: 700; }
        .result-value.hcf { color: #28a745; }
        .result-value.lcm { color: #dc3545; }
        .steps { margin-top: 16px; background: #fff; padding: 16px; border-radius: 8px; }
        .step { padding: 8px 0; border-bottom: 1px solid #eee; font-family: monospace; }
        .step:last-child { border-bottom: none; }
        .step-num { color: #007bff; }
        .formula { background: #f8f9fa; padding: 12px; border-radius: 4px; margin-top: 16px; font-family: monospace; font-size: 0.9rem; }
        .error { color: #dc3545; margin-top: 8px; font-size: 0.9rem; }
        .relation { text-align: center; padding: 12px; background: #fff3cd; border-radius: 4px; margin-top: 12px; color: #856404; }
    </style>
</head>
<body>
    <div class="ad-banner-top"><div class="ad-container"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-XXXXXXXXXX" data-ad-slot="XXXXXX" data-ad-format="auto" data-full-width-responsive="true"></ins></div></div>
    <div class="container">
        <h1>最大公约数/最小公倍数计算器</h1>
        <div class="card">
            <div class="title">输入两个或更多数字</div>
            <div class="input-row">
                <input type="number" id="num1" placeholder="数字 1" value="12">
                <input type="number" id="num2" placeholder="数字 2" value="18">
            </div>
            <input type="number" id="num3" placeholder="数字 3 (可选)">
            <input type="number" id="num4" placeholder="数字 4 (可选)">
            
            <button class="calc-btn" onclick="calculate()">计算 GCD 和 LCM</button>
            <button onclick="clearResult()" style="background:#6c757d; width:100%; margin-top:10px;">清除</button>
            
            <div id="result" class="result" style="display:none;">
                <div class="result-grid">
                    <div class="result-item">
                        <div class="result-label">最大公约数 (GCD/HCF)</div>
                        <div id="gcdValue" class="result-value hcf"></div>
                    </div>
                    <div class="result-item">
                        <div class="result-label">最小公倍数 (LCM)</div>
                        <div id="lcmValue" class="result-value lcm"></div>
                    </div>
                </div>
                <div id="relation" class="relation" style="display:none;"></div>
            </div>
            <div id="error" class="error" style="display:none;"></div>
            
            <div id="steps" class="steps" style="display:none;">
                <div class="title" style="margin-bottom:8px;">计算步骤 (欧几里得算法)</div>
                <div id="stepsContent"></div>
            </div>
        </div>
        
        <div class="card">
            <div class="title">公式说明</div>
            <div class="formula">
                GCD(a, b) × LCM(a, b) = a × b
            </div>
            <p style="color:#666; font-size:0.9rem; margin-top:12px;">
                • GCD (最大公约数): 两个或多个数共有的最大因数<br>
                • LCM (最小公倍数): 两个或多个数的最小公倍数<br>
                • 支持2-4个数字同时计算
            </p>
        </div>
    </div>

    <script>
        function gcd(a, b) {
            a = Math.abs(a);
            b = Math.abs(b);
            while (b) {
                [a, b] = [b, a % b];
            }
            return a;
        }

        function gcdMultiple(nums) {
            return nums.reduce((a, b) => gcd(a, b));
        }

        function lcm(a, b) {
            return Math.abs(a * b) / gcd(a, b);
        }

        function lcmMultiple(nums) {
            return nums.reduce((a, b) => lcm(a, b));
        }

        function euclideanSteps(a, b, steps = []) {
            const originalA = a;
            const originalB = b;
            
            while (b !== 0) {
                const q = Math.floor(a / b);
                const r = a % b;
                steps.push(`${a} = ${q} × ${b} + ${r}`);
                a = b;
                b = r;
            }
            
            return { gcd: a, steps, note: `GCD(${originalA}, ${originalB}) = ${a}` };
        }

        function calculate() {
            const num1 = parseInt(document.getElementById('num1').value);
            const num2 = parseInt(document.getElementById('num2').value);
            const num3 = document.getElementById('num3').value ? parseInt(document.getElementById('num3').value) : null;
            const num4 = document.getElementById('num4').value ? parseInt(document.getElementById('num4').value) : null;
            
            const resultDiv = document.getElementById('result');
            const stepsDiv = document.getElementById('steps');
            const errorDiv = document.getElementById('error');
            
            resultDiv.style.display = 'none';
            stepsDiv.style.display = 'none';
            errorDiv.style.display = 'none';
            
            if (isNaN(num1) || isNaN(num2)) {
                errorDiv.textContent = '请至少输入两个数字';
                errorDiv.style.display = 'block';
                return;
            }
            
            if (num1 === 0 || num2 === 0) {
                errorDiv.textContent = '数字不能为零';
                errorDiv.style.display = 'block';
                return;
            }
            
            const nums = [num1, num2];
            if (num3 !== null) nums.push(num3);
            if (num4 !== null) nums.push(num4);
            
            const gcdValue = gcdMultiple(nums);
            const lcmValue = lcmMultiple(nums);
            
            document.getElementById('gcdValue').textContent = gcdValue;
            document.getElementById('lcmValue').textContent = lcmValue;
            
            const relation = document.getElementById('relation');
            if (nums.length === 2) {
                const product = Math.abs(nums[0] * nums[1]);
                const check = gcdValue * lcmValue;
                relation.innerHTML = `验证: GCD × LCM = ${gcdValue} × ${lcmValue} = ${check} | a × b = ${product}`;
                relation.style.display = 'block';
                
                const euclidean = euclideanSteps(Math.abs(nums[0]), Math.abs(nums[1]));
                document.getElementById('stepsContent').innerHTML = 
                    euclidean.steps.map(s => `<div class="step"><span class="step-num">→</span> ${s}</div>`).join('') +
                    `<div class="step" style="color:#28a745; font-weight:600;">✓ ${euclidean.note}</div>`;
                stepsDiv.style.display = 'block';
            } else {
                relation.innerHTML = `${nums.length} 个数字: GCD(${nums.join(', ')}) = ${gcdValue}, LCM(${nums.join(', ')}) = ${lcmValue}`;
                relation.style.display = 'block';
            }
            
            resultDiv.style.display = 'block';
        }

        function clearResult() {
            document.getElementById('num1').value = '';
            document.getElementById('num2').value = '';
            document.getElementById('num3').value = '';
            document.getElementById('num4').value = '';
            document.getElementById('result').style.display = 'none';
            document.getElementById('steps').style.display = 'none';
            document.getElementById('error').style.display = 'none';
        }
    </script>
    <div class="ad-banner-bottom"><div class="ad-container"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-XXXXXXXXXX" data-ad-slot="XXXXXX" data-ad-format="auto" data-full-width-responsive="true"></ins></div></div>
</body>
</html>
