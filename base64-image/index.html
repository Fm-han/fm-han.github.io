<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Base64图片转换器</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#fafafa;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;padding:20px;min-height:100vh}
.container{max-width:700px;margin:0 auto}
h1{text-align:center;color:#333;margin-bottom:24px;font-size:22px}
.card{background:#fff;border:1px solid #e0e0e0;border-radius:8px;padding:24px;margin-bottom:16px}
label{display:block;font-weight:600;margin-bottom:6px;color:#555;font-size:14px}
.btn{background:#007bff;color:#fff;border:none;padding:8px 20px;border-radius:4px;cursor:pointer;font-size:14px;margin-top:8px}
.btn:hover{background:#0056b3}
.btn-green{background:#28a745}
.btn-green:hover{background:#218838}
.upload-area{border:2px dashed #ccc;border-radius:8px;padding:40px;text-align:center;cursor:pointer;color:#888;margin:12px 0;transition:border-color .2s}
.upload-area:hover,.upload-area.dragover{border-color:#007bff;color:#007bff}
textarea{width:100%;padding:10px;border:1px solid #ddd;border-radius:4px;font-size:13px;box-sizing:border-box;resize:vertical;font-family:monospace;height:150px}
.result-img{max-width:100%;border-radius:6px;margin-top:12px;display:none}
.info{background:#f5f5f5;padding:10px;border-radius:4px;font-size:13px;margin-top:8px;color:#666}
.tabs{display:flex;gap:0;margin-bottom:16px}
.tab{padding:8px 16px;background:#e9ecef;cursor:pointer;border:1px solid #ccc;border-bottom:none;border-radius:6px 6px 0 0;font-size:14px}
.tab.active{background:#fff;border-bottom:1px solid #fff;position:relative;top:1px}
</style>
</head>
<body>
<div class="container">
<h1>Base64图片转换器</h1>
<div class="tabs">
<div class="tab active" onclick="switchTab('img2base')">图片 → Base64</div>
<div class="tab" onclick="switchTab('base2img')">Base64 → 图片</div>
</div>
<div class="card" id="img2basePanel">
<label>上传图片</label>
<div class="upload-area" id="dropZone">
<p>点击或拖拽图片到此处</p>
<p style="font-size:12px;margin-top:4px">支持 PNG, JPG, GIF, SVG, WebP</p>
<input type="file" id="fileInput" accept="image/*" style="display:none">
</div>
<div class="info" id="fileInfo"></div>
<img class="result-img" id="previewImg">
<label style="margin-top:12px">Base64字符串</label>
<textarea id="base64Output" readonly placeholder="转换结果将显示在这里..."></textarea>
<div style="display:flex;gap:8px;margin-top:8px">
<button class="btn" onclick="copyBase64()">复制Base64</button>
<button class="btn btn-green" onclick="copyDataUri()">复制Data URI</button>
</div>
</div>
<div class="card" id="base2imgPanel" style="display:none">
<label>粘贴Base64字符串</label>
<textarea id="base64Input" placeholder="粘贴Base64字符串（可包含data:image/...前缀）"></textarea>
<button class="btn" onclick="decodeBase64()">转换并预览</button>
<img class="result-img" id="decodedImg">
<div style="margin-top:8px">
<button class="btn btn-green" onclick="downloadImg()">下载图片</button>
</div>
</div>
</div>
<script>
function switchTab(t){
document.querySelectorAll('.tab').forEach((el,i)=>el.classList.toggle('active',i===(t==='img2base'?0:1)));
document.getElementById('img2basePanel').style.display=t==='img2base'?'block':'none';
document.getElementById('base2imgPanel').style.display=t==='base2img'?'block':'none';
}
const dropZone=document.getElementById('dropZone');
const fileInput=document.getElementById('fileInput');
dropZone.onclick=()=>fileInput.click();
dropZone.addEventListener('dragover',e=>{e.preventDefault();dropZone.classList.add('dragover')});
dropZone.addEventListener('dragleave',()=>dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop',e=>{e.preventDefault();dropZone.classList.remove('dragover');handleFile(e.dataTransfer.files[0])});
fileInput.addEventListener('change',e=>handleFile(e.target.files[0]));
let currentDataUri='';
function handleFile(file){
if(!file||!file.type.startsWith('image/')){alert('请选择图片文件');return}
document.getElementById('fileInfo').textContent=`文件名: ${file.name} | 大小: ${(file.size/1024).toFixed(1)} KB | 类型: ${file.type}`;
const reader=new FileReader();
reader.onload=e=>{
currentDataUri=e.target.result;
const base64=e.target.result.split(',')[1];
document.getElementById('base64Output').value=base64;
const img=document.getElementById('previewImg');
img.src=currentDataUri;img.style.display='block';
};
reader.readAsDataURL(file);
}
function copyBase64(){
navigator.clipboard.writeText(document.getElementById('base64Output').value);
alert('已复制Base64字符串!');
}
function copyDataUri(){
navigator.clipboard.writeText(currentDataUri);
alert('已复制Data URI!');
}
function decodeBase64(){
let input=document.getElementById('base64Input').value.trim();
if(!input){alert('请输入Base64字符串');return}
let dataUri=input;
if(!input.startsWith('data:')){dataUri='data:image/png;base64,'+input}
document.getElementById('decodedImg').src=dataUri;
document.getElementById('decodedImg').style.display='block';
}
function downloadImg(){
const img=document.getElementById('decodedImg');
if(!img.src||img.style.display==='none'){alert('请先转换图片');return}
const a=document.createElement('a');a.href=img.src;a.download='decoded-image.png';a.click();
}
</script>
</body>
</html>
