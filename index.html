        // 分类配置
        const categoryConfig = {
            'text': { icon: '📝', name: '文本工具' },
            'dev': { icon: '💻', name: '开发工具' },
            'color': { icon: '🎨', name: '颜色工具' },
            'calc': { icon: '🔢', name: '计算器' },
            'time': { icon: '⏰', name: '时间工具' },
            'image': { icon: '🖼️', name: '图片工具' },
            'file': { icon: '📁', name: '文件工具' },
            'security': { icon: '🔒', name: '安全工具' },
            'fun': { icon: '🎮', name: '娱乐工具' },
            'other': { icon: '🛠️', name: '其他工具' }
        };
        
        // 当前状态
        let currentCategory = 'all';
        let searchTerm = '';
        
        // 渲染工具列表
        function renderTools() {
            const container = document.getElementById('toolsList');
            const noResults = document.getElementById('noResults');
            
            let filtered = tools;
            
            if (currentCategory !== 'all') {
                filtered = filtered.filter(t => t.category === currentCategory);
            }
            
            if (searchTerm) {
                const term = searchTerm.toLowerCase();
                filtered = filtered.filter(t => 
                    t.name.toLowerCase().includes(term) ||
                    t.nameEn.toLowerCase().includes(term) ||
                    t.desc.toLowerCase().includes(term)
                );
            }
            
            if (filtered.length === 0) {
                container.innerHTML = '';
                noResults.classList.remove('hidden');
                return;
            }
            
            noResults.classList.add('hidden');
            
            // 按分类分组
            if (currentCategory === 'all') {
                let html = '';
                const grouped = {};
                
                filtered.forEach(tool => {
                    if (!grouped[tool.category]) {
                        grouped[tool.category] = [];
                    }
                    grouped[tool.category].push(tool);
                });
                
                Object.keys(grouped).forEach(cat => {
                    const config = categoryConfig[cat];
                    html += `
                        <div class="category-section">
                            <div class="category-header">
                                <span class="category-icon">${config.icon}</span>
                                <h2 class="category-title">${config.name}</h2>
                                <span class="category-count">${grouped[cat].length}个</span>
                            </div>
                            <div class="tools-grid">
                                ${grouped[cat].map(tool => `
                                    <a href="${tool.url}" class="tool-card" target="_blank">
                                        <span class="tool-icon">${tool.icon}</span>
                                        <div class="tool-name">${tool.name}</div>
                                        <div class="tool-name-en">${tool.nameEn}</div>
                                        <div class="tool-desc">${tool.desc}</div>
                                    </a>
                                `).join('')}
                            </div>
                        </div>
                    `;
                });
                
                container.innerHTML = html;
            } else {
                const config = categoryConfig[currentCategory];
                container.innerHTML = `
                    <div class="category-section">
                        <div class="category-header">
                            <span class="category-icon">${config.icon}</span>
                            <h2 class="category-title">${config.name}</h2>
                            <span class="category-count">${filtered.length}个</span>
                        </div>
                        <div class="tools-grid">
                            ${filtered.map(tool => `
                                <a href="${tool.url}" class="tool-card" target="_blank">
                                    <span class="tool-icon">${tool.icon}</span>
                                    <div class="tool-name">${tool.name}</div>
                                    <div class="tool-name-en">${tool.nameEn}</div>
                                    <div class="tool-desc">${tool.desc}</div>
                                </a>
                            `).join('')}
                        </div>
                    </div>
                `;
            }
        }
        
        // 分类切换
        document.querySelectorAll('.category-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentCategory = btn.dataset.category;
                renderTools();
            });
        });
        
        // 搜索
        document.getElementById('searchInput').addEventListener('input', (e) => {
            searchTerm = e.target.value.trim();
            renderTools();
        });
        
        // 初始化
        renderTools();
        
        // 加载广告
        (adsbygoogle = window.adsbygoogle || []).push({});
    </script>
