<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>分数计算器</title>
    <style>
                /* 顶部横幅广告 - 透明样式 */ .ad-banner-top { border-bottom: 1px solid #e0e0e0; padding: 6px 20px; text-align: center; min-height: 50px; display: flex; align-items: center; justify-content: center; } .ad-banner-bottom { border-top: 1px solid #e0e0e0; padding: 6px 20px; text-align: center; min-height: 50px; display: flex; align-items: center; justify-content: center; margin-top: 40px; } .ad-container { max-width: 728px; margin: 0 auto; min-height: 38px; display: flex; align-items: center; justify-content: center; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #fafafa; min-height: 100vh; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; }
        .card { background: #fff; border: 1px solid #e0e0e0; border-radius: 8px; padding: 24px; margin-bottom: 20px; }
        h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: 20px; color: #333; text-align: center; }
        .title { font-size: 1.25rem; font-weight: 600; margin-bottom: 16px; color: #333; }
        label { display: block; margin-bottom: 8px; color: #555; font-weight: 500; }
        .fraction-input { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
        .fraction-input input { width: 80px; text-align: center; }
        .fraction-input span { font-size: 1.5rem; font-weight: bold; }
        .ops-row { display: flex; justify-content: center; gap: 16px; margin: 20px 0; }
        .op-btn { width: 50px; height: 50px; border-radius: 50%; border: 2px solid #ddd; background: #fff; font-size: 1.5rem; cursor: pointer; }
        .op-btn.active { background: #007bff; color: #fff; border-color: #007bff; }
        button { background: #007bff; color: #fff; border: none; padding: 8px 20px; border-radius: 4px; cursor: pointer; margin-top: 16px; }
        button:hover { background: #0056b3; }
        button.calc-btn { background: #28a745; width: 100%; padding: 12px; font-size: 1.1rem; }
        button.calc-btn:hover { background: #218838; }
        .result { background: #f0f7ff; border: 1px solid #007bff; border-radius: 4px; padding: 16px; margin-top: 16px; text-align: center; }
        .result-label { color: #666; font-size: 0.9rem; margin-bottom: 8px; }
        .result-value { color: #007bff; font-size: 1.3rem; font-weight: 600; }
        .result-step { color: #888; font-size: 0.85rem; margin-top: 8px; }
        .error { color: #dc3545; margin-top: 8px; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="ad-banner-top"><div class="ad-container"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-XXXXXXXXXX" data-ad-slot="XXXXXX" data-ad-format="auto" data-full-width-responsive="true"></ins></div></div>
    <div class="container">
        <h1>分数计算器</h1>
        <div class="card">
            <div class="title">输入分数</div>
            
            <div class="fraction-input">
                <input type="number" id="num1" placeholder="分子" value="1">
                <span>/</span>
                <input type="number" id="den1" placeholder="分母" value="2">
            </div>
            
            <div class="ops-row">
                <button class="op-btn active" data-op="+" title="加">+</button>
                <button class="op-btn" data-op="-" title="减">−</button>
                <button class="op-btn" data-op="*" title="乘">×</button>
                <button class="op-btn" data-op="/" title="除">÷</button>
            </div>
            
            <div class="fraction-input">
                <input type="number" id="num2" placeholder="分子" value="1">
                <span>/</span>
                <input type="number" id="den2" placeholder="分母" value="4">
            </div>
            
            <button class="calc-btn" onclick="calculate()">计算</button>
            <button onclick="clearResult()" style="background:#6c757d; margin-left:10px;">清除</button>
            
            <div id="result" class="result" style="display:none;">
                <div class="result-label">计算结果</div>
                <div id="resultValue" class="result-value"></div>
                <div id="resultStep" class="result-step"></div>
            </div>
            <div id="error" class="error" style="display:none;"></div>
        </div>
        
        <div class="card">
            <div class="title">使用说明</div>
            <p style="color:#666; font-size:0.9rem; line-height:1.6;">
                1. 输入两个分数的分子和分母<br>
                2. 选择运算符（加、减、乘、除）<br>
                3. 点击"计算"查看结果<br>
                4. 结果会自动化为最简分数
            </p>
        </div>
    </div>

    <script>
        let currentOp = '+';
        
        document.querySelectorAll('.op-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.op-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentOp = this.dataset.op;
            });
        });

        function gcd(a, b) {
            a = Math.abs(a);
            b = Math.abs(b);
            while (b) {
                [a, b] = [b, a % b];
            }
            return a;
        }

        function simplify(num, den) {
            if (den < 0) {
                num = -num;
                den = -den;
            }
            const g = gcd(num, den);
            return { num: num / g, den: den / g };
        }

        function calculate() {
            const num1 = parseInt(document.getElementById('num1').value);
            const den1 = parseInt(document.getElementById('den1').value);
            const num2 = parseInt(document.getElementById('num2').value);
            const den2 = parseInt(document.getElementById('den2').value);
            
            const resultDiv = document.getElementById('result');
            const resultValue = document.getElementById('resultValue');
            const resultStep = document.getElementById('resultStep');
            const errorDiv = document.getElementById('error');
            
            resultDiv.style.display = 'none';
            errorDiv.style.display = 'none';
            
            if (isNaN(num1) || isNaN(den1) || isNaN(num2) || isNaN(den2)) {
                errorDiv.textContent = '请输入有效的数字';
                errorDiv.style.display = 'block';
                return;
            }
            
            if (den1 === 0 || den2 === 0) {
                errorDiv.textContent = '分母不能为零';
                errorDiv.style.display = 'block';
                return;
            }
            
            let resultNum, resultDen, step;
            
            switch (currentOp) {
                case '+':
                    resultNum = num1 * den2 + num2 * den1;
                    resultDen = den1 * den2;
                    step = `${num1}/${den1} + ${num2}/${den2} = ${num1 * den2}/${den1 * den2} + ${num2 * den1}/${den1 * den2} = ${resultNum}/${resultDen}`;
                    break;
                case '-':
                    resultNum = num1 * den2 - num2 * den1;
                    resultDen = den1 * den2;
                    step = `${num1}/${den1} − ${num2}/${den2} = ${resultNum}/${resultDen}`;
                    break;
                case '*':
                    resultNum = num1 * num2;
                    resultDen = den1 * den2;
                    step = `${num1}/${den1} × ${num2}/${den2} = ${resultNum}/${resultDen}`;
                    break;
                case '/':
                    if (num2 === 0) {
                        errorDiv.textContent = '除数分数的分子不能为零';
                        errorDiv.style.display = 'block';
                        return;
                    }
                    resultNum = num1 * den2;
                    resultDen = den1 * num2;
                    step = `${num1}/${den1} ÷ ${num2}/${den2} = ${num1}/${den1} × ${den2}/${num2} = ${resultNum}/${resultDen}`;
                    break;
            }
            
            const simplified = simplify(resultNum, resultDen);
            
            let displayValue;
            if (simplified.den === 1) {
                displayValue = simplified.num.toString();
            } else if (Math.abs(simplified.num) > simplified.den) {
                const whole = Math.floor(Math.abs(simplified.num) / simplified.den);
                const remain = Math.abs(simplified.num) % simplified.den;
                if (simplified.num < 0) {
                    displayValue = whole === 0 ? `${simplified.num}/${simplified.den}` : `-${whole} ${remain}/${simplified.den}`;
                } else {
                    displayValue = `${whole} ${remain}/${simplified.den}`;
                }
            } else {
                displayValue = `${simplified.num}/${simplified.den}`;
            }
            
            resultValue.textContent = displayValue;
            resultStep.textContent = `最简分数: ${simplified.num}/${simplified.den}`;
            resultDiv.style.display = 'block';
        }

        function clearResult() {
            document.getElementById('num1').value = '';
            document.getElementById('den1').value = '';
            document.getElementById('num2').value = '';
            document.getElementById('den2').value = '';
            document.getElementById('result').style.display = 'none';
            document.getElementById('error').style.display = 'none';
        }
    </script>
    <div class="ad-banner-bottom"><div class="ad-container"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-XXXXXXXXXX" data-ad-slot="XXXXXX" data-ad-format="auto" data-full-width-responsive="true"></ins></div></div>
</body>
</html>
