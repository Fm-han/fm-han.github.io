<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="随机抽奖 - FM工具箱在线工具">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://fm-han-github-io.pages.dev/lottery.html">
<title>抽奖 - FM工具箱</title>
<link rel="stylesheet" href="style.css">
<style>
.tool-container{max-width:900px;margin:20px auto;padding:0 20px;}
.tool-header{text-align:center;margin:30px 0;}
.tool-header h1{font-size:28px;color:#333;margin-bottom:8px;}
.tool-header p{color:#666;font-size:15px;}
.tool-card{background:#fff;border-radius:12px;padding:24px;margin:20px 0;box-shadow:0 2px 8px rgba(0,0,0,0.08);}
.tool-textarea{width:100%;min-height:160px;border:1px solid #e0e0e0;border-radius:8px;padding:12px;font-size:14px;font-family:monospace;resize:vertical;box-sizing:border-box;}
.tool-input{border:1px solid #e0e0e0;border-radius:8px;padding:10px 12px;font-size:14px;}
.tool-btn{background:#4285f4;color:#fff;border:none;padding:10px 24px;border-radius:8px;font-size:15px;cursor:pointer;margin:8px 8px 8px 0;}
.tool-btn:hover{background:#3367d6;}
.tool-btn.secondary{background:#f0f0f0;color:#333;}
.tool-btn.secondary:hover{background:#e0e0e0;}
.tool-result{background:#f8f9fa;border-radius:8px;padding:16px;margin-top:16px;white-space:pre-wrap;font-family:monospace;font-size:13px;max-height:400px;overflow-y:auto;display:none;}
.tool-row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;}
.tool-label{font-weight:600;color:#555;margin:12px 0 6px;font-size:14px;}
</style>
</head>
<body>
<div class="ad-banner-top"><div class="ad-container"><!-- 顶部广告 --></div></div>
<header><div class="header-content"><a href="index.html" class="logo">FM工具箱</a><div class="header-links"><a href="index.html">全部工具</a><a href="about.html">关于</a><a href="contact.html">联系</a></div></div></header>
<main class="tool-container">
<div class="tool-header"><h1>🎰 抽奖</h1><p>随机抽奖</p></div>
<div class="tool-card" id="toolCard"><div id="toolContent"></div></div>
<div class="ad-banner-bottom" style="margin-top:24px;"><div class="ad-container"><!-- 底部广告 --></div></div>
</main>
<footer><div class="footer-content"><a href="privacy.html">隐私政策</a><a href="terms.html">使用条款</a><a href="contact.html">联系我们</a></div><div class="footer-copyright">&copy; 2024 FM工具箱 | 100款免费在线工具</div></footer>
<script>
const poolIn=document.createElement('textarea');poolIn.className='tool-textarea';poolIn.placeholder='输入参与名单，每行一个...';
const countIn=document.createElement('input');countIn.type='number';countIn.value='1';countIn.min='1';countIn.style='width:80px;padding:6px;border:1px solid #e0e0e0;border-radius:6px;font-size:14px;';
const btn=document.createElement('button');btn.className='tool-btn';btn.textContent='开始抽奖';
const result=document.createElement('div');result.className='tool-result';result.style.display='none';
const anim=document.createElement('div');anim.style='font-size:32px;text-align:center;margin:16px 0;color:#4285f4;font-weight:bold;display:none;';
const c=document.getElementById('toolContent');c.innerHTML='';
c.appendChild(document.createElement('div'));c.lastChild.className='tool-label';c.lastChild.textContent='参与名单';
c.appendChild(poolIn);
c.appendChild(document.createElement('div'));c.lastChild.className='tool-label';c.lastChild.textContent='抽取人数';c.lastChild.style.marginTop='12px';
c.appendChild(countIn);
c.appendChild(document.createElement('div'));c.lastChild.style.marginTop='8px';c.lastChild.appendChild(btn);
c.appendChild(anim);
c.appendChild(result);
btn.onclick=function(){
  const names=poolIn.value.split('\n').map(s=>s.trim()).filter(s=>s);
  if(!names.length){alert('请输入参与名单');return;}
  const n=Math.min(parseInt(countIn.value)||1,names.length);
  result.style.display='none';anim.style.display='block';
  let steps=0,maxSteps=30;
  const iv=setInterval(()=>{
    anim.textContent=names[Math.floor(Math.random()*names.length)];
    steps++;if(steps>=maxSteps){clearInterval(iv);
      const winners=[];const copy=[...names];
      for(let j=0;j<n;j++){const idx=Math.floor(Math.random()*copy.length);winners.push(copy.splice(idx,1)[0]);}
      anim.style.display='none';result.style.display='block';
      result.innerHTML='<div style="font-size:18px;color:#176f2c;margin-bottom:8px;">🎉 中奖名单：</div>'+winners.map((w,i)=>'<div style="font-size:20px;padding:6px 0;">'+(i+1)+'. '+w+'</div>').join('');
    }
  },80);
};
</script>
</body>
</html>
