<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASCII艺术生成器</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#fafafa;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;padding:20px;min-height:100vh}
.container{max-width:700px;margin:0 auto}
h1{text-align:center;color:#333;margin-bottom:24px;font-size:22px}
.card{background:#fff;border:1px solid #e0e0e0;border-radius:8px;padding:24px;margin-bottom:16px}
label{display:block;font-weight:600;margin-bottom:6px;color:#555;font-size:14px}
input[type="text"],select{width:100%;padding:10px;border:1px solid #ddd;border-radius:4px;font-size:14px;box-sizing:border-box}
.btn{background:#007bff;color:#fff;border:none;padding:8px 20px;border-radius:4px;cursor:pointer;font-size:14px;margin-top:8px}
.btn:hover{background:#0056b3}
.btn-green{background:#28a745}
.btn-green:hover{background:#218838}
.output{background:#1e1e1e;color:#0f0;padding:16px;border-radius:6px;font-family:'Courier New',monospace;font-size:8px;line-height:1.1;overflow-x:auto;white-space:pre;margin-top:12px;min-height:100px}
.actions{display:flex;gap:8px;margin-top:12px}
.row{display:flex;gap:12px;margin-top:12px}
.row>div{flex:1}
</style>
</head>
<body>
<div class="container">
<h1>ASCII艺术生成器</h1>
<div class="card">
<label>输入文字（英文/数字，建议大写）</label>
<input type="text" id="textInput" placeholder="HELLO" maxlength="20">
<div class="row">
<div><label>字体风格</label>
<select id="fontSelect">
<option value="standard">Standard</option>
<option value="shadow">Shadow</option>
<option value="slant">Slant</option>
<option value="big">Big</option>
<option value="block">Block</option>
<option value="bubble">Bubble</option>
</select></div>
</div>
<button class="btn" onclick="generate()">生成ASCII艺术</button>
<div class="output" id="output">在此显示ASCII艺术字...</div>
<div class="actions">
<button class="btn btn-green" onclick="copyOutput()">复制结果</button>
<button class="btn" onclick="downloadTxt()">下载为TXT</button>
</div>
</div>
</div>

function generate(){
const text=document.getElementById('textInput').value.toUpperCase()||'HELLO';
const font=document.getElementById('fontSelect').value;
const f=fonts[font]||fonts.standard;
let lines=['','','','',''];
for(let c of text){
const ch=f[c]||f[' '];
for(let i=0;i<5;i++){lines[i]+=(ch?ch[i]||'':' ')+(c!==' '?' ':'')}
}
document.getElementById('output').textContent=lines.join('\n');
}
function copyOutput(){
navigator.clipboard.writeText(document.getElementById('output').textContent);
alert('已复制到剪贴板!');
}
function downloadTxt(){
const b=new Blob([document.getElementById('output').textContent],{type:'text/plain'});
const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='ascii-art.txt';a.click();
}
document.getElementById('textInput').addEventListener('keydown',e=>{if(e.key==='Enter')generate()});
