<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>罗马数字转换器</title>
    <style>
                /* 顶部横幅广告 - 透明样式 */ .ad-banner-top { border-bottom: 1px solid #e0e0e0; padding: 6px 20px; text-align: center; min-height: 50px; display: flex; align-items: center; justify-content: center; } .ad-banner-bottom { border-top: 1px solid #e0e0e0; padding: 6px 20px; text-align: center; min-height: 50px; display: flex; align-items: center; justify-content: center; margin-top: 40px; } .ad-container { max-width: 728px; margin: 0 auto; min-height: 38px; display: flex; align-items: center; justify-content: center; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #fafafa; min-height: 100vh; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; }
        .card { background: #fff; border: 1px solid #e0e0e0; border-radius: 8px; padding: 24px; margin-bottom: 20px; }
        h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: 20px; color: #333; text-align: center; }
        .title { font-size: 1.25rem; font-weight: 600; margin-bottom: 16px; color: #333; }
        label { display: block; margin-bottom: 8px; color: #555; font-weight: 500; }
        input, select { border: 1px solid #ddd; border-radius: 4px; padding: 8px 12px; width: 100%; box-sizing: border-box; margin-bottom: 16px; }
        button { background: #007bff; color: #fff; border: none; padding: 8px 20px; border-radius: 4px; cursor: pointer; margin-right: 10px; }
        button:hover { background: #0056b3; }
        .result { background: #f0f7ff; border: 1px solid #007bff; border-radius: 4px; padding: 16px; margin-top: 16px; font-size: 1.2rem; text-align: center; color: #007bff; font-weight: 600; }
        .tabs { display: flex; gap: 10px; margin-bottom: 16px; }
        .tab { flex: 1; padding: 10px; text-align: center; background: #f0f0f0; border-radius: 4px; cursor: pointer; border: none; }
        .tab.active { background: #007bff; color: #fff; }
        .error { color: #dc3545; margin-top: 8px; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="ad-banner-top"><div class="ad-container"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-XXXXXXXXXX" data-ad-slot="XXXXXX" data-ad-format="auto" data-full-width-responsive="true"></ins></div></div>
    <div class="container">
        <h1>罗马数字转换器</h1>
        <div class="card">
            <div class="tabs">
                <button class="tab active" onclick="switchTab('toRoman')">数字→罗马数字</button>
                <button class="tab" onclick="switchTab('toNum')">罗马数字→数字</button>
            </div>
            
            <div id="toRomanTab">
                <label>输入数字 (1-3999)</label>
                <input type="number" id="numberInput" placeholder="请输入数字" min="1" max="3999">
                <button onclick="convertToRoman()">转换</button>
                <button onclick="clearResult()" style="background:#6c757d;">清除</button>
                <div id="romanResult" class="result" style="display:none;"></div>
                <div id="romanError" class="error" style="display:none;"></div>
            </div>
            
            <div id="toNumTab" style="display:none;">
                <label>输入罗马数字</label>
                <input type="text" id="romanInput" placeholder="请输入罗马数字 (如: XIV)">
                <button onclick="convertToNumber()">转换</button>
                <button onclick="clearResult()" style="background:#6c757d;">清除</button>
                <div id="numResult" class="result" style="display:none;"></div>
                <div id="numError" class="error" style="display:none;"></div>
            </div>
        </div>
        
        <div class="card">
            <div class="title">罗马数字对照表</div>
            <div style="display:grid; grid-template-columns: repeat(4, 1fr); gap: 8px; font-size: 0.9rem;">
                <div>I = 1</div><div>IV = 4</div><div>V = 5</div><div>IX = 9</div>
                <div>X = 10</div><div>XL = 40</div><div>L = 50</div><div>XC = 90</div>
                <div>C = 100</div><div>CD = 400</div><div>D = 500</div><div>CM = 900</div>
                <div>M = 1000</div><div></div><div></div><div></div>
            </div>
        </div>
    </div>

    <script>
        const romanMap = [
            ['M', 1000], ['CM', 900], ['D', 500], ['CD', 400],
            ['C', 100], ['XC', 90], ['L', 50], ['XL', 40],
            ['X', 10], ['IX', 9], ['V', 5], ['IV', 4], ['I', 1]
        ];

        function switchTab(tab) {
            document.getElementById('toRomanTab').style.display = tab === 'toRoman' ? 'block' : 'none';
            document.getElementById('toNumTab').style.display = tab === 'toNum' ? 'block' : 'none';
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
        }

        function convertToRoman() {
            const num = parseInt(document.getElementById('numberInput').value);
            const resultDiv = document.getElementById('romanResult');
            const errorDiv = document.getElementById('romanError');
            
            resultDiv.style.display = 'none';
            errorDiv.style.display = 'none';
            
            if (isNaN(num) || num < 1 || num > 3999) {
                errorDiv.textContent = '请输入 1 到 3999 之间的整数';
                errorDiv.style.display = 'block';
                return;
            }
            
            let roman = '';
            for (const [letter, value] of romanMap) {
                while (num >= value) {
                    roman += letter;
                }
            }
            
            resultDiv.textContent = roman;
            resultDiv.style.display = 'block';
        }

        function convertToNumber() {
            const roman = document.getElementById('romanInput').value.toUpperCase().trim();
            const resultDiv = document.getElementById('numResult');
            const errorDiv = document.getElementById('numError');
            
            resultDiv.style.display = 'none';
            errorDiv.style.display = 'none';
            
            if (!roman) {
                errorDiv.textContent = '请输入罗马数字';
                errorDiv.style.display = 'block';
                return;
            }
            
            if (!/^[IVXLCDM]+$/.test(roman)) {
                errorDiv.textContent = '无效的罗马数字格式';
                errorDiv.style.display = 'block';
                return;
            }
            
            let result = 0;
            let i = 0;
            
            for (const [letter, value] of romanMap) {
                while (roman.slice(i, i + letter.length) === letter) {
                    result += value;
                    i += letter.length;
                }
            }
            
            if (i !== roman.length) {
                errorDiv.textContent = '无效的罗马数字';
                errorDiv.style.display = 'block';
                return;
            }
            
            // 验证转换回去是否相同
            const verify = numberToRoman(result);
            if (verify !== roman.toUpperCase()) {
                errorDiv.textContent = '无效的罗马数字';
                errorDiv.style.display = 'block';
                return;
            }
            
            resultDiv.textContent = result;
            resultDiv.style.display = 'block';
        }

        function numberToRoman(num) {
            let roman = '';
            for (const [letter, value] of romanMap) {
                while (num >= value) {
                    roman += letter;
                }
            }
            return roman;
        }

        function clearResult() {
            document.getElementById('numberInput').value = '';
            document.getElementById('romanInput').value = '';
            document.getElementById('romanResult').style.display = 'none';
            document.getElementById('numResult').style.display = 'none';
            document.getElementById('romanError').style.display = 'none';
            document.getElementById('numError').style.display = 'none';
        }
    </script>
    <div class="ad-banner-bottom"><div class="ad-container"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-XXXXXXXXXX" data-ad-slot="XXXXXX" data-ad-format="auto" data-full-width-responsive="true"></ins></div></div>
</body>
</html>
