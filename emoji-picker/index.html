<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Emoji表情选择器</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#fafafa;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;padding:20px;min-height:100vh}
.container{max-width:700px;margin:0 auto}
h1{text-align:center;color:#333;margin-bottom:20px;font-size:22px}
.card{background:#fff;border:1px solid #e0e0e0;border-radius:8px;padding:24px;margin-bottom:16px}
.search{width:100%;padding:10px;border:1px solid #ddd;border-radius:4px;font-size:15px;box-sizing:border-box;margin-bottom:12px}
.categories{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.cat-btn{padding:6px 14px;border:1px solid #ddd;background:#fff;border-radius:20px;cursor:pointer;font-size:13px}
.cat-btn.active{background:#007bff;color:#fff;border-color:#007bff}
.emoji-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;max-height:400px;overflow-y:auto}
.emoji-item{font-size:24px;padding:8px;text-align:center;cursor:pointer;border-radius:6px;transition:background .15s}
.emoji-item:hover{background:#e9ecef}
.picked{min-height:50px;background:#f5f5f5;border-radius:6px;padding:12px;margin-top:12px;font-size:20px;word-break:break-all;min-height:60px}
.btn{background:#007bff;color:#fff;border:none;padding:8px 20px;border-radius:4px;cursor:pointer;font-size:14px;margin-top:8px}
.btn:hover{background:#0056b3}
.btn-green{background:#28a745}
.btn-green:hover{background:#218838}
.actions{display:flex;gap:8px;margin-top:12px}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 20px;border-radius:6px;display:none;z-index:99}
</style>
</head>
<body>
<div class="container">
<h1>Emoji表情选择器</h1>
<div class="card">
<input type="text" class="search" id="searchInput" placeholder="搜索Emoji...">
<div class="categories" id="catBar"></div>
<div class="emoji-grid" id="emojiGrid"></div>
</div>
<div class="card">
<label style="font-weight:600;color:#555;margin-bottom:8px;display:block">已选择的Emoji</label>
<div class="picked" id="picked"></div>
<div class="actions">
<button class="btn" onclick="copyPicked()">复制全部</button>
<button class="btn btn-green" onclick="clearPicked()">清空</button>
</div>
</div>
</div>
<div class="toast" id="toast">已复制到剪贴板!</div>
<script>
const emojis={
'😀 笑脸':['😀','😁','😂','🤣','😃','😄','😅','😆','😉','😊','😋','😎','😍','😘','🥰','😗','😙','😚','🙂','🤗','🤩','🤔','🤨','😐','😑','😶','🙄','😏','😣','😥','😮','🤐','😯','😪','😫','😴','😌','😛','😜','😝','🤤','😒','😓','😔','😕','🙃','🤑','😲','🙁','😖','😞','😟','😤','😢','😭','😦','😧','😨','😩','🤯','😬','😰','😱','🥵','🥶','😳','🤪','😵','🥴','😠','😡','🤬','😷','🤒','🤕','🤢','🤮','🥺','🥹','😇','🤠','🤡','🥳','🥸','😈','👿','👹','👺','💀','☠️','👻','👽','👾','🤖'],
'👋 手势':['👋','🤚','🖐','✋','🖖','👌','🤌','🤏','✌️','🤞','🤟','🤘','🤙','👈','👉','👆','🖕','👇','☝️','👍','👎','✊','👊','🤛','🤜','👏','🙌','👐','🤲','🤝','🙏'],
'❤️ 爱心':['❤️','🧡','💛','💚','💙','💜','🖤','🤍','🤎','💔','❣️','💕','💞','💓','💗','💖','💘','💝'],
'🐱 动物':['🐶','🐱','🐭','🐹','🐰','🦊','🐻','🐼','🐨','🐯','🦁','🐮','🐷','🐸','🐵','🐔','🐧','🐦','🦅','🦆','🦉','🐴','🦄','🐝','🐛','🦋','🐌','🐞','🐜','🪲','🐢','🐍','🦎','🦂','🐙','🦑','🦐','🦞','🐡','🐠','🐟','🐬','🐳','🐋','🦈','🐊','🐅','🐆','🦓','🦍','🐘','🦏','🐪','🐫','🦒','🦘','🐃','🐂','🐄','🐎','🐖','🐏','🐑','🦙','🐐','🦌','🐕','🐩','🦮'],
'🍎 食物':['🍎','🍊','🍋','🍌','🍉','🍇','🍓','🫐','🍈','🍒','🍑','🥭','🍍','🥥','🥝','🍅','🍆','🥑','🥦','🥬','🌶','🫑','🌽','🥕','🧄','🧅','🥔','🍠','🥐','🥯','🍞','🥖','🥨','🧀','🥚','🍳','🧈','🥞','🧇','🥓','🥩','🍗','🍖','🌭','🍔','🍟','🍕','🫓','🥪','🥙','🧆','🌮','🌯','🫔','🥗','🥘','🍝','🍜','🍲','🍛','🍣','🍱','🥟','🦪','🍤','🍙','🍚','🍘','🍥','🥠','🥮'],
'⚽ 活动':['⚽','🏀','🏈','⚾','🥎','🎾','🏐','🏉','🥏','🎱','🪀','🏓','🏸','🏒','🏑','🥍','🏏','🪃','🥅','⛳','🪁','🏹','🎣','🤿','🥊','🥋','🎽','🛹','🛷','⛸','🥌','🎿','⛷','🏂','🪂'],
'🏠 物品':['🏠','🏡','🏢','🏣','🏤','🏥','🏦','🏨','🏩','🏪','🏫','🏬','🏭','🗼','🗽','⛪','🕌','🛕','🕍','⛩','🕋','⛲','⛺','🏕','🏔','⛰','🌋','🏝','🏖','🏜','🏞','🌅','🌄','🌠','🎇','🎆','🌈','🌆','🌇','🏙','🌃','🌌','🌉','🌁'],
'💻 科技':['💻','🖥','🖨','⌨️','🖱','🖲','💽','💾','💿','📀','📼','📷','📸','📹','🎥','📽','🎞','📞','☎️','📟','📠','📺','📻','🎙','🎚','🎛','🧭','⏱','⏲','⏰','🕰','⌛','⏳','📡','🔋','🪫','🔌','💡','🔦','🕯','🪔','🧯','🛢','💸','💵','💴','💶','💷','🪙','💰','💳','💎'],
'🚗 交通':['🚗','🚕','🚙','🚌','🚎','🏎','🚓','🚑','🚒','🚐','🛻','🚚','🚛','🚜','🏍','🛵','🚲','🛴','🛹','🚏','🛣','🛤','🚥','🚦','🚧','⚓','🛟','⛵','🛶','🚤','🛳','⛴','🛥','🚢','✈️','🛩','🛫','🛬','🪂','💺','🚁','🚟','🚠','🚡','🛰','🚀','🛸'],
'🎨 符号':['✅','❌','❓','❗','‼️','⁉️','💯','🔺','🔻','🔸','🔹','🔶','🔷','🔳','🔲','⭕','⛔','🚫','💥','💫','💦','💨','🕳','💣','💬','💭','🗯','♠️','♣️','♥️','♦️','🃏','🎴','🕐','🕑','🕒','🕓','🕔','🕕','🕖','🕗','🕘','🕙','🕚','🕛']
};
let picked=[];
const catBar=document.getElementById('catBar');
const grid=document.getElementById('emojiGrid');
const searchInput=document.getElementById('searchInput');
let currentCat=Object.keys(emojis)[0];
function renderCats(){
catBar.innerHTML='';
Object.keys(emojis).forEach(cat=>{
const btn=document.createElement('div');
btn.className='cat-btn'+(cat===currentCat?' active':'');
btn.textContent=cat.split(' ')[0];
btn.title=cat;
btn.onclick=()=>{currentCat=cat;renderCats();renderEmojis(emojis[cat])};
catBar.appendChild(btn);
});
}
function renderEmojis(list){
grid.innerHTML='';
list.forEach(e=>{
const d=document.createElement('div');
d.className='emoji-item';
d.textContent=e;
d.onclick=()=>{picked.push(e);renderPicked()};
grid.appendChild(d);
});
}
function renderPicked(){document.getElementById('picked').textContent=picked.join('')}
function copyPicked(){
if(!picked.length)return;
navigator.clipboard.writeText(picked.join(' '));
const t=document.getElementById('toast');t.style.display='block';setTimeout(()=>t.style.display='none',1500);
}
function clearPicked(){picked=[];renderPicked()}
searchInput.addEventListener('input',e=>{
const q=e.target.value.toLowerCase();
if(!q){renderEmojis(emojis[currentCat]);return}
const all=Object.values(emojis).flat();
const filtered=all.filter(e=>e.includes(q));
renderEmojis(filtered.length?filtered:all);
});
renderCats();renderEmojis(emojis[currentCat]);
</script>
</body>
</html>
