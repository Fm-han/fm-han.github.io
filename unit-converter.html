<script>
var units=[{name:"长度",items:[["米(m)",1],["千米(km)",1000],["厘米(cm)",0.01],["毫米(mm)",0.001],["英寸(in)",0.0254],["英尺(ft)",0.3048],["英里(mi)",1609.344]]},{name:"重量",items:[["千克(kg)",1],["克(g)",0.001],["毫克(mg)",0.000001],["磅(lb)",0.453592],["盎司(oz)",0.0283495]]},{name:"面积",items:[["平方米(m²)",1],["平方千米(km²)",1e6],["公顷(ha)",1e4],["亩",666.667],["平方英尺(ft²)",0.092903]]},{name:"温度",items:[]}];
document.getElementById("toolContent").innerHTML='<div class="tool-row"><label>类型：</label><select id="cat" onchange="updateUnits()"><option value="0">长度</option><option value="1">重量</option><option value="2">面积</option><option value="3">温度</option></select></div><div class="tool-row" style="margin-top:12px"><input type="number" class="tool-input" id="val" style="width:150px" value="1" oninput="go()"><select id="from" onchange="go()"></select><span style="margin:0 8px;font-size:18px">=</span><span id="result" style="font-size:20px;font-weight:bold;color:#4285f4">0</span><select id="to" onchange="go()"></select></div>';
function updateUnits(){var cat=document.getElementById("cat").value;var u=units[cat].items;var opts="";u.forEach(function(item,i){opts+="<option value=\""+i+"\">"+item[0]+"</option>";});document.getElementById("from").innerHTML=opts;document.getElementById("to").innerHTML=opts;if(u.length>1)document.getElementById("to").selectedIndex=1;go();}
function go(){var cat=+document.getElementById("cat").value;var val=+document.getElementById("val").value;var fi=+document.getElementById("from").value;var ti=+document.getElementById("to").value;if(cat===3){var temps=["C","F","K"];var inT=temps[fi];var outT=temps[ti];var c;if(inT==="C")c=val;else if(inT==="F")c=(val-32)*5/9;else c=val-273.15;var r;if(outT==="C")r=c;else if(outT==="F")r=c*9/5+32;else r=c+273.15;document.getElementById("result").innerText=r.toFixed(2);}else{var factor=units[cat].items[fi][1];var toFactor=units[cat].items[ti][1];var r=val*factor/toFactor;document.getElementById("result").innerText=r.toPrecision(10);}}
updateUnits();

</script>
