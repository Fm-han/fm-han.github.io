<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>密码强度检测器</title>
    <style>
                /* 顶部横幅广告 - 透明样式 */ .ad-banner-top { border-bottom: 1px solid #e0e0e0; padding: 6px 20px; text-align: center; min-height: 50px; display: flex; align-items: center; justify-content: center; } .ad-banner-bottom { border-top: 1px solid #e0e0e0; padding: 6px 20px; text-align: center; min-height: 50px; display: flex; align-items: center; justify-content: center; margin-top: 40px; } .ad-container { max-width: 728px; margin: 0 auto; min-height: 38px; display: flex; align-items: center; justify-content: center; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #fafafa; min-height: 100vh; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; }
        .card { background: #fff; border: 1px solid #e0e0e0; border-radius: 8px; padding: 24px; margin-bottom: 20px; }
        h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: 20px; color: #333; text-align: center; }
        .title { font-size: 1.25rem; font-weight: 600; margin-bottom: 16px; color: #333; }
        label { display: block; margin-bottom: 8px; color: #555; font-weight: 500; }
        .password-input { position: relative; }
        input { border: 1px solid #ddd; border-radius: 4px; padding: 8px 12px; width: 100%; box-sizing: border-box; margin-bottom: 16px; }
        .password-input input { padding-right: 45px; }
        .toggle-visibility { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #666; font-size: 1.2rem; }
        .strength-bar { height: 8px; background: #e0e0e0; border-radius: 4px; margin: 16px 0; overflow: hidden; }
        .strength-fill { height: 100%; border-radius: 4px; transition: all 0.3s; }
        .strength-fill.weak { width: 25%; background: #dc3545; }
        .strength-fill.fair { width: 50%; background: #ffc107; }
        .strength-fill.good { width: 75%; background: #17a2b8; }
        .strength-fill.strong { width: 100%; background: #28a745; }
        .strength-text { text-align: center; font-weight: 600; font-size: 1.1rem; margin-bottom: 16px; }
        .strength-text.weak { color: #dc3545; }
        .strength-text.fair { color: #ffc107; }
        .strength-text.good { color: #17a2b8; }
        .strength-text.strong { color: #28a745; }
        .criteria { margin-top: 16px; }
        .criteria-item { display: flex; align-items: center; padding: 8px 0; border-bottom: 1px solid #f0f0f0; }
        .criteria-item:last-child { border-bottom: none; }
        .criteria-icon { width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-right: 12px; font-size: 0.9rem; }
        .criteria-icon.pass { background: #d4edda; color: #155724; }
        .criteria-icon.fail { background: #f8d7da; color: #721c24; }
        .criteria-text { color: #555; }
        .tips { background: #f8f9fa; padding: 16px; border-radius: 4px; margin-top: 16px; }
        .tips-title { font-weight: 600; margin-bottom: 8px; }
        .tips-list { color: #666; font-size: 0.9rem; padding-left: 20px; }
        .tips-list li { margin-bottom: 4px; }
        .score-display { text-align: center; padding: 16px; background: #f8f9fa; border-radius: 4px; margin-top: 16px; }
        .score-number { font-size: 2rem; font-weight: 700; color: #007bff; }
        .score-label { color: #666; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="ad-banner-top"><div class="ad-container"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-XXXXXXXXXX" data-ad-slot="XXXXXX" data-ad-format="auto" data-full-width-responsive="true"></ins></div></div>
    <div class="container">
        <h1>密码强度检测器</h1>
        <div class="card">
            <label>输入密码</label>
            <div class="password-input">
                <input type="password" id="password" placeholder="请输入密码进行检测" oninput="checkStrength()">
                <span class="toggle-visibility" onclick="toggleVisibility()">👁️</span>
            </div>
            
            <div id="strengthBar" class="strength-bar" style="display:none;">
                <div id="strengthFill" class="strength-fill"></div>
            </div>
            <div id="strengthText" class="strength-text" style="display:none;"></div>
            
            <div id="criteria" class="criteria" style="display:none;">
                <div class="criteria-item">
                    <span id="critLen" class="criteria-icon"></span>
                    <span class="criteria-text">至少 8 个字符</span>
                </div>
                <div class="criteria-item">
                    <span id="critUpper" class="criteria-icon"></span>
                    <span class="criteria-text">包含大写字母 (A-Z)</span>
                </div>
                <div class="criteria-item">
                    <span id="critLower" class="criteria-icon"></span>
                    <span class="criteria-text">包含小写字母 (a-z)</span>
                </div>
                <div class="criteria-item">
                    <span id="critNumber" class="criteria-icon"></span>
                    <span class="criteria-text">包含数字 (0-9)</span>
                </div>
                <div class="criteria-item">
                    <span id="critSpecial" class="criteria-icon"></span>
                    <span class="criteria-text">包含特殊字符 (!@#$%^&*)</span>
                </div>
            </div>
            
            <div id="scoreDisplay" class="score-display" style="display:none;">
                <div id="scoreNumber" class="score-number">0</div>
                <div class="score-label">安全评分 (0-100)</div>
            </div>
        </div>
        
        <div class="card">
            <div class="tips-title">安全密码建议</div>
            <ul class="tips-list">
                <li>长度至少 12-16 个字符</li>
                <li>混合使用大小写字母、数字和特殊符号</li>
                <li>避免使用个人信息（生日、姓名等）</li>
                <li>不要在多个网站使用相同密码</li>
                <li>建议使用密码管理器生成随机密码</li>
            </ul>
        </div>
    </div>

    <script>
        function toggleVisibility() {
            const input = document.getElementById('password');
            input.type = input.type === 'password' ? 'text' : 'password';
        }

        function checkStrength() {
            const password = document.getElementById('password').value;
            
            if (!password) {
                document.getElementById('strengthBar').style.display = 'none';
                document.getElementById('strengthText').style.display = 'none';
                document.getElementById('criteria').style.display = 'none';
                document.getElementById('scoreDisplay').style.display = 'none';
                return;
            }
            
            document.getElementById('strengthBar').style.display = 'block';
            document.getElementById('strengthText').style.display = 'block';
            document.getElementById('criteria').style.display = 'block';
            document.getElementById('scoreDisplay').style.display = 'block';
            
            // Check criteria
            const hasLen = password.length >= 8;
            const hasUpper = /[A-Z]/.test(password);
            const hasLower = /[a-z]/.test(password);
            const hasNumber = /[0-9]/.test(password);
            const hasSpecial = /[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]/.test(password);
            
            // Update criteria icons
            document.getElementById('critLen').textContent = hasLen ? '✓' : '✗';
            document.getElementById('critLen').className = 'criteria-icon ' + (hasLen ? 'pass' : 'fail');
            
            document.getElementById('critUpper').textContent = hasUpper ? '✓' : '✗';
            document.getElementById('critUpper').className = 'criteria-icon ' + (hasUpper ? 'pass' : 'fail');
            
            document.getElementById('critLower').textContent = hasLower ? '✓' : '✗';
            document.getElementById('critLower').className = 'criteria-icon ' + (hasLower ? 'pass' : 'fail');
            
            document.getElementById('critNumber').textContent = hasNumber ? '✓' : '✗';
            document.getElementById('critNumber').className = 'criteria-icon ' + (hasNumber ? 'pass' : 'fail');
            
            document.getElementById('critSpecial').textContent = hasSpecial ? '✓' : '✗';
            document.getElementById('critSpecial').className = 'criteria-icon ' + (hasSpecial ? 'pass' : 'fail');
            
            // Calculate strength
            let score = 0;
            let strength = 'weak';
            let strengthClass = 'weak';
            
            if (hasLen) score += 20;
            if (hasUpper) score += 20;
            if (hasLower) score += 20;
            if (hasNumber) score += 20;
            if (hasSpecial) score += 20;
            
            // Bonus for length
            if (password.length >= 12) score += 10;
            if (password.length >= 16) score += 10;
            
            // Penalty for repeating patterns
            if (/(.)\1{2,}/.test(password)) score -= 10;
            
            // Penalty for sequential characters
            if (/123|234|345|456|567|678|789|abc|bcd|cde|def|efg|fgh|ghi|ijk|jkl|klm|lmn|mno|nop|opq|pqr|qrs|rst|stu|tuv|uvw|vwx|wxy|xyz/i.test(password)) score -= 10;
            
            score = Math.max(0, Math.min(100, score));
            
            if (score >= 80) {
                strength = '非常强';
                strengthClass = 'strong';
            } else if (score >= 60) {
                strength = '强';
                strengthClass = 'good';
            } else if (score >= 40) {
                strength = '中等';
                strengthClass = 'fair';
            } else {
                strength = '弱';
                strengthClass = 'weak';
            }
            
            document.getElementById('strengthFill').className = 'strength-fill ' + strengthClass;
            document.getElementById('strengthText').textContent = strength;
            document.getElementById('strengthText').className = 'strength-text ' + strengthClass;
            document.getElementById('scoreNumber').textContent = score;
        }
    </script>
    <div class="ad-banner-bottom"><div class="ad-container"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-XXXXXXXXXX" data-ad-slot="XXXXXX" data-ad-format="auto" data-full-width-responsive="true"></ins></div></div>
</body>
</html>
