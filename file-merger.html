<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文件合并器 - 免费在线工具</title>
<style>
                /* 顶部横幅广告 - 透明样式 */ .ad-banner-top { border-bottom: 1px solid #e0e0e0; padding: 6px 20px; text-align: center; min-height: 50px; display: flex; align-items: center; justify-content: center; } .ad-banner-bottom { border-top: 1px solid #e0e0e0; padding: 6px 20px; text-align: center; min-height: 50px; display: flex; align-items: center; justify-content: center; margin-top: 40px; } .ad-container { max-width: 728px; margin: 0 auto; min-height: 38px; display: flex; align-items: center; justify-content: center; }
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:#fafafa; color:#333; min-height:100vh; }
.header { background:#fff; border-bottom:1px solid #e0e0e0; padding:16px 24px; display:flex; align-items:center; justify-content:space-between; }
.header h1 { font-size:1.25rem; font-weight:600; }
.back-link { color:#007bff; text-decoration:none; font-size:0.9rem; }
.back-link:hover { text-decoration:underline; }
.container { max-width:900px; margin:32px auto; padding:0 16px; }
.card { background:#fff; border:1px solid #e0e0e0; border-radius:8px; padding:24px; margin-bottom:20px; }
.card h2 { font-size:1.25rem; font-weight:600; margin-bottom:16px; color:#333; }
.card p { color:#666; font-size:0.95rem; margin-bottom:16px; line-height:1.6; }
.btn-primary { background:#007bff; color:#fff; border:none; padding:8px 20px; border-radius:4px; cursor:pointer; font-size:0.95rem; }
.btn-primary:hover { background:#0056b3; }
.btn-secondary { background:#28a745; color:#fff; border:none; padding:8px 20px; border-radius:4px; cursor:pointer; font-size:0.95rem; }
.btn-secondary:hover { background:#1e7e34; }
.btn-danger { background:#dc3545; color:#fff; border:none; padding:8px 20px; border-radius:4px; cursor:pointer; font-size:0.95rem; }
.btn-danger:hover { background:#c82333; }
label { display:block; font-size:0.9rem; color:#555; margin-bottom:6px; font-weight:500; }
select, input[type="text"] { border:1px solid #ddd; border-radius:4px; padding:8px 12px; width:100%; box-sizing:border-box; font-size:0.95rem; }
.file-list { margin-top:16px; }
.file-item { display:flex; align-items:center; justify-content:space-between; padding:10px 12px; border:1px solid #e0e0e0; border-radius:4px; margin-bottom:8px; font-size:0.9rem; }
.file-item .name { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-right:12px; }
.file-item .size { color:#888; font-size:0.8rem; margin-right:12px; }
.file-item .remove { color:#dc3545; cursor:pointer; font-size:0.85rem; background:none; border:none; }
.file-item .remove:hover { text-decoration:underline; }
.info { font-size:0.85rem; color:#888; margin-top:8px; }
.drop-zone { border:2px dashed #ddd; border-radius:8px; padding:32px; text-align:center; color:#888; cursor:pointer; margin-top:12px; }
.drop-zone:hover { border-color:#007bff; color:#007bff; }
</style>
</head>
<body>
    <div class="ad-banner-top"><div class="ad-container"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-XXXXXXXXXX" data-ad-slot="XXXXXX" data-ad-format="auto" data-full-width-responsive="true"></ins></div></div>
<div class="header">
  <h1>文件合并器</h1>
  <a href="https://fm-han.github.io" class="back-link">← 返回工具站</a>
</div>
<div class="container">
  <div class="card">
    <h2>文件合并器</h2>
    <p>上传多个文件，按顺序合并成一个文件。支持文本文件合并，或二进制文件拼接。</p>
    <div class="drop-zone" id="dropZone">
      点击或拖拽文件到此处添加文件
      <input type="file" id="fileInput" multiple style="display:none;">
    </div>
    <div class="file-list" id="fileList"></div>
    <div style="margin-top:16px;">
      <label>合并模式</label>
      <select id="mergeMode" style="margin-top:6px;">
        <option value="binary">二进制拼接（适用于任何文件）</option>
        <option value="text">文本合并（添加换行符）</option>
        <option value="text-comma">文本合并（逗号分隔）</option>
      </select>
    </div>
    <div style="margin-top:16px;">
      <label>输出文件名</label>
      <input type="text" id="outputName" value="merged.bin" style="margin-top:6px;">
    </div>
    <div style="margin-top:16px;">
      <button class="btn-primary" onclick="mergeFiles()">合并文件</button>
      <button class="btn-danger" onclick="clearAll()" style="margin-left:8px;">清空列表</button>
    </div>
    <div class="info" id="info"></div>
  </div>
  <div class="card" id="resultCard" style="display:none;">
    <h2>合并结果</h2>
    <div class="info" id="resultInfo"></div>
    <div style="margin-top:16px;">
      <button class="btn-secondary" onclick="downloadMerged()">下载合并文件</button>
    </div>
  </div>
</div>
<script>
let files = [];
let mergedBlob = null;
const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');

dropZone.addEventListener('click', () => fileInput.click());
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.style.borderColor='#007bff'; dropZone.style.color='#007bff'; });
dropZone.addEventListener('dragleave', () => { dropZone.style.borderColor='#ddd'; dropZone.style.color='#888'; });
dropZone.addEventListener('drop', e => { e.preventDefault(); dropZone.style.borderColor='#ddd'; dropZone.style.color='#888'; addFiles(e.dataTransfer.files); });
fileInput.addEventListener('change', () => { addFiles(fileInput.files); fileInput.value=''; });

function addFiles(newFiles) {
  for (let f of newFiles) files.push(f);
  renderList();
}

function renderList() {
  const list = document.getElementById('fileList');
  list.innerHTML = '';
  files.forEach((f, i) => {
    const item = document.createElement('div');
    item.className = 'file-item';
    item.innerHTML = '<span class="name">' + (i+1) + '. ' + f.name + '</span><span class="size">' + (f.size/1024).toFixed(1) + 'KB</span><button class="remove" onclick="removeFile(' + i + ')">移除</button>';
    list.appendChild(item);
  });
  document.getElementById('info').textContent = '共 ' + files.length + ' 个文件，总大小：' + (files.reduce((s,f)=>s+f.size,0)/1024/1024).toFixed(2) + 'MB';
}

function removeFile(i) { files.splice(i,1); renderList(); }
function clearAll() { files=[]; renderList(); mergedBlob=null; document.getElementById('resultCard').style.display='none'; }

async function mergeFiles() {
  if (files.length < 2) { alert('请至少添加2个文件'); return; }
  const mode = document.getElementById('mergeMode').value;
  if (mode === 'binary') {
    const bufs = await Promise.all(files.map(f => f.arrayBuffer()));
    mergedBlob = new Blob(bufs);
  } else {
    const texts = await Promise.all(files.map(f => f.text()));
    const sep = mode === 'text' ? '\n' : ',';
    mergedBlob = new Blob([texts.join(sep)]);
  }
  const name = document.getElementById('outputName').value || 'merged.bin';
  document.getElementById('resultCard').style.display = 'block';
  document.getElementById('resultInfo').textContent = '合并完成：' + files.length + ' 个文件 → ' + name + '（' + (mergedBlob.size/1024).toFixed(1) + 'KB）';
}

function downloadMerged() {
  if (!mergedBlob) return;
  const name = document.getElementById('outputName').value || 'merged.bin';
  const a = document.createElement('a');
  a.href = URL.createObjectURL(mergedBlob);
  a.download = name;
  a.click();
}
</script>

</html>
