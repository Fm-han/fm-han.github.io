<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>颜色对比度检查器</title>
    <style>
                /* 顶部横幅广告 - 透明样式 */ .ad-banner-top { border-bottom: 1px solid #e0e0e0; padding: 6px 20px; text-align: center; min-height: 50px; display: flex; align-items: center; justify-content: center; } .ad-banner-bottom { border-top: 1px solid #e0e0e0; padding: 6px 20px; text-align: center; min-height: 50px; display: flex; align-items: center; justify-content: center; margin-top: 40px; } .ad-container { max-width: 728px; margin: 0 auto; min-height: 38px; display: flex; align-items: center; justify-content: center; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #fafafa; min-height: 100vh; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; }
        .card { background: #fff; border: 1px solid #e0e0e0; border-radius: 8px; padding: 24px; margin-bottom: 20px; }
        h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: 20px; color: #333; text-align: center; }
        .title { font-size: 1.25rem; font-weight: 600; margin-bottom: 16px; color: #333; }
        label { display: block; margin-bottom: 8px; color: #555; font-weight: 500; }
        input { border: 1px solid #ddd; border-radius: 4px; padding: 8px 12px; width: 100%; box-sizing: border-box; margin-bottom: 16px; }
        .color-input-group { display: grid; grid-template-columns: 1fr auto; gap: 12px; margin-bottom: 16px; }
        .color-preview { width: 60px; height: 40px; border-radius: 4px; border: 1px solid #ddd; cursor: pointer; }
        .color-picker { position: absolute; opacity: 0; width: 0; height: 0; }
        button { background: #007bff; color: #fff; border: none; padding: 8px 20px; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
        button.check-btn { background: #28a745; width: 100%; padding: 12px; font-size: 1.1rem; }
        .preview-box { margin-top: 16px; padding: 24px; border-radius: 8px; text-align: center; }
        .preview-text { font-size: 1.2rem; font-weight: 600; }
        .preview-text.small { font-size: 1rem; font-weight: 400; margin-top: 8px; }
        .result { background: #f0f7ff; border: 1px solid #007bff; border-radius: 4px; padding: 16px; margin-top: 16px; }
        .ratio-display { text-align: center; font-size: 2rem; font-weight: 700; color: #007bff; margin-bottom: 16px; }
        .grade-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
        .grade-item { text-align: center; padding: 12px 8px; border-radius: 4px; background: #f8f9fa; }
        .grade-pass { background: #d4edda; color: #155724; }
        .grade-fail { background: #f8d7da; color: #721c24; }
        .grade-label { font-size: 0.8rem; color: #666; }
        .grade-value { font-size: 1.1rem; font-weight: 700; }
        .error { color: #dc3545; margin-top: 8px; font-size: 0.9rem; }
        .wcag-info { font-size: 0.85rem; color: #666; line-height: 1.5; margin-top: 12px; }
    </style>
</head>
<body>
    <div class="ad-banner-top"><div class="ad-container"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-XXXXXXXXXX" data-ad-slot="XXXXXX" data-ad-format="auto" data-full-width-responsive="true"></ins></div></div>
    <div class="container">
        <h1>颜色对比度检查器</h1>
        <div class="card">
            <label>前景色（文字颜色）</label>
            <div class="color-input-group">
                <input type="text" id="fgColor" value="#000000" placeholder="#000000" oninput="updatePreview()">
                <div class="color-preview" id="fgPreview" style="background:#000000;" onclick="document.getElementById('fgPicker').click()"></div>
                <input type="color" id="fgPicker" class="color-picker" value="#000000" oninput="setFgColor(this.value)">
            </div>
            
            <label>背景色</label>
            <div class="color-input-group">
                <input type="text" id="bgColor" value="#ffffff" placeholder="#ffffff" oninput="updatePreview()">
                <div class="color-preview" id="bgPreview" style="background:#ffffff; border:1px solid #ddd;" onclick="document.getElementById('bgPicker').click()"></div>
                <input type="color" id="bgPicker" class="color-picker" value="#ffffff" oninput="setBgColor(this.value)">
            </div>
            
            <button class="check-btn" onclick="checkContrast()">检查对比度</button>
            
            <div id="previewBox" class="preview-box" style="display:none; background:#ffffff;">
                <div id="previewText" class="preview-text" style="color:#000000;">这是大文本 (18pt+)</div>
                <div id="previewTextSmall" class="preview-text small" style="color:#000000;">这是正常文本 (小于18pt)</div>
            </div>
            
            <div id="result" class="result" style="display:none;">
                <div id="ratioDisplay" class="ratio-display"></div>
                <div class="grade-grid" id="gradeGrid"></div>
            </div>
            <div id="error" class="error" style="display:none;"></div>
        </div>
        
        <div class="card">
            <div class="title">WCAG 标准说明</div>
            <div class="wcag-info">
                <strong>AA级</strong>（最低要求）: 正常文本 ≥ 4.5:1, 大文本 ≥ 3:1<br>
                <strong>AAA级</strong>（更高要求）: 正常文本 ≥ 7:1, 大文本 ≥ 4.5:1<br><br>
                大文本指: 18pt+ 或 14pt+加粗
            </div>
        </div>
    </div>

    <script>
        function setFgColor(color) {
            document.getElementById('fgColor').value = color;
            document.getElementById('fgPreview').style.background = color;
            updatePreview();
        }

        function setBgColor(color) {
            document.getElementById('bgColor').value = color;
            document.getElementById('bgPreview').style.background = color;
            updatePreview();
        }

        function hexToRgb(hex) {
            const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? {
                r: parseInt(result[1], 16),
                g: parseInt(result[2], 16),
                b: parseInt(result[3], 16)
            } : null;
        }

        function getLuminance(r, g, b) {
            var rs = r / 255, gs = g / 255, bs = b / 255;
            rs = rs <= 0.03928 ? rs / 12.92 : Math.pow((rs + 0.055) / 1.055, 2.4);
            gs = gs <= 0.03928 ? gs / 12.92 : Math.pow((gs + 0.055) / 1.055, 2.4);
            bs = bs <= 0.03928 ? bs / 12.92 : Math.pow((bs + 0.055) / 1.055, 2.4);
            return 0.2126 * rs + 0.7152 * gs + 0.0722 * bs;
        }

        function getContrastRatio(color1, color2) {
            var rgb1 = hexToRgb(color1);
            var rgb2 = hexToRgb(color2);
            if (!rgb1 || !rgb2) return null;
            
            var lum1 = getLuminance(rgb1.r, rgb1.g, rgb1.b);
            var lum2 = getLuminance(rgb2.r, rgb2.g, rgb2.b);
            
            var brightest = Math.max(lum1, lum2);
            var darkest = Math.min(lum1, lum2);
            
            return (brightest + 0.05) / (darkest + 0.05);
        }

        function updatePreview() {
            var fg = document.getElementById('fgColor').value;
            var bg = document.getElementById('bgColor').value;
            
            var previewBox = document.getElementById('previewBox');
            var previewText = document.getElementById('previewText');
            var previewTextSmall = document.getElementById('previewTextSmall');
            
            if (hexToRgb(fg) && hexToRgb(bg)) {
                previewBox.style.background = bg;
                previewBox.style.display = 'block';
                previewText.style.color = fg;
                previewTextSmall.style.color = fg;
            } else {
                previewBox.style.display = 'none';
            }
        }

        function checkContrast() {
            var fg = document.getElementById('fgColor').value;
            var bg = document.getElementById('bgColor').value;
            
            var resultDiv = document.getElementById('result');
            var errorDiv = document.getElementById('error');
            
            resultDiv.style.display = 'none';
            errorDiv.style.display = 'none';
            
            if (!hexToRgb(fg) || !hexToRgb(bg)) {
                errorDiv.textContent = '请输入有效的十六进制颜色值（如 #FF5733）';
                errorDiv.style.display = 'block';
                return;
            }
            
            var ratio = getContrastRatio(fg, bg);
            if (ratio === null) {
                errorDiv.textContent = '计算对比度失败';
                errorDiv.style.display = 'block';
                return;
            }
            
            var ratioDisplay = document.getElementById('ratioDisplay');
            ratioDisplay.textContent = ratio.toFixed(2) + ':1';
            
            var gradeGrid = document.getElementById('gradeGrid');
            gradeGrid.innerHTML = '';
            
            var checks = [
                { label: 'AA 正常', pass: ratio >= 4.5 },
                { label: 'AA 大文本', pass: ratio >= 3.0 },
                { label: 'AAA 正常', pass: ratio >= 7.0 },
                { label: 'AAA 大文本', pass: ratio >= 4.5 }
            ];
            
            checks.forEach(function(check) {
                var item = document.createElement('div');
                item.className = 'grade-item ' + (check.pass ? 'grade-pass' : 'grade-fail');
                item.innerHTML = '<div class="grade-label">' + check.label + '</div><div class="grade-value">' + (check.pass ? '✓' : '✗') + '</div>';
                gradeGrid.appendChild(item);
            });
            
            resultDiv.style.display = 'block';
        }
    </script>
    <div class="ad-banner-bottom"><div class="ad-container"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-XXXXXXXXXX" data-ad-slot="XXXXXX" data-ad-format="auto" data-full-width-responsive="true"></ins></div></div>
</body>
</html>
