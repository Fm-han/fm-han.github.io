<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>词频统计器 - 免费在线工具</title>
    <style>
                /* 顶部横幅广告 - 透明样式 */ .ad-banner-top { border-bottom: 1px solid #e0e0e0; padding: 6px 20px; text-align: center; min-height: 50px; display: flex; align-items: center; justify-content: center; } .ad-banner-bottom { border-top: 1px solid #e0e0e0; padding: 6px 20px; text-align: center; min-height: 50px; display: flex; align-items: center; justify-content: center; margin-top: 40px; } .ad-container { max-width: 728px; margin: 0 auto; min-height: 38px; display: flex; align-items: center; justify-content: center; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #fafafa; min-height: 100vh; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        .card { background: #fff; border: 1px solid #e0e0e0; border-radius: 8px; padding: 24px; margin-bottom: 20px; }
        h1 { font-size: 1.25rem; font-weight: 600; margin-bottom: 16px; color: #333; }
        textarea { border: 1px solid #ddd; border-radius: 4px; padding: 12px; width: 100%; min-height: 150px; font-size: 14px; box-sizing: border-box; resize: vertical; }
        .btn { background: #007bff; color: #fff; border: none; padding: 8px 20px; border-radius: 4px; cursor: pointer; margin: 5px 5px 5px 0; }
        .btn:hover { background: #0056b3; }
        .btn-secondary { background: #28a745; }
        .btn-secondary:hover { background: #218838; }
        .label { font-weight: 500; margin-bottom: 8px; display: block; color: #333; }
        .options { margin: 16px 0; }
        .options label { margin-right: 20px; color: #555; }
        .options input[type="number"] { border: 1px solid #ddd; border-radius: 4px; padding: 4px 8px; width: 60px; }
        table { width: 100%; border-collapse: collapse; margin-top: 16px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background: #f5f5f5; font-weight: 600; }
        tr:nth-child(even) { background: #fafafa; }
        .count { text-align: right; font-weight: 500; }
        .stats { margin-top: 16px; padding: 12px; background: #f5f5f5; border-radius: 4px; }
        .stats span { margin-right: 20px; color: #333; }
    </style>
</head>
<body>
    <div class="ad-banner-top"><div class="ad-container"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-XXXXXXXXXX" data-ad-slot="XXXXXX" data-ad-format="auto" data-full-width-responsive="true"></ins></div></div>
    <div class="container">
        <h1>词频统计器</h1>
        <div class="card">
            <label class="label">输入文本</label>
            <textarea id="textInput" placeholder="在此粘贴需要统计的文本..."></textarea>
            <div class="options">
                <label><input type="checkbox" id="caseSensitive" checked> 区分大小写</label>
                <label>显示前 <input type="number" id="topN" value="20" min="1" max="100"> 个高频词</label>
            </div>
            <button class="btn" onclick="analyzeText()">统计词频</button>
            <button class="btn btn-secondary" onclick="clearAll()">清空</button>
        </div>
        <div class="card">
            <label class="label">统计结果</label>
            <div class="stats" id="stats"></div>
            <table id="resultTable">
                <thead><tr><th>排名</th><th>词语</th><th>出现次数</th></tr></thead>
                <tbody id="resultBody"></tbody>
            </table>
        </div>
    </div>
    <script>
        function analyzeText() {
            const text = document.getElementById('textInput').value;
            const caseSensitive = document.getElementById('caseSensitive').checked;
            const topN = parseInt(document.getElementById('topN').value) || 20;
            
            let processedText = text;
            if (!caseSensitive) {
                processedText = text.toLowerCase();
            }
            
            const words = processedText.match(/[\u4e00-\u9fa5a-zA-Z0-9_]+/g) || [];
            
            const freq = {};
            words.forEach(word => {
                freq[word] = (freq[word] || 0) + 1;
            });
            
            const sorted = Object.entries(freq).sort((a, b) => b[1] - a[1]);
            const top = sorted.slice(0, topN);
            
            document.getElementById('stats').innerHTML = `
                <span>总词数: ${words.length}</span>
                <span>不重复词数: ${Object.keys(freq).length}</span>
            `;
            
            const tbody = document.getElementById('resultBody');
            tbody.innerHTML = top.map(([word, count], i) => 
                `<tr><td>${i + 1}</td><td>${word}</td><td class="count">${count}</td></tr>`
            ).join('');
        }

        function clearAll() {
            document.getElementById('textInput').value = '';
            document.getElementById('resultBody').innerHTML = '';
            document.getElementById('stats').innerHTML = '';
        }
    </script>
    <div class="ad-banner-bottom"><div class="ad-container"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-XXXXXXXXXX" data-ad-slot="XXXXXX" data-ad-format="auto" data-full-width-responsive="true"></ins></div></div>
</body>
</html>
