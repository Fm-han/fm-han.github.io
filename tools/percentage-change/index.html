<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>百分比变化计算器 - 涨跌幅计算</title>
  <meta name="description" content="免费在线百分比变化计算器，计算原价新价涨跌幅，支持折扣计算和利润率计算。">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://fm-han.github.io/percentage-change/">
  <style>
                /* 顶部横幅广告 - 透明样式 */ .ad-banner-top { border-bottom: 1px solid #e0e0e0; padding: 6px 20px; text-align: center; min-height: 50px; display: flex; align-items: center; justify-content: center; } .ad-banner-bottom { border-top: 1px solid #e0e0e0; padding: 6px 20px; text-align: center; min-height: 50px; display: flex; align-items: center; justify-content: center; margin-top: 40px; } .ad-container { max-width: 728px; margin: 0 auto; min-height: 38px; display: flex; align-items: center; justify-content: center; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 700px; margin: 0 auto; padding: 20px; color: #333; line-height: 1.6; background: #fafafa; }
    h1 { text-align: center; font-size: 1.8rem; color: #1a1a1a; }
    h1 small { display: block; font-size: 0.85rem; color: #666; margin-top: 4px; font-weight: normal; }
    .card { margin: 20px 0; padding: 20px; border: 1px solid #e0e0e0; border-radius: 8px; background: #fff; }
    .input-row { display: flex; gap: 16px; margin-bottom: 16px; }
    .input-group { flex: 1; }
    .input-group label { display: block; font-weight: 600; margin-bottom: 6px; }
    .input-group input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem; box-sizing: border-box; }
    .result-display { background: linear-gradient(135deg, #007bff, #0056b3); border-radius: 12px; padding: 24px; color: #fff; text-align: center; margin: 20px 0; }
    .result-display .label { font-size: 1rem; opacity: 0.9; }
    .result-display .value { font-size: 3rem; font-weight: 700; }
    .result-display .change { font-size: 1.2rem; margin-top: 8px; }
    .result-display.up { background: linear-gradient(135deg, #28a745, #218838); }
    .result-display.down { background: linear-gradient(135deg, #dc3545, #c82333); }
    .result-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .result-item { background: #f5f5f5; padding: 16px; border-radius: 8px; text-align: center; }
    .result-item .label { font-size: 0.85rem; color: #666; }
    .result-item .value { font-size: 1.5rem; font-weight: 700; color: #007bff; }
    button { padding: 12px 28px; border: none; border-radius: 6px; cursor: pointer; font-size: 1rem; }
    .btn-primary { background: #007bff; color: #fff; }
    .btn-secondary { background: #6c757d; color: #fff; }
    button:hover { opacity: 0.9; }
    .buttons { display: flex; gap: 12px; justify-content: center; }
    .footer { text-align: center; margin: 24px 0; padding: 12px; font-size: 0.85rem; color: #28a745; font-weight: 500; }
  </style>
</head>
<body>
    <div class="ad-banner-top"><div class="ad-container"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-XXXXXXXXXX" data-ad-slot="XXXXXX" data-ad-format="auto" data-full-width-responsive="true"></ins></div></div>
  <h1>百分比变化计算器 <small>涨跌幅 · 折扣 · 利润率</small></h1>

  <div class="card">
    <div class="input-row">
      <div class="input-group"><label>原价 / 旧值</label><input type="number" id="oldValue" placeholder="例如：100" value="100"></div>
      <div class="input-group"><label>现价 / 新值</label><input type="number" id="newValue" placeholder="例如：120" value="120"></div>
    </div>
    <div class="buttons">
      <button class="btn-primary" onclick="calculate()">计算变化</button>
      <button class="btn-secondary" onclick="clearAll()">重置</button>
    </div>
  </div>

  <div class="card" id="resultCard" style="display:none;">
    <div class="result-display" id="resultDisplay">
      <div class="label">百分比变化</div>
      <div class="value" id="percentChange">--%</div>
      <div class="change" id="changeDesc"></div>
    </div>
    <div class="result-grid">
      <div class="result-item"><div class="label">变化量</div><div class="value" id="diffValue">--</div></div>
      <div class="result-item"><div class="label">新值/原值</div><div class="value" id="ratio">--</div></div>
    </div>
  </div>

  <div class="card">
    <h3>应用场景</h3>
    <ul style="padding-left:20px;color:#666;">
      <li><strong>涨跌幅计算：</strong>股票、基金价格变化</li>
      <li><strong>折扣计算：</strong>商品打折促销</li>
      <li><strong>增长率：</strong>销售额、用户数增长</li>
      <li><strong>利润率：</strong>成本售价利润计算</li>
    </ul>
  </div>

  <div class="footer">100% 免费 · 数据不上传服务器 · 仅浏览器本地处理</div>

  <script>
    function calculate() {
      const oldVal = parseFloat(document.getElementById('oldValue').value);
      const newVal = parseFloat(document.getElementById('newValue').value);
      if (isNaN(oldVal) || isNaN(newVal) || oldVal === 0) { alert('请输入有效数值'); return; }
      const diff = newVal - oldVal;
      const percent = (diff / oldVal) * 100;
      const ratio = newVal / oldVal;
      document.getElementById('resultCard').style.display = 'block';
      document.getElementById('percentChange').textContent = (percent >= 0 ? '+' : '') + percent.toFixed(2) + '%';
      document.getElementById('diffValue').textContent = (diff >= 0 ? '+' : '') + diff.toFixed(2);
      document.getElementById('ratio').textContent = ratio.toFixed(4);
      const display = document.getElementById('resultDisplay');
      display.className = 'result-display ' + (percent > 0 ? 'up' : percent < 0 ? 'down' : '');
      document.getElementById('changeDesc').textContent = percent > 0 ? `上涨 ${Math.abs(diff).toFixed(2)}` : percent < 0 ? `下跌 ${Math.abs(diff).toFixed(2)}` : '价格不变';
    }
    function clearAll() {
      document.querySelectorAll('input').forEach(i => i.value = '');
      document.getElementById('resultCard').style.display = 'none';
    }
  </script>
    <div class="ad-banner-bottom"><div class="ad-container"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-XXXXXXXXXX" data-ad-slot="XXXXXX" data-ad-format="auto" data-full-width-responsive="true"></ins></div></div>
</body>
</html>
