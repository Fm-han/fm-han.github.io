<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>安全密码生成器 - 随机强密码创建</title>
  <meta name="description" content="免费在线安全密码生成器，自定义密码长度和字符类型，生成高强度随机密码。">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://fm-han.github.io/secure-password/">
  <style>
                /* 顶部横幅广告 - 透明样式 */ .ad-banner-top { border-bottom: 1px solid #e0e0e0; padding: 6px 20px; text-align: center; min-height: 50px; display: flex; align-items: center; justify-content: center; } .ad-banner-bottom { border-top: 1px solid #e0e0e0; padding: 6px 20px; text-align: center; min-height: 50px; display: flex; align-items: center; justify-content: center; margin-top: 40px; } .ad-container { max-width: 728px; margin: 0 auto; min-height: 38px; display: flex; align-items: center; justify-content: center; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 700px; margin: 0 auto; padding: 20px; color: #333; line-height: 1.6; background: #fafafa; }
    h1 { text-align: center; font-size: 1.8rem; color: #1a1a1a; }
    h1 small { display: block; font-size: 0.85rem; color: #666; margin-top: 4px; font-weight: normal; }
    .card { margin: 20px 0; padding: 20px; border: 1px solid #e0e0e0; border-radius: 8px; background: #fff; }
    .password-display { background: #1e1e1e; border-radius: 12px; padding: 24px; color: #fff; text-align: center; margin: 20px 0; }
    .password-display .password { font-family: monospace; font-size: 1.5rem; letter-spacing: 2px; word-break: break-all; }
    .options { margin: 16px 0; }
    .option-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #eee; }
    .option-row:last-child { border-bottom: none; }
    .slider-group { display: flex; align-items: center; gap: 12px; }
    .slider-group input[type="range"] { width: 200px; }
    .slider-group .value { min-width: 40px; text-align: center; font-weight: 600; }
    .checkbox-group { display: flex; flex-direction: column; gap: 8px; }
    .checkbox-item { display: flex; align-items: center; gap: 8px; }
    button { padding: 12px 28px; border: none; border-radius: 6px; cursor: pointer; font-size: 1rem; }
    .btn-primary { background: #007bff; color: #fff; }
    .btn-success { background: #28a745; color: #fff; }
    .btn-secondary { background: #6c757d; color: #fff; }
    button:hover { opacity: 0.9; }
    .buttons { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .footer { text-align: center; margin: 24px 0; padding: 12px; font-size: 0.85rem; color: #28a745; font-weight: 500; }
  </style>
</head>
<body>
    <div class="ad-banner-top"><div class="ad-container"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-XXXXXXXXXX" data-ad-slot="XXXXXX" data-ad-format="auto" data-full-width-responsive="true"></ins></div></div>
  <h1>安全密码生成器 <small>随机密码 · 自定义长度 · 高强度</small></h1>

  <div class="card">
    <div class="password-display">
      <div class="password" id="generatedPassword">点击生成按钮</div>
    </div>
    <div class="options">
      <div class="option-row">
        <label>密码长度</label>
        <div class="slider-group">
          <input type="range" id="lengthSlider" min="8" max="64" value="16" oninput="updateLength()">
          <span class="value" id="lengthValue">16</span>
        </div>
      </div>
      <div class="checkbox-group">
        <label class="checkbox-item"><input type="checkbox" id="useLower" checked onchange="generate()"> 小写字母 (a-z)</label>
        <label class="checkbox-item"><input type="checkbox" id="useUpper" checked onchange="generate()"> 大写字母 (A-Z)</label>
        <label class="checkbox-item"><input type="checkbox" id="useNumber" checked onchange="generate()"> 数字 (0-9)</label>
        <label class="checkbox-item"><input type="checkbox" id="useSpecial" checked onchange="generate()"> 特殊字符 (!@#$%...)</label>
      </div>
    </div>
    <div class="buttons">
      <button class="btn-primary" onclick="generate()">生成密码</button>
      <button class="btn-success" onclick="copyPassword()">复制密码</button>
      <button class="btn-secondary" onclick="generateMultiple()">批量生成</button>
    </div>
  </div>

  <div class="card" id="batchCard" style="display:none;">
    <h3>批量生成结果</h3>
    <div id="batchResults"></div>
  </div>

  <div class="footer">100% 免费 · 数据不上传服务器 · 仅浏览器本地处理</div>

  <script>
    const lower = 'abcdefghijklmnopqrstuvwxyz';
    const upper = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    const number = '0123456789';
    const special = '!@#$%^&*()_+-=[]{}|;:,.<>?';
    function updateLength() {
      document.getElementById('lengthValue').textContent = document.getElementById('lengthSlider').value;
    }
    function generate() {
      let chars = '';
      if (document.getElementById('useLower').checked) chars += lower;
      if (document.getElementById('useUpper').checked) chars += upper;
      if (document.getElementById('useNumber').checked) chars += number;
      if (document.getElementById('useSpecial').checked) chars += special;
      if (!chars) { alert('请至少选择一种字符类型'); return; }
      const length = parseInt(document.getElementById('lengthSlider').value);
      let password = '';
      for (let i = 0; i < length; i++) {
        password += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      document.getElementById('generatedPassword').textContent = password;
    }
    function copyPassword() {
      const pwd = document.getElementById('generatedPassword').textContent;
      if (pwd === '点击生成按钮') { alert('请先生成密码'); return; }
      navigator.clipboard.writeText(pwd).then(() => alert('密码已复制'));
    }
    function generateMultiple() {
      const count = parseInt(prompt('生成数量（1-100）:', '10')) || 10;
      if (count < 1 || count > 100) { alert('数量必须在1-100之间'); return; }
      let passwords = [];
      for (let i = 0; i < count; i++) generate();
      for (let i = 0; i < count; i++) {
        let chars = '';
        if (document.getElementById('useLower').checked) chars += lower;
        if (document.getElementById('useUpper').checked) chars += upper;
        if (document.getElementById('useNumber').checked) chars += number;
        if (document.getElementById('useSpecial').checked) chars += special;
        const length = parseInt(document.getElementById('lengthSlider').value);
        let pwd = '';
        for (let j = 0; j < length; j++) pwd += chars.charAt(Math.floor(Math.random() * chars.length));
        passwords.push(pwd);
      }
      document.getElementById('batchCard').style.display = 'block';
      document.getElementById('batchResults').innerHTML = passwords.map(p =>
        `<div style="background:#f5f5f5;padding:8px 12px;margin:4px 0;border-radius:4px;font-family:monospace;cursor:pointer;" onclick="navigator.clipboard.writeText('${p}')">${p}</div>`
      ).join('');
    }
  </script>
    <div class="ad-banner-bottom"><div class="ad-container"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-XXXXXXXXXX" data-ad-slot="XXXXXX" data-ad-format="auto" data-full-width-responsive="true"></ins></div></div>
</body>
</html>
