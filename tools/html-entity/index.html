<html lang="zh-CN">
<head>
  <meta charset="UTF-8">

  <style>
                /* 顶部横幅广告 - 透明样式 */ .ad-banner-top { border-bottom: 1px solid #e0e0e0; padding: 6px 20px; text-align: center; min-height: 50px; display: flex; align-items: center; justify-content: center; } .ad-banner-bottom { border-top: 1px solid #e0e0e0; padding: 6px 20px; text-align: center; min-height: 50px; display: flex; align-items: center; justify-content: center; margin-top: 40px; } .ad-container { max-width: 728px; margin: 0 auto; min-height: 38px; display: flex; align-items: center; justify-content: center; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 800px; margin: 0 auto; padding: 20px; color: #333; line-height: 1.6; background: #fafafa; }
    h1 { text-align: center; font-size: 1.8rem; color: #1a1a1a; }
    h1 small { display: block; font-size: 0.85rem; color: #666; margin-top: 4px; font-weight: normal; }
    .section { margin: 20px 0; padding: 16px; border: 1px solid #e0e0e0; border-radius: 8px; background: #fff; }
    .section label { display: block; font-weight: 600; margin-bottom: 8px; }
    textarea { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem; box-sizing: border-box; font-family: monospace; resize: vertical; min-height: 100px; }
    .tabs { display: flex; gap: 8px; margin-bottom: 12px; }
    .tabs button { padding: 8px 16px; border: 1px solid #ccc; border-radius: 6px; background: #fff; cursor: pointer; }
    .tabs button.active { background: #007bff; color: #fff; border-color: #007bff; }
    .buttons { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
    button { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-size: 0.95rem; }
    .btn-primary { background: #007bff; color: #fff; }
    .btn-copy { background: #28a745; color: #fff; }
    .btn-clear { background: #6c757d; color: #fff; }
    button:hover { opacity: 0.9; }
    .result { margin-top: 12px; padding: 12px; background: #f8f9fa; border-radius: 6px; word-break: break-all; font-family: monospace; font-size: 0.9rem; min-height: 60px; }
    .footer { text-align: center; margin: 24px 0; padding: 12px; font-size: 0.85rem; color: #28a745; font-weight: 500; }
  </style>
</head>
<body>
    <div class="ad-banner-top"><div class="ad-container"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-XXXXXXXXXX" data-ad-slot="XXXXXX" data-ad-format="auto" data-full-width-responsive="true"></ins></div></div>

  <h1>HTML实体编码解码 <small>特殊字符转义 / 数字实体 / 浏览器本地</small></h1>

  <div class="section">
    <label>输入</label>
    <textarea id="input" placeholder="输入HTML内容，如: <div>&amp;&quot;</>"></textarea>
    <div class="tabs">
      <button class="active" onclick="setMode('encode-named')" id="tab-encode-named">编码 (命名实体)</button>
      <button onclick="setMode('encode-numeric')" id="tab-encode-numeric">编码 (数字实体)</button>
      <button onclick="setMode('decode')" id="tab-decode">解码</button>
    </div>
    <div class="buttons">
      <button class="btn-primary" onclick="process()">处理</button>
      <button class="btn-copy" onclick="copyResult()">复制结果</button>
      <button class="btn-clear" onclick="document.getElementById('input').value='';document.getElementById('result').textContent='等待输入...'">清空</button>
    </div>
  </div>

  <div class="section">
    <label>结果</label>
    <div id="result" class="result">等待输入...</div>
  </div>

  <div class="footer">100% 免费 · 数据不上传服务器 · 仅浏览器本地处理</div>

  <script>
    let mode = 'encode-named';

    function setMode(m) {
      mode = m;
      document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
      document.getElementById('tab-' + m).classList.add('active');
    }

    function process() {
      const input = document.getElementById('input').value;
      if (!input) { document.getElementById('result').textContent = '请输入内容'; return; }

      if (mode === 'encode-named') {
        const div = document.createElement('div');
        div.textContent = input;
        document.getElementById('result').textContent = div.innerHTML;
      } else if (mode === 'encode-numeric') {
        let encoded = '';
        for (let i = 0; i < input.length; i++) {
          const code = input.charCodeAt(i);
          if (code > 127) encoded += '&#' + code + ';';
          else encoded += input[i];
        }
        document.getElementById('result').textContent = encoded;
      } else {
        const div = document.createElement('div');
        div.innerHTML = input;
        document.getElementById('result').textContent = div.textContent;
      }
    }

    function copyResult() {
      const text = document.getElementById('result').textContent;
      if (text && text !== '等待输入...') navigator.clipboard.writeText(text).then(() => alert('已复制!'));
    }
  </script>
    <div class="ad-banner-bottom"><div class="ad-container"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-XXXXXXXXXX" data-ad-slot="XXXXXX" data-ad-format="auto" data-full-width-responsive="true"></ins></div></div>
