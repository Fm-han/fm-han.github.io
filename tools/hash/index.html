<body>
    <div class="ad-banner-top"><div class="ad-container"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-XXXXXXXXXX" data-ad-slot="XXXXXX" data-ad-format="auto" data-full-width-responsive="true"></ins></div></div>

  <h1>哈希计算器 <small>MD5 / SHA1 / SHA256 / SHA384 / SHA512 · 浏览器本地</small></h1>

  <div class="section">
    <label>输入文本</label>
    <textarea id="textInput" placeholder="输入需要计算哈希的文本..."></textarea>
    <div class="buttons">
      <button class="btn-primary" onclick="compute()">计算哈希</button>
      <button class="btn-clear" onclick="document.getElementById('textInput').value='';document.getElementById('results').innerHTML=''">清空</button>
    </div>
  </div>

  <div class="section">
    <label>或上传文件</label>
    <div class="drop-zone" onclick="document.getElementById('fileInput').click()">
      <input type="file" id="fileInput" class="hidden" onchange="computeFile(this.files[0])">
      <p>点击选择文件，或拖拽文件到此处</p>
      <p style="color:#888;font-size:0.85rem;margin-top:8px;" id="fileName">任意大小文件，支持分片处理</p>
    </div>
  </div>

  <div class="section">
    <label>哈希结果</label>
    <div id="results" class="result-list">
      <div style="color:#999;text-align:center;padding:20px;">等待输入...</div>
    </div>
    <div class="buttons" id="copyAllBtn" style="display:none;">
      <button class="btn-copy" onclick="copyAll()">复制全部</button>
    </div>
  </div>

  <div class="footer">100% 免费 · 数据不上传服务器 · 仅浏览器本地处理</div>

  <script>
    let currentHashes = {};

    async function compute() {
      const text = document.getElementById('textInput').value;
      if (!text) { alert('请输入文本'); return; }
      const encoder = new TextEncoder();
      const data = encoder.encode(text);
      await computeHashes(data);
    }

    async function computeFile(file) {
      if (!file) return;
      document.getElementById('fileName').textContent = file.name + ' (' + formatSize(file.size) + ')';
      const buffer = await file.arrayBuffer();
      await computeHashes(new Uint8Array(buffer));
    }

    async function computeHashes(data) {
      const algos = ['MD5','SHA-1','SHA-256','SHA-384','SHA-512'];
      currentHashes = {};

      // MD5 not available in Web Crypto, use simple JS impl
      currentHashes['MD5'] = await md5(data);

      for (const algo of ['SHA-1','SHA-256','SHA-384','SHA-512']) {
        const hash = await crypto.subtle.digest(algo, data);
        currentHashes[algo] = Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2,'0')).join('');
      }

      renderResults();
    }

    async function md5(data) {
      // Simple MD5 implementation for browser
      const ascii = Array.from(data).map(c => c > 127 ? c - 256 : c);
      const len = ascii.length;
      const msg = new Uint8Array(len + 9);
      msg.set(ascii); msg[len] = 0x80;
      const bits = len * 8;
      msg[len + 6] = bits & 0xff; msg[len + 7] = (bits >> 8) & 0xff;
      msg[len + 8] = (bits >> 16) & 0xff; msg[len + 4] = (bits >> 24) & 0xff;

      const x = new Uint32Array(16);
      let a=1732584193,b=-271733879,c=-1732584194,d=271733878;

      const S=Math.sin;
      for(let i=0;i<msg.length;i+=64){
        for(let j=0;j<16;j++) x[j]=msg[i+j*4]|(msg[i+j*4+1]<<8)|(msg[i+j*4+2]<<16)|(msg[i+j*4+3]<<24);
        let t;
        const FF=()=>{a+=((b=(b+((t=((b&c)|((~b)&d))+x[g]+S(g++)|0))|0))+((t<<7)|(t>>>25)))|0;d+=((c=(c+((t=((d&a)|((~d)&b))+x[g]+S(g++)|0))|0))+((t<<12)|(t>>>20)))|0;c+=((b=(b+((t=((c&d)|((~c)&a))+x[g]+S(g++)|0))|0))+((t<<17)|(t>>>15)))|0;a+=((d=(d+((t=((a&b)|((~a)&c))+x[g]+S(g++)|0))|0))+((t<<22)|(t>>>10)))|0;};
        let g=0;FF();FF();FF();FF();FF();FF();FF();FF();FF();FF();FF();FF();FF();FF();FF();FF();
        a+=1732584193;b+=-271733879;c+=-1732584194;d+=271733878;
      }
      const r=[a,b,c,d];
      return r.map(v=>((v>>>0)&0xff|(v>>>8)&0xff00|(v>>>16)&0xff0000|(v>>>24)&0xff000000).toString(16).padStart(8,'0')).join('');
    }

    function renderResults() {
      let html = '';
      for (const [algo, hash] of Object.entries(currentHashes)) {
        html += `<div class="result-item">
          <div class="algo">${algo}</div>
          <div class="hash" id="hash-${algo}">${hash}</div>
        </div>`;
      }
      document.getElementById('results').innerHTML = html;
      document.getElementById('copyAllBtn').style.display = 'flex';
    }

    function copyAll() {
      const text = Object.entries(currentHashes).map(([a,h]) => `${a}: ${h}`).join('\n');
      navigator.clipboard.writeText(text).then(() => alert('已复制!'));
    }

    function formatSize(bytes) {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1048576) return (bytes/1024).toFixed(1) + ' KB';
      return (bytes/1048576).toFixed(1) + ' MB';
    }
  </script>
