<body>
    <div class="ad-banner-top"><div class="ad-container"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-XXXXXXXXXX" data-ad-slot="XXXXXX" data-ad-format="auto" data-full-width-responsive="true"></ins></div></div>

  <h1>进制转换器 <small>2 / 8 / 10 / 16 / 32 / 64进制 · 实时转换 · 点击复制 · 浏览器本地</small></h1>

  <div class="section">
    <label>选择源进制</label>
    <div class="base-tabs" id="baseTabs">
      <button class="active" onclick="setBase(2)">二进制 BIN</button>
      <button onclick="setBase(8)">八进制 OCT</button>
      <button onclick="setBase(10)">十进制 DEC</button>
      <button onclick="setBase(16)">十六进制 HEX</button>
      <button onclick="setBase(32)">三十二进制</button>
      <button onclick="setBase(64)">六十四进制</button>
    </div>
    <textarea id="inputVal" placeholder="输入数字，如: 255 或 11111111 或 0xFF" oninput="convert()"></textarea>
    <div class="buttons">
      <button class="btn-primary" onclick="random()">随机示例</button>
      <button class="btn-clear" onclick="document.getElementById('inputVal').value='';document.getElementById('resultGrid').innerHTML=''">清空</button>
    </div>
  </div>

  <div class="section">
    <label>转换结果（点击复制）</label>
    <div class="result-grid" id="resultGrid">
      <span class="base-label">二进制</span><div class="base-val" onclick="copy(this)" id="rBin">-</div>
      <span class="base-label">八进制</span><div class="base-val" onclick="copy(this)" id="rOct">-</div>
      <span class="base-label">十进制</span><div class="base-val" onclick="copy(this)" id="rDec">-</div>
      <span class="base-label">十六进制</span><div class="base-val" onclick="copy(this)" id="rHex">-</div>
      <span class="base-label">三十二进制</span><div class="base-val" onclick="copy(this)" id="rB32">-</div>
      <span class="base-label">六十四进制</span><div class="base-val" onclick="copy(this)" id="rB64">-</div>
    </div>
  </div>

  <div class="footer">100% 免费 · 数据不上传服务器 · 仅浏览器本地处理</div>

  <script>
    let currentBase = 2;
    const CHARS32 = '0123456789ABCDEFGHIJKLMNOPQRSTUV';
    const CHARS64 = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz+/';

    function setBase(b) {
      currentBase = b;
      document.querySelectorAll('.base-tabs button').forEach((btn, i) => {
        btn.classList.toggle('active', [2,8,10,16,32,64][i] === b);
      });
    }

    function toDecimal(str, base) {
      if (base === 10) return BigInt(str);
      return BigInt('0x' + BigInt(str).toString(16));
    }

    function fromDecimal(num, base) {
      if (base === 10) return num.toString();
      if (base === 2) return num.toString(2);
      if (base === 8) return num.toString(8);
      if (base === 16) return num.toString(16).toUpperCase();
      if (base === 32) {
        let res = '';
        let n = num;
        while (n > 0n) { res = CHARS32[Number(n % 32n)] + res; n /= 32n; }
        return res || '0';
      }
      if (base === 64) {
        let res = '';
        let n = num;
        while (n > 0n) { res = CHARS64[Number(n % 64n)] + res; n /= 64n; }
        return res || '0';
      }
      return num.toString(base);
    }

    function convert() {
      const input = document.getElementById('inputVal').value.trim();
      if (!input) {
        ['rBin','rOct','rDec','rHex','rB32','rB64'].forEach(id => document.getElementById(id).textContent = '-');
        return;
      }
      try {
        let dec;
        if (currentBase === 10) {
          dec = BigInt(input);
        } else if (currentBase === 16) {
          dec = BigInt(input.startsWith('0x') ? input : '0x' + input);
        } else {
          dec = BigInt(parseInt(input, currentBase));
        }
        document.getElementById('rBin').textContent = dec.toString(2);
        document.getElementById('rOct').textContent = dec.toString(8);
        document.getElementById('rDec').textContent = dec.toString();
        document.getElementById('rHex').textContent = dec.toString(16).toUpperCase();
        document.getElementById('rB32').textContent = fromDecimal(dec, 32);
        document.getElementById('rB64').textContent = fromDecimal(dec, 64);
      } catch(e) {
        ['rBin','rOct','rDec','rHex','rB32','rB64'].forEach(id => document.getElementById(id).textContent = '无效输入');
      }
    }

    function copy(el) {
      const text = el.textContent;
      if (text.startsWith('无效') || text === '-') return;
      navigator.clipboard.writeText(text).then(() => {
        const orig = el.style.background;
        el.style.background = '#e8f5e9';
        setTimeout(() => el.style.background = orig, 300);
      });
    }

    function random() {
      const bases = [2,8,10,16];
      const b = bases[Math.floor(Math.random()*bases.length)];
      const num = Math.floor(Math.random() * 65536);
      setBase(b);
      document.getElementById('inputVal').value = b === 16 ? num.toString(16).toUpperCase() : num.toString(b);
      convert();
    }
  </script>
