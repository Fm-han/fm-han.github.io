<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文本转列表 - 分隔符互转工具</title>
  <meta name="description" content="免费在线文本转列表工具，逗号分隔、换行分隔、顿号分隔的文本互相转换。">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://fm-han.github.io/text-to-list/">
  <style>
                /* 顶部横幅广告 - 透明样式 */ .ad-banner-top { border-bottom: 1px solid #e0e0e0; padding: 6px 20px; text-align: center; min-height: 50px; display: flex; align-items: center; justify-content: center; } .ad-banner-bottom { border-top: 1px solid #e0e0e0; padding: 6px 20px; text-align: center; min-height: 50px; display: flex; align-items: center; justify-content: center; margin-top: 40px; } .ad-container { max-width: 728px; margin: 0 auto; min-height: 38px; display: flex; align-items: center; justify-content: center; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 800px; margin: 0 auto; padding: 20px; color: #333; line-height: 1.6; background: #fafafa; }
    h1 { text-align: center; font-size: 1.8rem; color: #1a1a1a; }
    h1 small { display: block; font-size: 0.85rem; color: #666; margin-top: 4px; font-weight: normal; }
    .card { margin: 20px 0; padding: 20px; border: 1px solid #e0e0e0; border-radius: 8px; background: #fff; }
    .convert-box { background: linear-gradient(135deg, #007bff, #0056b3); border-radius: 12px; padding: 24px; color: #fff; margin: 20px 0; }
    .input-section { margin-bottom: 16px; }
    .input-section label { display: block; font-weight: 600; margin-bottom: 6px; }
    .input-section textarea { width: 100%; min-height: 100px; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem; resize: vertical; box-sizing: border-box; }
    .convert-options { display: flex; gap: 8px; justify-content: center; margin: 16px 0; flex-wrap: wrap; }
    .convert-btn { padding: 12px 20px; border: 1px solid rgba(255,255,255,0.5); border-radius: 6px; background: rgba(255,255,255,0.1); color: #fff; cursor: pointer; transition: all 0.2s; }
    .convert-btn:hover { background: rgba(255,255,255,0.2); }
    .convert-btn .arrow { display: block; font-size: 0.8rem; margin-top: 4px; }
    .result-section textarea { width: 100%; min-height: 100px; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-family: monospace; font-size: 1rem; background: #f5f5f5; resize: vertical; box-sizing: border-box; }
    button { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-size: 1rem; }
    .btn-success { background: #28a745; color: #fff; }
    button:hover { opacity: 0.9; }
    .buttons { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .footer { text-align: center; margin: 24px 0; padding: 12px; font-size: 0.85rem; color: #28a745; font-weight: 500; }
  </style>
</head>
<body>
    <div class="ad-banner-top"><div class="ad-container"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-XXXXXXXXXX" data-ad-slot="XXXXXX" data-ad-format="auto" data-full-width-responsive="true"></ins></div></div>
  <h1>文本转列表 <small>逗号换行 · 顿号分隔 · 格式互转</small></h1>

  <div class="card">
    <div class="convert-box">
      <div class="input-section">
        <label>输入文本</label>
        <textarea id="inputText" placeholder="输入要转换的文本...">苹果,香蕉,橙子,葡萄,西瓜</textarea>
      </div>
      <div class="convert-options">
        <button class="convert-btn" onclick="convert('comma')">
          逗号分隔
          <span class="arrow">↓</span>
        </button>
        <button class="convert-btn" onclick="convert('newline')">
          换行分隔
          <span class="arrow">↓</span>
        </button>
        <button class="convert-btn" onclick="convert('dunhao')">
          顿号分隔
          <span class="arrow">↓</span>
        </button>
        <button class="convert-btn" onclick="convert('semicolon')">
          分号分隔
          <span class="arrow">↓</span>
        </button>
        <button class="convert-btn" onclick="convert('space')">
          空格分隔
          <span class="arrow">↓</span>
        </button>
      </div>
      <div class="input-section">
        <label>转换结果</label>
        <textarea id="outputText" readonly></textarea>
      </div>
    </div>
    <div class="buttons">
      <button class="btn-success" onclick="copyResult()">复制结果</button>
      <button class="btn-success" onclick="swapText()">交换方向</button>
    </div>
  </div>

  <div class="card">
    <h3>使用说明</h3>
    <ul style="padding-left:20px;color:#666;">
      <li><strong>逗号分隔：</strong>用英文逗号,分隔每个项目</li>
      <li><strong>换行分隔：</strong>每个项目单独一行</li>
      <li><strong>顿号分隔：</strong>用中文顿号、分隔（适合中文列表）</li>
      <li><strong>分号分隔：</strong>用英文分号;分隔</li>
      <li><strong>空格分隔：</strong>用空格分隔每个项目</li>
    </ul>
  </div>

  <div class="footer">100% 免费 · 数据不上传服务器 · 仅浏览器本地处理</div>

  <script>
    const delimiters = {
      comma: ',',
      newline: '\n',
      dunhao: '、',
      semicolon: ';',
      space: ' '
    };
    function convert(targetType) {
      const text = document.getElementById('inputText').value;
      if (!text.trim()) { alert('请输入文本'); return; }
      let items;
      if (text.includes(',')) {
        items = text.split(',').map(s => s.trim()).filter(s => s);
      } else if (text.includes('、')) {
        items = text.split('、').map(s => s.trim()).filter(s => s);
      } else if (text.includes(';')) {
        items = text.split(';').map(s => s.trim()).filter(s => s);
      } else {
        items = text.split(/[\n\r]+/).map(s => s.trim()).filter(s => s);
      }
      const targetDel = delimiters[targetType];
      document.getElementById('outputText').value = items.join(targetDel);
    }
    function copyResult() {
      const text = document.getElementById('outputText').value;
      if (!text) { alert('请先转换'); return; }
      navigator.clipboard.writeText(text).then(() => alert('已复制'));
    }
    function swapText() {
      const input = document.getElementById('inputText').value;
      const output = document.getElementById('outputText').value;
      document.getElementById('inputText').value = output;
      document.getElementById('outputText').value = input;
    }
  </script>

</body>
</html>
