<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data URI生成器 - 文件转Data URL</title>
  <meta name="description" content="免费在线Data URI生成器，将任意文件转换为Data URL格式，用于内嵌到HTML/CSS中。">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://fm-han.github.io/data-uri/">
  <style>
                /* 顶部横幅广告 - 透明样式 */ .ad-banner-top { border-bottom: 1px solid #e0e0e0; padding: 6px 20px; text-align: center; min-height: 50px; display: flex; align-items: center; justify-content: center; } .ad-banner-bottom { border-top: 1px solid #e0e0e0; padding: 6px 20px; text-align: center; min-height: 50px; display: flex; align-items: center; justify-content: center; margin-top: 40px; } .ad-container { max-width: 728px; margin: 0 auto; min-height: 38px; display: flex; align-items: center; justify-content: center; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 800px; margin: 0 auto; padding: 20px; color: #333; line-height: 1.6; background: #fafafa; }
    h1 { text-align: center; font-size: 1.8rem; color: #1a1a1a; }
    h1 small { display: block; font-size: 0.85rem; color: #666; margin-top: 4px; font-weight: normal; }
    .card { margin: 20px 0; padding: 20px; border: 1px solid #e0e0e0; border-radius: 8px; background: #fff; }
    .upload-area { border: 2px dashed #ccc; border-radius: 12px; padding: 48px; text-align: center; cursor: pointer; transition: all 0.3s; }
    .upload-area:hover { border-color: #007bff; background: rgba(0,123,255,0.05); }
    .upload-area input { display: none; }
    .file-info { background: #f5f5f5; padding: 12px; border-radius: 8px; margin: 16px 0; }
    .code-box { background: #1e1e1e; border-radius: 8px; padding: 16px; color: #d4d4d4; font-family: monospace; font-size: 0.8rem; position: relative; max-height: 200px; overflow-y: auto; }
    .code-box pre { margin: 0; white-space: pre-wrap; word-break: break-all; }
    .copy-btn { position: absolute; top: 8px; right: 8px; padding: 6px 12px; background: #007bff; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
    button { padding: 12px 28px; border: none; border-radius: 6px; cursor: pointer; font-size: 1rem; }
    .btn-success { background: #28a745; color: #fff; }
    button:hover { opacity: 0.9; }
    .buttons { display: flex; gap: 12px; justify-content: center; }
    .footer { text-align: center; margin: 24px 0; padding: 12px; font-size: 0.85rem; color: #28a745; font-weight: 500; }
  </style>
</head>
<body>
    <div class="ad-banner-top"><div class="ad-container"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-XXXXXXXXXX" data-ad-slot="XXXXXX" data-ad-format="auto" data-full-width-responsive="true"></ins></div></div>
  <h1>Data URI生成器 <small>文件转Data URL · 内嵌资源</small></h1>

  <div class="card">
    <div class="upload-area" id="uploadArea">
      <div>📁 点击或拖拽上传文件</div>
      <input type="file" id="fileInput">
    </div>
    <div class="file-info" id="fileInfo" style="display:none;">
      <div><strong>文件名：</strong><span id="fileName"></span></div>
      <div><strong>文件大小：</strong><span id="fileSize"></span></div>
      <div><strong>MIME类型：</strong><span id="fileType"></span></div>
    </div>
    <div class="buttons">
      <button class="btn-success" onclick="copyCode()">复制Data URI</button>
    </div>
  </div>

  <div class="card" id="resultCard" style="display:none;">
    <h3>Data URI</h3>
    <div class="code-box">
      <button class="copy-btn" onclick="copyCode()">复制</button>
      <pre id="dataUri"></pre>
    </div>
  </div>

  <div class="footer">100% 免费 · 数据不上传服务器 · 仅浏览器本地处理</div>

  <script>
    const uploadArea = document.getElementById('uploadArea');
    const fileInput = document.getElementById('fileInput');
    uploadArea.addEventListener('click', () => fileInput.click());
    uploadArea.addEventListener('dragover', e => { e.preventDefault(); uploadArea.style.borderColor = '#007bff'; });
    uploadArea.addEventListener('dragleave', () => uploadArea.style.borderColor = '#ccc');
    uploadArea.addEventListener('drop', e => { e.preventDefault(); uploadArea.style.borderColor = '#ccc'; if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]); });
    fileInput.addEventListener('change', e => { if (e.target.files.length) handleFile(e.target.files[0]); });
    function handleFile(file) {
      const reader = new FileReader();
      reader.onload = e => {
        const base64 = btoa(String.fromCharCode(...new Uint8Array(e.target.result)));
        const mimeType = file.type || 'application/octet-stream';
        const dataUri = `data:${mimeType};base64,${base64}`;
        document.getElementById('fileInfo').style.display = 'block';
        document.getElementById('fileName').textContent = file.name;
        document.getElementById('fileSize').textContent = formatSize(file.size);
        document.getElementById('fileType').textContent = mimeType;
        document.getElementById('dataUri').textContent = dataUri;
        document.getElementById('resultCard').style.display = 'block';
      };
      reader.readAsArrayBuffer(file);
    }
    function formatSize(bytes) {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / 1048576).toFixed(2) + ' MB';
    }
    function copyCode() {
      const code = document.getElementById('dataUri').textContent;
      if (!code) { alert('请先上传文件'); return; }
      navigator.clipboard.writeText(code).then(() => alert('已复制'));
    }
  </script>
    <div class="ad-banner-bottom"><div class="ad-container"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-XXXXXXXXXX" data-ad-slot="XXXXXX" data-ad-format="auto" data-full-width-responsive="true"></ins></div></div>
</body>
</html>
