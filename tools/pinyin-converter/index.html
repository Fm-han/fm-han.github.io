    function setMode(m) { mode = m; document.querySelectorAll('.mode-tabs button').forEach(b => b.classList.remove('active')); event.target.classList.add('active'); convert(); }
    function convert() {
      const text = document.getElementById('inputText').value;
      if (!text) { document.getElementById('resultDisplay').textContent = '等待输入...'; return; }
      let result = '';
      for (const char of text) {
        if (/\s/.test(char)) { result += ' '; continue; }
        if (/[a-zA-Z0-9]/.test(char)) { result += char; continue; }
        const entry = pinyinMap[char];
        if (entry) {
          const py = entry[0];
          if (mode === 'tone') result += py[0].replace(/[āáǎàōóǒòēéěèīíǐìūúǔùǖǘǚǜńň]/g, c => toneMap[c] || c);
          else if (mode === 'initial') result += py[2];
          else result += py[0];
        } else {
          result += char;
        }
      }
      if (mode === 'initial') result = result.toUpperCase();
      document.getElementById('resultDisplay').textContent = result;
    }
    function copyResult() {
      const t = document.getElementById('resultDisplay').textContent;
      if (t.includes('等待')) { alert('无内容'); return; }
