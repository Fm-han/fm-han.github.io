<body>
    <div class="ad-banner-top"><div class="ad-container"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-XXXXXXXXXX" data-ad-slot="XXXXXX" data-ad-format="auto" data-full-width-responsive="true"></ins></div></div>
  <h1>罗马数字转换器 <small>阿拉伯数字 ↔ 罗马数字</small></h1>

  <div class="card">
    <div class="convert-box">
      <div class="label">阿拉伯数字 → 罗马数字</div>
      <div class="value" id="arabicDisplay">1987</div>
      <div class="label">转换结果</div>
      <div class="value" id="romanDisplay">MCMLXXXVII</div>
    </div>
    <div class="input-group">
      <label>输入阿拉伯数字 (1-3999)</label>
      <input type="number" id="arabicInput" placeholder="输入数字..." value="1987" oninput="arabicToRoman()">
    </div>
    <div class="buttons">
      <button class="btn-primary" onclick="arabicToRoman()">转换为罗马数字</button>
      <button class="btn-secondary" onclick="clearInput()">清空</button>
    </div>
  </div>

  <div class="card">
    <div class="convert-box" style="background:linear-gradient(135deg,#28a745,#218838);">
      <div class="label">罗马数字 → 阿拉伯数字</div>
      <div class="value" id="romanInputDisplay">MCMLXXXVII</div>
      <div class="label">转换结果</div>
      <div class="value" id="arabicResult">1987</div>
    </div>
    <div class="input-group">
      <label>输入罗马数字 (如: MCMXCIX)</label>
      <input type="text" id="romanInput" placeholder="输入罗马数字..." value="MCMLXXXVII" oninput="romanToArabic()">
    </div>
    <div class="buttons">
      <button class="btn-success" onclick="romanToArabic()">转换为阿拉伯数字</button>
    </div>
  </div>

  <div class="card table-section">
    <h3>罗马数字对照表</h3>
    <table>
      <tr><th>罗马数字</th><th>阿拉伯数字</th><th>罗马数字</th><th>阿拉伯数字</th></tr>
      <tr><td>I</td><td>1</td><td>XVI</td><td>16</td></tr>
      <tr><td>II</td><td>2</td><td>XVII</td><td>17</td></tr>

      <tr><td>IX</td><td>9</td><td>M</td><td>1000</td></tr>

  <script>
    function arabicToRoman() {
      const num = parseInt(document.getElementById('arabicInput').value);
      if (isNaN(num) || num < 1 || num > 3999) {
        document.getElementById('romanDisplay').textContent = '无效数值';
        document.getElementById('arabicDisplay').textContent = '--';
        return;
      }
      document.getElementById('arabicDisplay').textContent = num;
      document.getElementById('romanDisplay').textContent = toRoman(num);
    }
    function toRoman(num) {
      const vals = [1000,900,500,400,100,90,50,40,10,9,5,4,1];
      const syms = ['M','CM','D','CD','C','XC','L','XL','X','IX','V','IV','I'];
      let result = '';
      for (let i = 0; i < vals.length; i++) {
        while (num >= vals[i]) { result += syms[i]; num -= vals[i]; }
      }
      return result;
    }
    function romanToArabic() {
      const roman = document.getElementById('romanInput').value.toUpperCase();
      document.getElementById('romanInputDisplay').textContent = roman;
      document.getElementById('arabicResult').textContent = fromRoman(roman);
    }
    function fromRoman(roman) {
      const vals = { I:1, V:5, X:10, L:50, C:100, D:500, M:1000 };
      let result = 0;
      for (let i = 0; i < roman.length; i++) {
        const curr = vals[roman[i]];
        const next = vals[roman[i+1]] || 0;
        if (curr < next) result -= curr;
        else result += curr;
      }
      return result > 0 && result <= 3999 ? result : '无效';
    }
    function clearInput() {
      document.getElementById('arabicInput').value = '';
      document.getElementById('arabicDisplay').textContent = '--';
      document.getElementById('romanDisplay').textContent = '--';
    }
  </script>
