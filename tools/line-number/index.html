<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>行号添加工具 - 文本批量添加行号</title>
  <meta name="description" content="免费在线行号添加工具，给文本每一行添加行号，支持自定义起始数字、位数和分隔符。">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://fm-han.github.io/line-number/">
  <style>
                /* 顶部横幅广告 - 透明样式 */ .ad-banner-top { border-bottom: 1px solid #e0e0e0; padding: 6px 20px; text-align: center; min-height: 50px; display: flex; align-items: center; justify-content: center; } .ad-banner-bottom { border-top: 1px solid #e0e0e0; padding: 6px 20px; text-align: center; min-height: 50px; display: flex; align-items: center; justify-content: center; margin-top: 40px; } .ad-container { max-width: 728px; margin: 0 auto; min-height: 38px; display: flex; align-items: center; justify-content: center; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 800px; margin: 0 auto; padding: 20px; color: #333; line-height: 1.6; background: #fafafa; }
    h1 { text-align: center; font-size: 1.8rem; color: #1a1a1a; }
    h1 small { display: block; font-size: 0.85rem; color: #666; margin-top: 4px; font-weight: normal; }
    .card { margin: 20px 0; padding: 20px; border: 1px solid #e0e0e0; border-radius: 8px; background: #fff; }
    .editor-row { display: flex; gap: 16px; height: 300px; }
    .editor-panel { flex: 1; display: flex; flex-direction: column; }
    .editor-panel label { font-weight: 600; margin-bottom: 8px; }
    textarea { flex: 1; width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-family: monospace; font-size: 0.9rem; resize: none; box-sizing: border-box; }
    .output-textarea { background: #f5f5f5; }
    .options { display: flex; gap: 16px; margin-bottom: 16px; flex-wrap: wrap; }
    .option { display: flex; align-items: center; gap: 6px; }
    .option select, .option input { padding: 6px; border: 1px solid #ccc; border-radius: 4px; }
    .option input[type="number"] { width: 80px; }
    .option input[type="text"] { width: 60px; }
    button { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-size: 1rem; }
    .btn-primary { background: #007bff; color: #fff; }
    .btn-success { background: #28a745; color: #fff; }
    button:hover { opacity: 0.9; }
    .buttons { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .footer { text-align: center; margin: 24px 0; padding: 12px; font-size: 0.85rem; color: #28a745; font-weight: 500; }
  </style>
</head>
<body>
    <div class="ad-banner-top"><div class="ad-container"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-XXXXXXXXXX" data-ad-slot="XXXXXX" data-ad-format="auto" data-full-width-responsive="true"></ins></div></div>
  <h1>行号添加工具 <small>批量添加 · 自定义格式 · 快速编号</small></h1>

  <div class="card">
    <div class="options">
      <div class="option">
        <label>起始数字：</label>
        <input type="number" id="startNum" value="1" min="0">
      </div>
      <div class="option">
        <label>位数：</label>
        <select id="padding">
          <option value="0">不补零</option>
          <option value="2">2位 (01)</option>
          <option value="3" selected>3位 (001)</option>
          <option value="4">4位 (0001)</option>
          <option value="5">5位 (00001)</option>
        </select>
      </div>
      <div class="option">
        <label>分隔符：</label>
        <select id="separator">
          <option value=". ">点+空格 (1. )</option>
          <option value=": ">冒号+空格 (1: )</option>
          <option value=") ">右括号+空格 (1) </option>
          <option value=" - ">短横+空格 (1 - )</option>
          <option value=" ">仅空格 (1 )</option>
          <option value=":\t">冒号+Tab</option>
        </select>
      </div>
      <div class="option">
        <label>对齐：</label>
        <select id="align">
          <option value="left">左对齐</option>
          <option value="right">右对齐</option>
        </select>
      </div>
    </div>
    <div class="editor-row">
      <div class="editor-panel">
        <label>输入文本</label>
        <textarea id="inputText" placeholder="输入要添加行号的文本...">第一行内容
第二行内容
第三行内容
第四行内容
第五行内容</textarea>
      </div>
      <div class="editor-panel">
        <label>添加行号后</label>
        <textarea id="outputText" class="output-textarea" readonly></textarea>
      </div>
    </div>
    <div class="buttons" style="margin-top:16px;">
      <button class="btn-primary" onclick="addLineNumbers()">添加行号</button>
      <button class="btn-success" onclick="copyResult()">复制结果</button>
      <button class="btn-primary" onclick="removeLineNumbers()">移除行号</button>
    </div>
  </div>

  <div class="footer">100% 免费 · 数据不上传服务器 · 仅浏览器本地处理</div>

  <script>
    function addLineNumbers() {
      const text = document.getElementById('inputText').value;
      const lines = text.split('\n');
      const start = parseInt(document.getElementById('startNum').value) || 1;
      const padding = parseInt(document.getElementById('padding').value);
      const sep = document.getElementById('separator').value;
      const align = document.getElementById('align').value;
      const result = lines.map((line, i) => {
        const num = String(start + i).padStart(padding, '0');
        if (align === 'right') {
          return num + sep + line;
        } else {
          return num + sep + line;
        }
      });
      document.getElementById('outputText').value = result.join('\n');
    }
    function removeLineNumbers() {
      const text = document.getElementById('inputText').value;
      const lines = text.split('\n');
      const result = lines.map(line => line.replace(/^\d+\s*[\.\:\)\-\t]+\s*/, ''));
      document.getElementById('outputText').value = result.join('\n');
    }
    function copyResult() {
      const text = document.getElementById('outputText').value;
      if (!text) { alert('请先添加行号'); return; }
      navigator.clipboard.writeText(text).then(() => alert('已复制'));
    }
  </script>
    <div class="ad-banner-bottom"><div class="ad-container"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-XXXXXXXXXX" data-ad-slot="XXXXXX" data-ad-format="auto" data-full-width-responsive="true"></ins></div></div>
</body>
</html>
