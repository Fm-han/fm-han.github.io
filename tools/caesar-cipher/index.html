    <div class="ad-banner-top"><div class="ad-container"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-XXXXXXXXXX" data-ad-slot="XXXXXX" data-ad-format="auto" data-full-width-responsive="true"></ins></div></div>
  <h1>凯撒密码加密 <small>古典加密 · 字母偏移 · ROT13</small></h1>

  <div class="card">
    <div class="input-group">
      <label>输入原文（仅支持英文字母）</label>
      <textarea id="inputText" placeholder="输入要加密的文本...">HELLO WORLD</textarea>
    </div>
    <div class="offset-control">
      <label>偏移量：</label>
      <input type="range" id="offset" min="1" max="25" value="3" oninput="updateOffset()">
      <div class="value" id="offsetValue">3</div>
    </div>
    <div class="buttons">
      <button class="btn-primary" onclick="encrypt()">加密</button>
      <button class="btn-success" onclick="decrypt()">解密</button>
      <button class="btn-primary" onclick="rot13()">ROT13</button>
    </div>
  </div>

  <div class="card">
    <h3>加密结果</h3>
    <div class="result-box" id="resultText"></div>
    <div class="buttons">
      <button class="btn-success" onclick="copyResult()">复制结果</button>
    </div>
  </div>

  <div class="card">
    <h3>凯撒密码原理</h3>
    <p style="color:#666;">凯撒密码是一种最简单且最广为人知的加密技术。它是一种替换加密技术，明文中的所有字母都在字母表上向后（或向前）移动一个固定数目的位置。例如，当偏移量为3时，A变为D，B变为E，以此类推。</p>
    <p style="color:#666;margin-top:8px;"><strong>ROT13</strong>是一种特殊情况，偏移量为13，由于字母表有26个字母，加密和解密是相同的过程。</p>
  </div>

  <div class="footer">100% 免费 · 数据不上传服务器 · 仅浏览器本地处理</div>

  <script>
    function updateOffset() {
      document.getElementById('offsetValue').textContent = document.getElementById('offset').value;
    }
    function caesar(text, shift) {
      return text.replace(/[a-zA-Z]/g, function(c) {
        const base = c <= 'Z' ? 65 : 97;
        return String.fromCharCode((c.charCodeAt(0) - base + shift) % 26 + base);
      });
    }
    function encrypt() {
      const text = document.getElementById('inputText').value;
      const shift = parseInt(document.getElementById('offset').value);
      const encrypted = caesar(text, shift);
      document.getElementById('resultText').textContent = encrypted;
    }
    function decrypt() {
      const text = document.getElementById('inputText').value;
      const shift = parseInt(document.getElementById('offset').value);
      const decrypted = caesar(text, 26 - shift);
      document.getElementById('resultText').textContent = decrypted;
    }
    function rot13() {
      const text = document.getElementById('inputText').value;
      document.getElementById('resultText').textContent = caesar(text, 13);
    }
    function copyResult() {
      const text = document.getElementById('resultText').textContent;
      if (!text) { alert('先生成结果'); return; }
      navigator.clipboard.writeText(text).then(() => alert('已复制'));
    }
  </script>
