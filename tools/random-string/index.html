<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>随机字符串生成器 - 自定义字符集</title>
  <meta name="description" content="免费在线随机字符串生成器，自定义字符集、长度和数量，生成随机密码或标识符。">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://fm-han.github.io/random-string/">
  <style>
                /* 顶部横幅广告 - 透明样式 */ .ad-banner-top { border-bottom: 1px solid #e0e0e0; padding: 6px 20px; text-align: center; min-height: 50px; display: flex; align-items: center; justify-content: center; } .ad-banner-bottom { border-top: 1px solid #e0e0e0; padding: 6px 20px; text-align: center; min-height: 50px; display: flex; align-items: center; justify-content: center; margin-top: 40px; } .ad-container { max-width: 728px; margin: 0 auto; min-height: 38px; display: flex; align-items: center; justify-content: center; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 700px; margin: 0 auto; padding: 20px; color: #333; line-height: 1.6; background: #fafafa; }
    h1 { text-align: center; font-size: 1.8rem; color: #1a1a1a; }
    h1 small { display: block; font-size: 0.85rem; color: #666; margin-top: 4px; font-weight: normal; }
    .card { margin: 20px 0; padding: 20px; border: 1px solid #e0e0e0; border-radius: 8px; background: #fff; }
    .input-group { margin-bottom: 16px; }
    .input-group label { display: block; font-weight: 600; margin-bottom: 6px; }
    .input-group input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem; box-sizing: border-box; }
    .char-sets { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .char-set { display: flex; align-items: center; gap: 8px; padding: 8px; border: 1px solid #eee; border-radius: 6px; cursor: pointer; }
    .char-set:hover { background: #f5f5f5; }
    .char-set input { width: auto; }
    .result-display { background: #1e1e1e; border-radius: 8px; padding: 20px; margin: 16px 0; font-family: monospace; font-size: 1.1rem; color: #4ec9b0; min-height: 60px; word-break: break-all; }
    button { padding: 12px 28px; border: none; border-radius: 6px; cursor: pointer; font-size: 1rem; }
    .btn-primary { background: #007bff; color: #fff; }
    .btn-success { background: #28a745; color: #fff; }
    button:hover { opacity: 0.9; }
    .buttons { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .footer { text-align: center; margin: 24px 0; padding: 12px; font-size: 0.85rem; color: #28a745; font-weight: 500; }
  </style>
</head>
<body>
    <div class="ad-banner-top"><div class="ad-container"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-XXXXXXXXXX" data-ad-slot="XXXXXX" data-ad-format="auto" data-full-width-responsive="true"></ins></div></div>
  <h1>随机字符串生成器 <small>自定义字符集 · 批量生成</small></h1>

  <div class="card">
    <div class="input-group">
      <label>字符串长度</label>
      <input type="number" id="length" value="16" min="1" max="256">
    </div>
    <div class="input-group">
      <label>生成数量</label>
      <input type="number" id="count" value="10" min="1" max="100">
    </div>
    <div class="input-group">
      <label>字符集（选填，留空使用默认）</label>
      <input type="text" id="customChars" placeholder="例如: abc123!@#">
    </div>
    <div class="char-sets">
      <label class="char-set"><input type="checkbox" id="useLower" checked onchange="updatePreview"> 小写字母 (a-z)</label>
      <label class="char-set"><input type="checkbox" id="useUpper" checked onchange="updatePreview"> 大写字母 (A-Z)</label>
      <label class="char-set"><input type="checkbox" id="useNumber" checked onchange="updatePreview"> 数字 (0-9)</label>
      <label class="char-set"><input type="checkbox" id="useSpecial" onchange="updatePreview"> 特殊字符 (!@#$...)</label>
    </div>
    <div class="buttons" style="margin-top:16px;">
      <button class="btn-primary" onclick="generate()">生成</button>
      <button class="btn-success" onclick="copyAll()">复制全部</button>
    </div>
  </div>

  <div class="card">
    <h3>生成结果</h3>
    <div class="result-display" id="resultDisplay"></div>
  </div>

  <div class="footer">100% 免费 · 数据不上传服务器 · 仅浏览器本地处理</div>

  <script>
    const lower = 'abcdefghijklmnopqrstuvwxyz';
    const upper = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    const number = '0123456789';
    const special = '!@#$%^&*()_+-=[]{}|;:,.<>?';
    function getCharset() {
      let chars = document.getElementById('customChars').value;
      if (chars) return chars;
      chars = '';
      if (document.getElementById('useLower').checked) chars += lower;
      if (document.getElementById('useUpper').checked) chars += upper;
      if (document.getElementById('useNumber').checked) chars += number;
      if (document.getElementById('useSpecial').checked) chars += special;
      return chars || lower + upper + number;
    }
    function generate() {
      const length = parseInt(document.getElementById('length').value) || 16;
      const count = parseInt(document.getElementById('count').value) || 10;
      const charset = getCharset();
      if (!charset) { alert('请至少选择一种字符集'); return; }
      let results = [];
      for (let i = 0; i < count; i++) {
        let str = '';
        for (let j = 0; j < length; j++) {
          str += charset.charAt(Math.floor(Math.random() * charset.length));
        }
        results.push(str);
      }
      document.getElementById('resultDisplay').textContent = results.join('\n');
    }
    function updatePreview() {
      const charset = getCharset();
      let preview = '';
      for (let i = 0; i < 8; i++) {
        for (let j = 0; j < 16; j++) {
          preview += charset.charAt(Math.floor(Math.random() * charset.length));
        }
        preview += '\n';
      }
    }
    function copyAll() {
      const text = document.getElementById('resultDisplay').textContent;
      if (!text) { alert('先生成'); return; }
      navigator.clipboard.writeText(text).then(() => alert('已复制'));
    }
    generate();
  </script>
    <div class="ad-banner-bottom"><div class="ad-container"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-XXXXXXXXXX" data-ad-slot="XXXXXX" data-ad-format="auto" data-full-width-responsive="true"></ins></div></div>
</body>
</html>
