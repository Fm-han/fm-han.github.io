<body>
    <div class="ad-banner-top"><div class="ad-container"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-XXXXXXXXXX" data-ad-slot="XXXXXX" data-ad-format="auto" data-full-width-responsive="true"></ins></div></div>

  <h1>YAML转换器 <small>JSON ↔ YAML 互转 / 格式化 / 浏览器本地</small></h1>

  <div class="section">
    <div class="convert-row">
      <div>
        <label>JSON 输入</label>
        <textarea id="jsonInput" placeholder='{"name":"张三","age":25,"skills":["Python","Java"]}'></textarea>
        <div class="buttons">
          <button class="btn-primary" onclick="jsonToYaml()">JSON → YAML</button>
          <button class="btn-clear" onclick="document.getElementById('jsonInput').value='';document.getElementById('yamlOutput').value=''">清空</button>
        </div>
      </div>
      <div>
        <button class="arrow-btn" onclick="swapSides()">⇄</button>
      </div>
      <div>
        <label>YAML 输出</label>
        <textarea id="yamlOutput" class="readonly" readonly placeholder="# YAML 输出..."></textarea>
        <div class="buttons">
          <button class="btn-copy" onclick="copyYaml()">复制YAML</button>
        </div>
      </div>
    </div>
  </div>

  <div class="section">
    <label>转换说明</label>
    <div style="padding:12px;background:#f8f9fa;border-radius:6px;font-size:0.9rem;">
      <p>• 点击 <strong>JSON → YAML</strong> 将左侧JSON转换为YAML格式</p>
      <p>• 点击 <strong>⇄</strong> 交换两侧内容，继续转换</p>
      <p>• 支持嵌套对象、数组、字符串、数字等常见JSON类型</p>
    </div>
  </div>

  <div class="footer">100% 免费 · 数据不上传服务器 · 仅浏览器本地处理</div>

  <script>
    function jsonToYaml() {
      const input = document.getElementById('jsonInput').value.trim();
      if (!input) { alert('请输入JSON'); return; }
      try {
        const obj = JSON.parse(input);
        const yaml = jsonToYamlStr(obj, 0);
        document.getElementById('yamlOutput').value = yaml;
      } catch(e) {
        alert('JSON格式错误: ' + e.message);
      }
    }
    function jsonToYamlStr(obj, indent) {
      const spaces = '  '.repeat(indent);
      if (Array.isArray(obj)) {
        return obj.map(item => {
          if (typeof item === 'object' && item !== null) {
            return spaces + '- ' + jsonToYamlStr(item, indent + 1).split('\n').join('\n' + spaces + '  ');
          }
          return spaces + '- ' + yamlValue(item);
        }).join('\n');
      } else if (typeof obj === 'object' && obj !== null) {
        return Object.entries(obj).map(([k, v]) => {
          if (typeof v === 'object' && v !== null) {
            const prefix = spaces + k + ':';
            if (Array.isArray(v)) {
              return prefix + '\n' + spaces + '  ' + jsonToYamlStr(v, indent + 1).split('\n').join('\n' + spaces + '  ');
            }
            return prefix + '\n' + spaces + '  ' + jsonToYamlStr(v, indent + 1).split('\n').join('\n' + spaces + '  ');
          }
          return spaces + k + ': ' + yamlValue(v);
        }).join('\n');
      }
      return spaces + yamlValue(obj);
    }
    function yamlValue(v) {
      if (typeof v === 'string') {
        if (v.includes(':') || v.includes('#') || v.includes('\n') || v === '') return '"' + v.replace(/"/g, '\\"') + '"';
        return v;
      }
      if (v === null) return 'null';
      return String(v);
    }
    function swapSides() {
      const j = document.getElementById('jsonInput').value;
      const y = document.getElementById('yamlOutput').value;
      document.getElementById('jsonInput').value = y;
      document.getElementById('yamlOutput').value = j;
    }
    function copyYaml() {
      const t = document.getElementById('yamlOutput').value;
      if (!t) { alert('无内容'); return; }
      navigator.clipboard.writeText(t).then(() => alert('已复制!'));
    }
  </script>
