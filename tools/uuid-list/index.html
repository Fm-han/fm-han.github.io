<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UUID批量生成器 - v1/v4版本</title>
  <meta name="description" content="免费在线UUID批量生成器，支持v1和v4版本，一键生成多个UUID。">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://fm-han.github.io/uuid-list/">
  <style>
                /* 顶部横幅广告 - 透明样式 */ .ad-banner-top { border-bottom: 1px solid #e0e0e0; padding: 6px 20px; text-align: center; min-height: 50px; display: flex; align-items: center; justify-content: center; } .ad-banner-bottom { border-top: 1px solid #e0e0e0; padding: 6px 20px; text-align: center; min-height: 50px; display: flex; align-items: center; justify-content: center; margin-top: 40px; } .ad-container { max-width: 728px; margin: 0 auto; min-height: 38px; display: flex; align-items: center; justify-content: center; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 700px; margin: 0 auto; padding: 20px; color: #333; line-height: 1.6; background: #fafafa; }
    h1 { text-align: center; font-size: 1.8rem; color: #1a1a1a; }
    h1 small { display: block; font-size: 0.85rem; color: #666; margin-top: 4px; font-weight: normal; }
    .card { margin: 20px 0; padding: 20px; border: 1px solid #e0e0e0; border-radius: 8px; background: #fff; }
    .options { display: flex; gap: 16px; margin-bottom: 16px; flex-wrap: wrap; }
    .option { flex: 1; min-width: 150px; }
    .option label { display: block; font-weight: 600; margin-bottom: 6px; }
    .option input, .option select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
    .uuid-display { background: #f5f5f5; border-radius: 8px; padding: 16px; max-height: 400px; overflow-y: auto; font-family: monospace; font-size: 0.95rem; }
    .uuid-item { padding: 6px 0; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid #eee; }
    .uuid-item .num { color: #999; width: 40px; }
    .uuid-item .value { flex: 1; word-break: break-all; }
    .uuid-item .copy { padding: 2px 8px; border: 1px solid #ccc; border-radius: 4px; background: #fff; cursor: pointer; font-size: 0.8rem; }
    .uuid-item .copy:hover { background: #f0f0f0; }
    button { padding: 12px 28px; border: none; border-radius: 6px; cursor: pointer; font-size: 1rem; }
    .btn-primary { background: #007bff; color: #fff; }
    .btn-success { background: #28a745; color: #fff; }
    .btn-secondary { background: #6c757d; color: #fff; }
    button:hover { opacity: 0.9; }
    .buttons { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .footer { text-align: center; margin: 24px 0; padding: 12px; font-size: 0.85rem; color: #28a745; font-weight: 500; }
  </style>
</head>
<body>
    <div class="ad-banner-top"><div class="ad-container"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-XXXXXXXXXX" data-ad-slot="XXXXXX" data-ad-format="auto" data-full-width-responsive="true"></ins></div></div>
  <h1>UUID批量生成器 <small>UUID v1 · UUID v4 · RFC4122</small></h1>

  <div class="card">
    <div class="options">
      <div class="option">
        <label>UUID版本</label>
        <select id="version">
          <option value="4">v4 (随机)</option>
          <option value="1">v1 (时间序列)</option>
        </select>
      </div>
      <div class="option">
        <label>生成数量</label>
        <input type="number" id="count" value="20" min="1" max="1000">
      </div>
    </div>
    <div class="buttons">
      <button class="btn-primary" onclick="generateUuids()">生成UUID</button>
      <button class="btn-success" onclick="copyAll()">复制全部</button>
      <button class="btn-secondary" onclick="downloadJson()">下载JSON</button>
    </div>
  </div>

  <div class="card">
    <h3>UUID列表</h3>
    <div class="uuid-display" id="uuidList">
      <div style="text-align:center;color:#999;padding:40px;">点击生成UUID按钮开始生成</div>
    </div>
  </div>

  <div class="card">
    <h3>UUID版本说明</h3>
    <ul style="padding-left:20px;color:#666;">
      <li><strong>v1：</strong>基于时间戳和MAC地址生成，具有时间顺序性</li>
      <li><strong>v4：</strong>基于随机数生成，使用最广泛</li>
      <li><strong>v3/v5：</strong>基于命名空间和哈希生成</li>
    </ul>
  </div>

  <div class="footer">100% 免费 · 数据不上传服务器 · 仅浏览器本地处理</div>

  <script>
    function uuidv1() {
      const d = new Date().getTime();
      const uuid = 'xxxxxxxx-xxxx-1xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
        const r = (d + Math.random() * 16) % 16 | 0;
        return (c === 'x' ? r : r & 0x3 | 0x8).toString(16);
      });
      return uuid;
    }
    function uuidv4() {
      return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
        const r = Math.random() * 16 | 0;
        return (c === 'x' ? r : r & 0x3 | 0x8).toString(16);
      });
    }
    function generateUuids() {
      const version = document.getElementById('version').value;
      const count = parseInt(document.getElementById('count').value) || 10;
      const func = version === '1' ? uuidv1 : uuidv4;
      const uuids = [];
      for (let i = 0; i < count; i++) uuids.push(func());
      document.getElementById('uuidList').innerHTML = uuids.map((uuid, i) =>
        `<div class="uuid-item"><span class="num">${i + 1}.</span><span class="value">${uuid}</span><button class="copy" onclick="copyOne('${uuid}')">复制</button></div>`
      ).join('');
    }
    function copyOne(uuid) { navigator.clipboard.writeText(uuid).then(() => alert('已复制')); }
    function copyAll() {
      const uuids = Array.from(document.querySelectorAll('.uuid-item .value')).map(el => el.textContent);
      if (!uuids.length) { alert('先生成UUID'); return; }
      navigator.clipboard.writeText(uuids.join('\n')).then(() => alert('已复制' + uuids.length + '个UUID'));
    }
    function downloadJson() {
      const uuids = Array.from(document.querySelectorAll('.uuid-item .value')).map(el => el.textContent);
      if (!uuids.length) { alert('先生成UUID'); return; }
      const json = JSON.stringify(uuids.map((uuid, i) => ({ id: i + 1, uuid })), null, 2);
      const blob = new Blob([json], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'uuids.json';
      a.click();
      URL.revokeObjectURL(url);
    }
  </script>
    <div class="ad-banner-bottom"><div class="ad-container"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-XXXXXXXXXX" data-ad-slot="XXXXXX" data-ad-format="auto" data-full-width-responsive="true"></ins></div></div>
</body>
</html>
