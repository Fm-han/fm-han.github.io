  <title>日期间隔计算器 - 计算两个日期之间的天数</title>
  <meta name="description" content="免费在线日期间隔计算器，计算两个日期之间的天数、工作日天数、星期数，支持农历节日倒计时。">
  <meta name="robots" content="index, follow">

  <style>
                /* 顶部横幅广告 - 透明样式 */ .ad-banner-top { border-bottom: 1px solid #e0e0e0; padding: 6px 20px; text-align: center; min-height: 50px; display: flex; align-items: center; justify-content: center; } .ad-banner-bottom { border-top: 1px solid #e0e0e0; padding: 6px 20px; text-align: center; min-height: 50px; display: flex; align-items: center; justify-content: center; margin-top: 40px; } .ad-container { max-width: 728px; margin: 0 auto; min-height: 38px; display: flex; align-items: center; justify-content: center; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 700px; margin: 0 auto; padding: 20px; color: #333; line-height: 1.6; background: #fafafa; }
    h1 { text-align: center; font-size: 1.8rem; color: #1a1a1a; }
    h1 small { display: block; font-size: 0.85rem; color: #666; margin-top: 4px; font-weight: normal; }
    .card { margin: 20px 0; padding: 20px; border: 1px solid #e0e0e0; border-radius: 8px; background: #fff; }

</head>
<body>
    <div class="ad-banner-top"><div class="ad-container"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-XXXXXXXXXX" data-ad-slot="XXXXXX" data-ad-format="auto" data-full-width-responsive="true"></ins></div></div>
  <h1>日期间隔计算器 <small>计算天数 · 工作日 · 星期差</small></h1>

  <div class="card">
    <div class="date-inputs">
      <input type="date" id="startDate">
      <span class="arrow">→</span>
      <input type="date" id="endDate">
    </div>
    <div class="quick-dates">
      <button class="quick-btn" onclick="setToday()">今天</button>
      <button class="quick-btn" onclick="setWeek()">一周后</button>
      <button class="quick-btn" onclick="setMonth()">一个月后</button>
      <button class="quick-btn" onclick="setYear()">一年后</button>
    </div>
    <div class="buttons" style="margin-top:16px;">
      <button class="btn-primary" onclick="calculate()">计算间隔</button>
    </div>
  </div>

  <div class="card" id="resultCard" style="display:none;">
    <div class="result-grid">
      <div class="result-item highlight">
        <div class="num" id="totalDays">--</div>
        <div class="label">总天数</div>
      </div>
      <div class="result-item">
        <div class="num" id="workDays">--</div>
        <div class="label">工作日</div>
      </div>
      <div class="result-item">
        <div class="num" id="weekendDays">--</div>
        <div class="label">周末天数</div>
      </div>
      <div class="result-item">
        <div class="num" id="weeks">--</div>
        <div class="label">周数</div>
      </div>
      <div class="result-item">
        <div class="num" id="dayOfWeek">--</div>
        <div class="label">起始星期</div>
      </div>
      <div class="result-item">
        <div class="num" id="endDayOfWeek">--</div>
        <div class="label">结束星期</div>
      </div>
    </div>
  </div>

  <div class="card">
    <h3>日期计算说明</h3>
    <ul style="padding-left:20px;color:#666;">
      <li>总天数：包含起始和结束日期在内的总天数</li>
      <li>工作日：排除周六日的纯工作天数</li>
      <li>周数：总天数除以7的商</li>
    </ul>
  </div>

  <div class="footer">100% 免费 · 数据不上传服务器 · 仅浏览器本地处理</div>

  <script>
    const weekdays = ['周日','周一','周二','周三','周四','周五','周六'];
    function setToday() {
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('startDate').value = today;
      document.getElementById('endDate').value = today;
    }
    function setWeek() {
      const d = new Date(); d.setDate(d.getDate() + 7);
      document.getElementById('startDate').value = new Date().toISOString().split('T')[0];
      document.getElementById('endDate').value = d.toISOString().split('T')[0];
    }
    function setMonth() {
      const d = new Date(); d.setMonth(d.getMonth() + 1);
      document.getElementById('startDate').value = new Date().toISOString().split('T')[0];
      document.getElementById('endDate').value = d.toISOString().split('T')[0];
    }
    function setYear() {
      const d = new Date(); d.setFullYear(d.getFullYear() + 1);
      document.getElementById('startDate').value = new Date().toISOString().split('T')[0];
      document.getElementById('endDate').value = d.toISOString().split('T')[0];
    }
    function calculate() {
      const start = document.getElementById('startDate').value;
      const end = document.getElementById('endDate').value;
      if (!start || !end) { alert('请选择起始和结束日期'); return; }
      const startD = new Date(start);
      const endD = new Date(end);
      if (endD < startD) { alert('结束日期不能早于起始日期'); return; }
      const diff = endD - startD;
      const totalDays = Math.floor(diff / (1000 * 60 * 60 * 24)) + 1;
      let workDays = 0, weekendDays = 0;
      for (let d = new Date(startD); d <= endD; d.setDate(d.getDate() + 1)) {
        const day = d.getDay();
        if (day === 0 || day === 6) weekendDays++;
        else workDays++;
      }
      document.getElementById('resultCard').style.display = 'block';
      document.getElementById('totalDays').textContent = totalDays;
      document.getElementById('workDays').textContent = workDays;
      document.getElementById('weekendDays').textContent = weekendDays;
      document.getElementById('weeks').textContent = (totalDays / 7).toFixed(1);
      document.getElementById('dayOfWeek').textContent = weekdays[startD.getDay()];
      document.getElementById('endDayOfWeek').textContent = weekdays[endD.getDay()];
    }
    setToday();
  </script>

</html>
