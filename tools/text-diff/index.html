<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文本对比工具 - 两段文字差异比较</title>
  <meta name="description" content="免费在线文本对比工具，逐行对比两段文字差异，高亮显示新增、删除和修改的行。">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://fm-han.github.io/text-diff/">
  <style>
                /* 顶部横幅广告 - 透明样式 */ .ad-banner-top { border-bottom: 1px solid #e0e0e0; padding: 6px 20px; text-align: center; min-height: 50px; display: flex; align-items: center; justify-content: center; } .ad-banner-bottom { border-top: 1px solid #e0e0e0; padding: 6px 20px; text-align: center; min-height: 50px; display: flex; align-items: center; justify-content: center; margin-top: 40px; } .ad-container { max-width: 728px; margin: 0 auto; min-height: 38px; display: flex; align-items: center; justify-content: center; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 900px; margin: 0 auto; padding: 20px; color: #333; line-height: 1.6; background: #fafafa; }
    h1 { text-align: center; font-size: 1.8rem; color: #1a1a1a; }
    h1 small { display: block; font-size: 0.85rem; color: #666; margin-top: 4px; font-weight: normal; }
    .card { margin: 20px 0; padding: 20px; border: 1px solid #e0e0e0; border-radius: 8px; background: #fff; }
    .editor-row { display: flex; gap: 16px; height: 300px; }
    .editor-panel { flex: 1; display: flex; flex-direction: column; }
    .editor-panel label { font-weight: 600; margin-bottom: 8px; }
    textarea { flex: 1; width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-family: monospace; font-size: 0.9rem; resize: none; box-sizing: border-box; }
    .diff-view { background: #f5f5f5; border-radius: 8px; max-height: 500px; overflow-y: auto; padding: 16px; }
    .diff-line { display: flex; padding: 4px 8px; border-radius: 4px; margin: 2px 0; font-family: monospace; font-size: 0.9rem; }
    .diff-line.add { background: #d4edda; color: #155724; }
    .diff-line.del { background: #f8d7da; color: #721c24; text-decoration: line-through; }
    .diff-line.unchanged { color: #666; }
    .diff-line .line-num { width: 40px; color: #999; text-align: right; padding-right: 8px; flex-shrink: 0; }
    .diff-line .content { flex: 1; word-break: break-all; }
    .diff-line .marker { width: 24px; flex-shrink: 0; font-weight: bold; }
    .diff-line.add .marker { color: #28a745; }
    .diff-line.del .marker { color: #dc3545; }
    .stats { display: flex; gap: 16px; justify-content: center; margin: 16px 0; }
    .stat-item { padding: 12px 20px; background: #f5f5f5; border-radius: 8px; text-align: center; }
    .stat-item .num { font-size: 1.5rem; font-weight: 700; }
    .stat-item.add .num { color: #28a745; }
    .stat-item.del .num { color: #dc3545; }
    .stat-item.total .num { color: #007bff; }
    button { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-size: 1rem; }
    .btn-primary { background: #007bff; color: #fff; }
    button:hover { opacity: 0.9; }
    .buttons { display: flex; gap: 12px; justify-content: center; }
    .footer { text-align: center; margin: 24px 0; padding: 12px; font-size: 0.85rem; color: #28a745; font-weight: 500; }
  </style>
</head>
<body>
    <div class="ad-banner-top"><div class="ad-container"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-XXXXXXXXXX" data-ad-slot="XXXXXX" data-ad-format="auto" data-full-width-responsive="true"></ins></div></div>
  <h1>文本对比工具 <small>逐行对比 · 高亮差异 · 新增删除</small></h1>

  <div class="card">
    <div class="editor-row">
      <div class="editor-panel">
        <label>原文</label>
        <textarea id="originalText" placeholder="输入原始文本...">第一行内容
第二行内容
第三行内容
第四行内容
第五行内容</textarea>
      </div>
      <div class="editor-panel">
        <label>修改后</label>
        <textarea id="modifiedText" placeholder="输入修改后的文本...">第一行内容
新的第二行
第三行内容
第五行内容
新增的第六行</textarea>
      </div>
    </div>
    <div class="buttons" style="margin-top:16px;">
      <button class="btn-primary" onclick="compare()">对比差异</button>
    </div>
  </div>

  <div class="card" id="resultCard" style="display:none;">
    <div class="stats">
      <div class="stat-item add"><div class="num" id="addCount">0</div><div class="label">新增行</div></div>
      <div class="stat-item del"><div class="num" id="delCount">0</div><div class="label">删除行</div></div>
      <div class="stat-item total"><div class="num" id="sameCount">0</div><div class="label">未变行</div></div>
    </div>
    <div class="diff-view" id="diffView"></div>
  </div>

  <div class="footer">100% 免费 · 数据不上传服务器 · 仅浏览器本地处理</div>

  <script>
    function compare() {
      const original = document.getElementById('originalText').value.split('\n');
      const modified = document.getElementById('modifiedText').value.split('\n');
      const lcs = getLCS(original, modified);
      const diff = buildDiff(original, modified, lcs);
      let addCount = 0, delCount = 0, sameCount = 0;
      let html = '';
      diff.forEach(item => {
        if (item.type === 'same') {
          sameCount++;
          html += `<div class="diff-line unchanged"><span class="line-num">${item.oldLine || ''}</span><span class="marker"></span><span class="content">${escapeHtml(item.content)}</span></div>`;
        } else if (item.type === 'del') {
          delCount++;
          html += `<div class="diff-line del"><span class="line-num">${item.oldLine}</span><span class="marker">-</span><span class="content">${escapeHtml(item.content)}</span></div>`;
        } else if (item.type === 'add') {
          addCount++;
          html += `<div class="diff-line add"><span class="line-num">${item.newLine}</span><span class="marker">+</span><span class="content">${escapeHtml(item.content)}</span></div>`;
        }
      });
      document.getElementById('resultCard').style.display = 'block';
      document.getElementById('addCount').textContent = addCount;
      document.getElementById('delCount').textContent = delCount;
      document.getElementById('sameCount').textContent = sameCount;
      document.getElementById('diffView').innerHTML = html;
    }
    function getLCS(a, b) {
      const m = a.length, n = b.length;
      const dp = Array(m + 1).fill(null).map(() => Array(n + 1).fill(0));
      for (let i = 1; i <= m; i++) {
        for (let j = 1; j <= n; j++) {
          if (a[i-1] === b[j-1]) dp[i][j] = dp[i-1][j-1] + 1;
          else dp[i][j] = Math.max(dp[i-1][j], dp[i][j-1]);
        }
      }
      const result = [];
      let i = m, j = n;
      while (i > 0 && j > 0) {
        if (a[i-1] === b[j-1]) { result.unshift({ a: i-1, b: j-1 }); i--; j--; }
        else if (dp[i-1][j] > dp[i][j-1]) i--;
        else j--;
      }
      return result;
    }
    function buildDiff(original, modified, lcs) {
      const result = [];
      let oi = 0, mi = 0, li = 0;
      while (oi < original.length || mi < modified.length) {
        if (li < lcs.length && oi === lcs[li].a && mi === lcs[li].b) {
          result.push({ type: 'same', content: original[oi], oldLine: oi + 1, newLine: mi + 1 });
          oi++; mi++; li++;
        } else {
          while (li < lcs.length && oi < lcs[li].a) {
            result.push({ type: 'del', content: original[oi], oldLine: oi + 1 });
            oi++;
          }
          while (li < lcs.length && mi < lcs[li].b) {
            result.push({ type: 'add', content: modified[mi], newLine: mi + 1 });
            mi++;
          }
          if (li >= lcs.length) {
            while (oi < original.length) { result.push({ type: 'del', content: original[oi], oldLine: oi + 1 }); oi++; }
            while (mi < modified.length) { result.push({ type: 'add', content: modified[mi], newLine: mi + 1 }); mi++; }
          }
        }
      }
      return result;
    }
    function escapeHtml(text) {
      return text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
  </script>

</body>
</html>
