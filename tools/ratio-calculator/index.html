<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>比例计算器 - 按比例分配数值</title>
  <meta name="description" content="免费在线比例计算器，将数值按给定比例分配，适用于分配资金、人数、物资等场景。">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://fm-han.github.io/ratio-calculator/">
  <style>
                /* 顶部横幅广告 - 透明样式 */ .ad-banner-top { border-bottom: 1px solid #e0e0e0; padding: 6px 20px; text-align: center; min-height: 50px; display: flex; align-items: center; justify-content: center; } .ad-banner-bottom { border-top: 1px solid #e0e0e0; padding: 6px 20px; text-align: center; min-height: 50px; display: flex; align-items: center; justify-content: center; margin-top: 40px; } .ad-container { max-width: 728px; margin: 0 auto; min-height: 38px; display: flex; align-items: center; justify-content: center; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 700px; margin: 0 auto; padding: 20px; color: #333; line-height: 1.6; background: #fafafa; }
    h1 { text-align: center; font-size: 1.8rem; color: #1a1a1a; }
    h1 small { display: block; font-size: 0.85rem; color: #666; margin-top: 4px; font-weight: normal; }
    .card { margin: 20px 0; padding: 20px; border: 1px solid #e0e0e0; border-radius: 8px; background: #fff; }
    .input-section { margin-bottom: 20px; }
    .input-group { margin-bottom: 12px; }
    .input-group label { display: block; font-weight: 600; margin-bottom: 6px; }
    .input-group input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem; box-sizing: border-box; }
    .ratio-inputs { display: flex; gap: 8px; margin-bottom: 12px; }
    .ratio-inputs input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 6px; text-align: center; }
    .result-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 20px 0; }
    .result-item { background: linear-gradient(135deg, #007bff, #0056b3); border-radius: 12px; padding: 20px; color: #fff; text-align: center; }
    .result-item .label { font-size: 0.9rem; opacity: 0.9; }
    .result-item .value { font-size: 1.8rem; font-weight: 700; margin-top: 4px; }
    .result-item .ratio { font-size: 0.8rem; opacity: 0.8; margin-top: 4px; }
    button { padding: 12px 28px; border: none; border-radius: 6px; cursor: pointer; font-size: 1rem; }
    .btn-primary { background: #007bff; color: #fff; }
    .btn-success { background: #28a745; color: #fff; }
    .btn-secondary { background: #6c757d; color: #fff; }
    button:hover { opacity: 0.9; }
    .buttons { display: flex; gap: 12px; justify-content: center; }
    .footer { text-align: center; margin: 24px 0; padding: 12px; font-size: 0.85rem; color: #28a745; font-weight: 500; }
  </style>
</head>
<body>
    <div class="ad-banner-top"><div class="ad-container"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-XXXXXXXXXX" data-ad-slot="XXXXXX" data-ad-format="auto" data-full-width-responsive="true"></ins></div></div>
  <h1>比例计算器 <small>按比例分配 · 计算份额</small></h1>

  <div class="card">
    <div class="input-section">
      <div class="input-group"><label>要分配的总数值</label><input type="number" id="totalValue" placeholder="例如：10000" value="10000"></div>
      <div class="input-group"><label>比例（用逗号分隔，如：3,2,1）</label><input type="text" id="ratioStr" placeholder="例如：3,2,1" value="3,2,1"></div>
      <div class="ratio-inputs" id="ratioInputs">
        <input type="number" placeholder="比例1" value="3" min="0">
        <input type="number" placeholder="比例2" value="2" min="0">
        <input type="number" placeholder="比例3" value="1" min="0">
      </div>
      <button style="padding:8px 16px;background:#28a745;color:#fff;border:none;border-radius:6px;cursor:pointer;" onclick="addRatioInput()">+ 添加份额</button>
    </div>
    <div class="buttons">
      <button class="btn-primary" onclick="calculate()">计算分配</button>
      <button class="btn-secondary" onclick="clearAll()">重置</button>
    </div>
  </div>

  <div class="card" id="resultCard" style="display:none;">
    <h3 style="text-align:center;">分配结果</h3>
    <div class="result-grid" id="resultGrid"></div>
    <div style="text-align:center;padding:12px;background:#f5f5f5;border-radius:8px;margin-top:16px;">
      <div style="color:#666;">总计验证</div>
      <div style="font-size:1.5rem;font-weight:700;color:#007bff;" id="totalVerify">--</div>
    </div>
  </div>

  <div class="card">
    <h3>应用场景</h3>
    <ul style="padding-left:20px;color:#666;">
      <li><strong>利润分配：</strong>按投资比例分配利润</li>
      <li><strong>费用分摊：</strong>合租水电费按房间比例分摊</li>
      <li><strong>遗产继承：</strong>按遗嘱比例分配遗产</li>
      <li><strong>资源分配：</strong>按需求比例分配物资</li>
    </ul>
  </div>

  <div class="footer">100% 免费 · 数据不上传服务器 · 仅浏览器本地处理</div>

  <script>
    function addRatioInput() {
      const container = document.getElementById('ratioInputs');
      const input = document.createElement('input');
      input.type = 'number';
      input.placeholder = '新份额';
      input.min = '0';
      input.value = '1';
      container.appendChild(input);
    }
    function calculate() {
      const total = parseFloat(document.getElementById('totalValue').value);
      const ratioInputs = document.querySelectorAll('#ratioInputs input');
      const ratios = Array.from(ratioInputs).map(i => parseFloat(i.value) || 0).filter(v => v > 0);
      if (isNaN(total) || ratios.length === 0) { alert('请输入有效数值'); return; }
      const totalRatio = ratios.reduce((a, b) => a + b, 0);
      const unit = total / totalRatio;
      let html = '';
      let calculated = [];
      ratios.forEach((r, i) => {
        const value = r * unit;
        calculated.push(value);
        const percent = (r / totalRatio * 100).toFixed(1);
        html += `<div class="result-item">
          <div class="label">第 ${i + 1} 份</div>
          <div class="value">${value.toFixed(2)}</div>
          <div class="ratio">比例 ${r}:${totalRatio} (${percent}%)</div>
        </div>`;
      });
      document.getElementById('resultCard').style.display = 'block';
      document.getElementById('resultGrid').innerHTML = html;
      document.getElementById('totalVerify').textContent = calculated.reduce((a, b) => a + b, 0).toFixed(2);
    }
    function clearAll() {
      document.querySelectorAll('input').forEach(i => i.value = '');
      document.getElementById('resultCard').style.display = 'none';
    }
  </script>
    <div class="ad-banner-bottom"><div class="ad-container"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-XXXXXXXXXX" data-ad-slot="XXXXXX" data-ad-format="auto" data-full-width-responsive="true"></ins></div></div>
</body>
</html>
