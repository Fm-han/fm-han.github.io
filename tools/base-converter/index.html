<body>
    <div class="ad-banner-top"><div class="ad-container"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-XXXXXXXXXX" data-ad-slot="XXXXXX" data-ad-format="auto" data-full-width-responsive="true"></ins></div></div>

  <h1>进制转换器 <small>二进制 / 八进制 / 十进制 / 十六进制 · 浏览器本地</small></h1>

  <div class="section">
    <label>输入数字</label>
    <input type="text" id="input" placeholder="输入任意进制的数字，如: 255 或 0xFF 或 0b11111111" oninput="convert()">
    <div class="base-tabs">
      <button class="active" onclick="setBase(10)" id="tab10">十进制输入</button>
      <button onclick="setBase(16)" id="tab16">十六进制输入</button>
      <button onclick="setBase(2)" id="tab2">二进制输入</button>
    </div>
    <div class="buttons">
      <button class="btn-primary" onclick="convert()">转换</button>
      <button class="btn-copy" onclick="copyAll()">复制全部</button>
      <button class="btn-clear" onclick="document.getElementById('input').value='';document.getElementById('results').innerHTML=''">清空</button>
    </div>
  </div>

  <div class="section">
    <label>转换结果</label>
    <div class="bases" id="results">
      <div class="base-item"><div class="base-label">二进制 (Base 2)</div><div class="base-value" onclick="copy(this)">-</div></div>
      <div class="base-item"><div class="base-label">八进制 (Base 8)</div><div class="base-value" onclick="copy(this)">-</div></div>
      <div class="base-item"><div class="base-label">十进制 (Base 10)</div><div class="base-value" onclick="copy(this)">-</div></div>
      <div class="base-item"><div class="base-label">十六进制 (Base 16)</div><div class="base-value" onclick="copy(this)">-</div></div>
      <div class="base-item"><div class="base-label">三十二进制 (Base 32)</div><div class="base-value" onclick="copy(this)">-</div></div>
      <div class="base-item"><div class="base-label">六十四进制 (Base 64)</div><div class="base-value" onclick="copy(this)">-</div></div>
    </div>
    <p style="font-size:0.8rem;color:#888;margin-top:12px;">💡 点击任意结果可单独复制</p>
  </div>

  <div class="footer">100% 免费 · 数据不上传服务器 · 仅浏览器本地处理</div>

  <script>
    let inputBase = 10;

    function setBase(base) {
      inputBase = base;
      document.querySelectorAll('.base-tabs button').forEach(b => b.classList.remove('active'));
      document.getElementById('tab' + base).classList.add('active');
      convert();
    }

    function convert() {
      const input = document.getElementById('input').value.trim();
      if (!input) {
        document.querySelectorAll('.base-value').forEach(el => el.textContent = '-');
        return;
      }

      let num;
      try {
        num = parseInt(input, inputBase);
        if (isNaN(num) || num < 0) throw new Error();
      } catch {
        document.querySelectorAll('.base-value').forEach(el => el.textContent = '无效输入');
        return;
      }

      const vals = [
        num.toString(2),
        num.toString(8),
        num.toString(10),
        '0x' + num.toString(16).toUpperCase(),
        toBase32(num),
        toBase64(num)
      ];

      document.querySelectorAll('.base-value').forEach((el, i) => {
        el.textContent = vals[i];
      });
    }

    function toBase32(num) {
      const chars = '0123456789ABCDEFGHIJKLMNOPQRSTUV';
      if (num === 0) return '0';
      let result = '';
      while (num > 0) { result = chars[num % 32] + result; num = Math.floor(num / 32); }
      return result;
    }

    function toBase64(num) {
      const chars = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz+/';
      if (num === 0) return '0';
      let result = '';
      while (num > 0) { result = chars[num % 64] + result; num = Math.floor(num / 64); }
      return result;
    }

    function copy(el) {
      if (el.textContent && el.textContent !== '-') {
        navigator.clipboard.writeText(el.textContent).then(() => {
          const orig = el.style.background;
          el.style.background = '#c8e6c9';
          setTimeout(() => el.style.background = orig, 300);
        });
      }
    }

    function copyAll() {
      const text = Array.from(document.querySelectorAll('.base-value')).map(el => el.textContent).join('\n');
      navigator.clipboard.writeText(text).then(() => alert('已复制!'));
    }
  </script>
