<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UUID批量生成器</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#fafafa;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;padding:20px;min-height:100vh}
.container{max-width:650px;margin:0 auto}
h1{text-align:center;color:#333;margin-bottom:24px;font-size:22px}
.card{background:#fff;border:1px solid #e0e0e0;border-radius:8px;padding:24px;margin-bottom:16px}
label{display:block;font-weight:600;margin-bottom:6px;color:#555;font-size:14px}
input[type="number"],select{padding:8px;border:1px solid #ddd;border-radius:4px;font-size:14px}
.btn{background:#007bff;color:#fff;border:none;padding:8px 20px;border-radius:4px;cursor:pointer;font-size:14px;margin-top:8px}
.btn:hover{background:#0056b3}
.btn-green{background:#28a745}
.btn-green:hover{background:#218838}
.result{background:#f5f5f5;padding:12px;border-radius:4px;font-family:monospace;font-size:13px;margin-top:12px;min-height:100px;max-height:400px;overflow-y:auto;white-space:pre-wrap;word-break:break-all;line-height:1.8}
.row{display:flex;gap:16px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.row label{margin:0;white-space:nowrap}
.uuid-opt{display:flex;align-items:center;gap:6px;padding:6px 0}
.uuid-opt input[type="checkbox"]{cursor:pointer}
.uuid-opt label{margin:0;cursor:pointer;font-weight:normal;font-size:14px}
.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.format-select{padding:8px;border:1px solid #ddd;border-radius:4px;font-size:14px;margin-top:8px}
</style>
</head>
<body>
<div class="container">
<h1>UUID批量生成器</h1>
<div class="card">
<div class="row">
<label>生成数量：</label>
<input type="number" id="count" value="10" min="1" max="1000">
</div>
<div class="row">
<label>版本：</label>
<select id="version">
<option value="v4">UUID v4（随机）</option>
<option value="v1">UUID v1（时间戳）</option>
</select>
</div>
<div class="uuid-opt">
<input type="checkbox" id="uppercase"><label for="uppercase">大写</label>
<input type="checkbox" id="noDash" style="margin-left:12px"><label for="noDash">去掉连字符</label>
</div>
<div class="uuid-opt">
<input type="checkbox" id="braces"><label for="braces">添加花括号 {uuid}</label>
</div>
<button class="btn" onclick="generate()">生成UUID</button>
<div class="result" id="result"></div>
<div class="actions">
<button class="btn btn-green" onclick="copyResult()">复制全部</button>
<button class="btn" onclick="downloadTxt()">下载为TXT</button>
<button class="btn" onclick="downloadCsv()">下载为CSV</button>
</div>
</div>
</div>
<script>
function generateUUIDv4(){
if(crypto.randomUUID)return crypto.randomUUID();
return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{
const r=crypto.getRandomValues(new Uint8Array(1))[0]%16;
return(c==='x'?r:(r&0x3|0x8)).toString(16);
});
}
function generateUUIDv1(){
const now=new Date();
const ts=Date.now();
const node=crypto.getRandomValues(new Uint16Array(1))[0];
const clock=crypto.getRandomValues(new Uint16Array(1))[0]&0x3FFF;
const timeLow=(ts&0xFFFFFFFF).toString(16).padStart(8,'0');
const timeMid=((ts>>>32)&0xFFFF).toString(16).padStart(4,'0');
const timeHi=((ts>>>48)&0x0FFF).toString(16).padStart(4,'0');
const clockSeq=clock.toString(16).padStart(4,'0');
const nodeId=node.toString(16).padStart(4,'0')+crypto.getRandomValues(new Uint32Array(1))[0].toString(16).padStart(8,'0');
return `${timeLow}-${timeMid}-1${timeHi.slice(1)}-${clockSeq}-${nodeId.slice(0,12)}`;
}
function generate(){
const count=parseInt(document.getElementById('count').value)||10;
const version=document.getElementById('version').value;
const upper=document.getElementById('uppercase').checked;
const noDash=document.getElementById('noDash').checked;
const braces=document.getElementById('braces').checked;
const uuids=[];
for(let i=0;i<count;i++){
let uuid=version==='v1'?generateUUIDv1():generateUUIDv4();
if(noDash)uuid=uuid.replace(/-/g,'');
if(upper)uuid=uuid.toUpperCase();
if(braces)uuid='{'+uuid+'}';
uuids.push(uuid);
}
document.getElementById('result').textContent=uuids.join('\n');
}
function copyResult(){
const text=document.getElementById('result').textContent;
if(!text){alert('请先生成UUID');return}
navigator.clipboard.writeText(text);
alert('已复制到剪贴板!');
}
function downloadTxt(){
const text=document.getElementById('result').textContent;
if(!text)return;
const b=new Blob([text],{type:'text/plain'});
const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='uuids.txt';a.click();
}
function downloadCsv(){
const text=document.getElementById('result').textContent;
if(!text)return;
const csv='UUID\n'+text.split('\n').map(u=>'"'+u+'"').join('\n');
const b=new Blob([csv],{type:'text/csv'});
const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='uuids.csv';a.click();
}
generate();
</script>
</body>
</html>
