<body>
    <div class="ad-banner-top"><div class="ad-container"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-XXXXXXXXXX" data-ad-slot="XXXXXX" data-ad-format="auto" data-full-width-responsive="true"></ins></div></div>
<div class="header">
  <h1>视频缩略图</h1>
  <a href="https://fm-han.github.io" class="back-link">← 返回工具站</a>
</div>
<div class="container">
  <div class="card">
    <h2>视频缩略图提取</h2>
    <p>上传视频文件，截取指定时间点的画面作为缩略图图片保存。</p>
    <label>选择视频文件</label>
    <input type="file" id="videoInput" accept="video/*">
    <div class="flex-row" style="margin-top:16px;">
      <div>
        <label>截取时间（秒）</label>
        <input type="number" id="timeInput" value="1" min="0" step="0.1">
      </div>
      <div>
        <label>输出格式</label>
        <select id="formatSelect">
          <option value="image/png">PNG</option>
          <option value="image/jpeg">JPEG</option>
          <option value="image/webp">WebP</option>
        </select>
      </div>
    </div>
    <div style="margin-top:16px;">
      <button class="btn-primary" onclick="capture()">截取缩略图</button>
      <button class="btn-danger" onclick="resetAll()" style="margin-left:8px;">重置</button>
    </div>
    <div class="video-info" id="videoInfo"></div>
  </div>
  <div class="card" id="previewCard" style="display:none;">
    <h2>缩略图预览</h2>
    <div class="preview-area" id="previewArea"></div>
    <div style="margin-top:16px;">
      <button class="btn-secondary" onclick="downloadThumb()">下载缩略图</button>
    </div>
  </div>
</div>
<video id="videoEl" style="display:none;"></video>
<canvas id="canvasEl" style="display:none;"></canvas>
<script>
let capturedBlob = null;
let capturedUrl = null;
const videoInput = document.getElementById('videoInput');
const videoEl = document.getElementById('videoEl');
const canvasEl = document.getElementById('canvasEl');

videoInput.addEventListener('change', function() {
  const file = this.files[0];
  if (!file) return;
  const url = URL.createObjectURL(file);
  videoEl.src = url;
  videoEl.addEventListener('loadedmetadata', function() {
    document.getElementById('videoInfo').textContent =
      '视频信息：' + file.name + ' | ' + videoEl.videoWidth + '×' + videoEl.videoHeight + ' | 时长：' + Math.round(videoEl.duration) + '秒';
    document.getElementById('timeInput').max = Math.floor(videoEl.duration);
  });
});

function capture() {
  const file = videoInput.files[0];
  if (!file) { alert('请先选择视频文件'); return; }
  const time = parseFloat(document.getElementById('timeInput').value) || 0;
  videoEl.currentTime = time;
  videoEl.addEventListener('seeked', function onSeeked() {
    videoEl.removeEventListener('seeked', onSeeked);
    canvasEl.width = videoEl.videoWidth;
    canvasEl.height = videoEl.videoHeight;
    const ctx = canvasEl.getContext('2d');
    ctx.drawImage(videoEl, 0, 0);
    const format = document.getElementById('formatSelect').value;
    canvasEl.toBlob(function(blob) {
      capturedBlob = blob;
      if (capturedUrl) URL.revokeObjectURL(capturedUrl);
      capturedUrl = URL.createObjectURL(blob);
      const previewCard = document.getElementById('previewCard');
      previewCard.style.display = 'block';
      document.getElementById('previewArea').innerHTML =
        '<img src="' + capturedUrl + '" alt="缩略图"><p class="video-info">尺寸：' + canvasEl.width + '×' + canvasEl.height + ' | 大小：' + (blob.size/1024).toFixed(1) + 'KB</p>';
    }, format);
  });
}

function downloadThumb() {
  if (!capturedBlob) return;
  const format = document.getElementById('formatSelect').value;
  const ext = format === 'image/png' ? 'png' : format === 'image/jpeg' ? 'jpg' : 'webp';
  const a = document.createElement('a');
  a.href = capturedUrl;
  a.download = 'thumbnail.' + ext;
  a.click();
}

function resetAll() {
  videoInput.value = '';
  document.getElementById('previewCard').style.display = 'none';
  document.getElementById('videoInfo').textContent = '';
  if (capturedUrl) URL.revokeObjectURL(capturedUrl);
  capturedBlob = null;
  capturedUrl = null;
}
</script>
