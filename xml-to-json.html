<style>

.header { background:#fff; border-bottom:1px solid #e0e0e0; padding:12px 24px; display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }

<body>
    <div class="ad-banner-top"><div class="ad-container"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-XXXXXXXXXX" data-ad-slot="XXXXXX" data-ad-format="auto" data-full-width-responsive="true"></ins></div></div>
<div class="header">
  <h1>XML 转 JSON</h1>
  <a href="https://fm-han.github.io" class="back-link">← 返回工具站</a>
</div>
<div class="main-area">
  <div class="editor-panel">
    <div class="panel-header">
      <span>输入 XML</span>
      <div>
        <button class="btn-secondary" onclick="loadExample()" style="padding:4px 12px;font-size:0.85rem;">示例</button>
        <button class="btn-danger" onclick="clearAll()" style="padding:4px 12px;font-size:0.85rem;margin-left:4px;">清空</button>
      </div>
    </div>
    <textarea id="xmlInput" placeholder="在此输入或粘贴 XML 内容..."></textarea>
    <div class="panel-header" style="border-top:1px solid #e0e0e0; justify-content:center;">
      <button class="btn-primary" onclick="convert()" style="padding:6px 24px;">转换为 JSON</button>
    </div>
  </div>
  <div class="result-panel">
    <div class="panel-header">
      <span>JSON 输出</span>
      <button class="btn-secondary" onclick="copyResult()" style="padding:4px 12px;font-size:0.85rem;">复制</button>
    </div>
    <div class="output-area" id="resultArea">转换结果将显示在此处...</div>
    <div class="status-bar" id="statusBar">就绪</div>
  </div>
</div>
<script>
const input = document.getElementById('xmlInput');
const result = document.getElementById('resultArea');
const status = document.getElementById('statusBar');

function convert() {
  const xmlStr = input.value.trim();
  if (!xmlStr) { setStatus('请输入 XML 内容','err'); return; }
  try {
    const parser = new DOMParser();
    const xmlDoc = parser.parseFromString(xmlStr, 'text/xml');
    const err = xmlDoc.querySelector('parsererror');
    if (err) throw new Error(err.textContent.slice(0,100));
    const obj = xmlToObj(xmlDoc.documentElement);
    const json = JSON.stringify(obj, null, 2);
    result.innerHTML = syntaxHighlight(json);
    setStatus('转换成功 | 大小：' + (new Blob([xmlStr]).size/1024).toFixed(1) + 'KB → ' + (new Blob([json]).size/1024).toFixed(1) + 'KB','ok');
  } catch(e) {
    result.textContent = 'XML 解析错误：\n' + e.message;
    setStatus('转换失败：' + e.message,'err');
  }
}

function xmlToObj(node) {
  if (node.nodeType === Node.TEXT_NODE) {
    const t = node.textContent.trim();
    return t ? (isNaN(t) ? t : Number(t)) : null;
  }
  const obj = {};
  if (node.attributes && node.attributes.length > 0) {
    obj['@attributes'] = {};
    for (let i=0; i<node.attributes.length; i++) {
      obj['@attributes'][node.attributes[i].name] = node.attributes[i].value;
    }
  }
  const children = {};
  for (let i=0; i<node.childNodes.length; i++) {
    const child = node.childNodes[i];
    if (child.nodeType === Node.TEXT_NODE) {
      const t = child.textContent.trim();
      if (t) { obj['#text'] = isNaN(t) ? t : Number(t); }
    } else if (child.nodeType === Node.ELEMENT_NODE) {
      const c = xmlToObj(child);
      if (children[child.nodeName]) {
        if (!Array.isArray(children[child.nodeName])) children[child.nodeName] = [children[child.nodeName]];
        children[child.nodeName].push(c);
      } else {
        children[child.nodeName] = c;
      }
    }
  }
  for (const k in children) obj[k] = children[k];
  if (Object.keys(obj).length === 0 && node.nodeType === Node.ELEMENT_NODE) return null;
  return Object.keys(obj).length ? obj : null;
}

function syntaxHighlight(json) {
  json = json.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return json.replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g, function(match) {
    let cls = 'json-number';
    if (/^"/.test(match)) { cls = /:$/.test(match) ? 'json-key' : 'json-string'; }
    else if (/true|false/.test(match)) cls = 'json-boolean';
    else if (/null/.test(match)) cls = 'json-null';
    return '<span class="' + cls + '">' + match + '</span>';
  });
}

function loadExample() {
  input.value = '<?xml version="1.0" encoding="UTF-8"?>\n<user id="123">\n  <name>张三</name>\n  <age>28</age>\n  <active>true</active>\n  <skills>\n    <skill>JavaScript</skill>\n    <skill>Python</skill>\n  </skills>\n</user>';
  convert();
}

function clearAll() { input.value=''; result.textContent='转换结果将显示在此处...'; setStatus('就绪',''); }
function copyResult() { navigator.clipboard.writeText(result.textContent).then(()=>setStatus('已复制','ok')); }
function setStatus(msg,type) { status.textContent=msg; status.style.color=type==='ok'?'#28a745':type==='err'?'#dc3545':'#888'; }
</script>
