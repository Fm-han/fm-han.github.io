<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>重复行去除器 - 免费在线工具</title>
    <style>
                /* 顶部横幅广告 - 透明样式 */ .ad-banner-top { border-bottom: 1px solid #e0e0e0; padding: 6px 20px; text-align: center; min-height: 50px; display: flex; align-items: center; justify-content: center; } .ad-banner-bottom { border-top: 1px solid #e0e0e0; padding: 6px 20px; text-align: center; min-height: 50px; display: flex; align-items: center; justify-content: center; margin-top: 40px; } .ad-container { max-width: 728px; margin: 0 auto; min-height: 38px; display: flex; align-items: center; justify-content: center; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #fafafa; min-height: 100vh; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        .card { background: #fff; border: 1px solid #e0e0e0; border-radius: 8px; padding: 24px; margin-bottom: 20px; }
        h1 { font-size: 1.25rem; font-weight: 600; margin-bottom: 16px; color: #333; }
        textarea { border: 1px solid #ddd; border-radius: 4px; padding: 12px; width: 100%; min-height: 200px; font-family: monospace; font-size: 14px; box-sizing: border-box; resize: vertical; }
        .btn { background: #007bff; color: #fff; border: none; padding: 8px 20px; border-radius: 4px; cursor: pointer; margin: 5px 5px 5px 0; }
        .btn:hover { background: #0056b3; }
        .btn-secondary { background: #28a745; }
        .btn-secondary:hover { background: #218838; }
        .btn-danger { background: #dc3545; }
        .btn-danger:hover { background: #c82333; }
        .label { font-weight: 500; margin-bottom: 8px; display: block; color: #333; }
        .options { margin: 16px 0; }
        .options label { margin-right: 20px; color: #555; }
        .stats { margin-top: 12px; padding: 12px; background: #f5f5f5; border-radius: 4px; color: #333; }
    </style>
</head>
<body>
    <div class="ad-banner-top"><div class="ad-container"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-XXXXXXXXXX" data-ad-slot="XXXXXX" data-ad-format="auto" data-full-width-responsive="true"></ins></div></div>
    <div class="container">
        <h1>重复行去除器</h1>
        <div class="card">
            <label class="label">输入文本（每行一条）</label>
            <textarea id="inputText" placeholder="在此粘贴需要处理的文本..."></textarea>
            <div class="options">
                <label><input type="checkbox" id="caseSensitive"> 区分大小写</label>
                <label><input type="checkbox" id="keepOrder" checked> 保留原始顺序</label>
            </div>
            <button class="btn" onclick="removeDuplicates()">去除重复</button>
            <button class="btn btn-secondary" onclick="clearAll()">清空</button>
        </div>
        <div class="card">
            <label class="label">结果</label>
            <textarea id="outputText" readonly style="background: #f9f9f9;"></textarea>
            <div class="stats" id="stats"></div>
            <button class="btn" onclick="copyResult()">复制结果</button>
        </div>
    </div>
    <script>
        function removeDuplicates() {
            const input = document.getElementById('inputText').value;
            const caseSensitive = document.getElementById('caseSensitive').checked;
            const keepOrder = document.getElementById('keepOrder').checked;
            
            const lines = input.split(/\r?\n/);
            const originalCount = lines.length;
            
            let result;
            if (keepOrder) {
                const seen = new Set();
                result = lines.filter(line => {
                    const key = caseSensitive ? line : line.toLowerCase();
                    if (seen.has(key)) return false;
                    seen.add(key);
                    return true;
                });
            } else {
                const unique = [...new Set(lines.map(l => caseSensitive ? l : l.toLowerCase()))];
                const originalLines = caseSensitive ? lines : lines.map(l => l.toLowerCase());
                result = originalLines.filter((line, i) => {
                    const key = caseSensitive ? line : line.toLowerCase();
                    return unique.indexOf(key) === i;
                }).map(key => {
                    if (!caseSensitive) {
                        const idx = lines.findIndex(l => l.toLowerCase() === key);
                        return lines[idx];
                    }
                    return key;
                });
            }
            
            document.getElementById('outputText').value = result.join('\n');
            
            const duplicateCount = originalCount - result.length;
            document.getElementById('stats').innerHTML = `原始行数: ${originalCount} | 去重后行数: ${result.length} | 去除重复: ${duplicateCount}`;
        }

        function clearAll() {
            document.getElementById('inputText').value = '';
            document.getElementById('outputText').value = '';
            document.getElementById('stats').innerHTML = '';
        }

        function copyResult() {
            const output = document.getElementById('outputText');
            output.select();
            document.execCommand('copy');
            alert('已复制到剪贴板');
        }
    </script>
    <div class="ad-banner-bottom"><div class="ad-container"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-XXXXXXXXXX" data-ad-slot="XXXXXX" data-ad-format="auto" data-full-width-responsive="true"></ins></div></div>
</body>
</html>
