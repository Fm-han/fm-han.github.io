<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文件哈希计算器 - 免费在线工具</title>
    <style>
                /* 顶部横幅广告 - 透明样式 */ .ad-banner-top { border-bottom: 1px solid #e0e0e0; padding: 6px 20px; text-align: center; min-height: 50px; display: flex; align-items: center; justify-content: center; } .ad-banner-bottom { border-top: 1px solid #e0e0e0; padding: 6px 20px; text-align: center; min-height: 50px; display: flex; align-items: center; justify-content: center; margin-top: 40px; } .ad-container { max-width: 728px; margin: 0 auto; min-height: 38px; display: flex; align-items: center; justify-content: center; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #fafafa; min-height: 100vh; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .card { background: #fff; border: 1px solid #e0e0e0; border-radius: 8px; padding: 24px; margin-bottom: 20px; }
        h1 { font-size: 1.25rem; font-weight: 600; margin-bottom: 16px; color: #333; }
        .file-input { border: 1px solid #ddd; border-radius: 4px; padding: 8px 12px; width: 100%; box-sizing: border-box; }
        .btn { background: #007bff; color: #fff; border: none; padding: 8px 20px; border-radius: 4px; cursor: pointer; margin: 5px 0; }
        .btn:hover { background: #0056b3; }
        .results { margin-top: 20px; }
        .result-item { margin-bottom: 12px; padding: 12px; background: #f5f5f5; border-radius: 4px; }
        .result-item strong { color: #333; display: block; margin-bottom: 4px; }
        .result-item code { font-family: monospace; word-break: break-all; font-size: 0.9rem; color: #555; }
        .loading { color: #666; font-style: italic; }
        .error { color: #dc3545; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="ad-banner-top"><div class="ad-container"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-XXXXXXXXXX" data-ad-slot="XXXXXX" data-ad-format="auto" data-full-width-responsive="true"></ins></div></div>
    <div class="container">
        <h1>文件哈希计算器</h1>
        <div class="card">
            <p style="margin-bottom: 16px; color: #666;">选择文件，计算 MD5、SHA1、SHA256 哈希值</p>
            <input type="file" id="fileInput" class="file-input">
            <div id="results" class="results"></div>
        </div>
    </div>
    <script>
        const fileInput = document.getElementById('fileInput');
        const results = document.getElementById('results');

        fileInput.addEventListener('change', async function(e) {
            const file = e.target.files[0];
            if (!file) return;
            
            results.innerHTML = '<p class="loading">正在计算哈希值...</p>';
            
            try {
                const buffer = await file.arrayBuffer();
                const hashBuffer = await crypto.subtle.digest('SHA-256', buffer);
                const sha256 = Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
                
                const sha1Buffer = await crypto.subtle.digest('SHA-1', buffer);
                const sha1 = Array.from(new Uint8Array(sha1Buffer)).map(b => b.toString(16).padStart(2, '0')).join('');
                
                const md5 = await computeMD5(buffer);
                
                results.innerHTML = `
                    <div class="result-item"><strong>MD5</strong><code>${md5}</code></div>
                    <div class="result-item"><strong>SHA-1</strong><code>${sha1}</code></div>
                    <div class="result-item"><strong>SHA-256</strong><code>${sha256}</code></div>
                `;
            } catch (err) {
                results.innerHTML = `<p class="error">计算失败: ${err.message}</p>`;
            }
        });

        async function computeMD5(buffer) {
            const hashBuffer = await crypto.subtle.digest('SHA-256', buffer);
            const wordArray = CryptoJS.lib.WordArray.create(hashBuffer);
            return CryptoJS.MD5(wordArray).toString();
        }
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <div class="ad-banner-bottom"><div class="ad-container"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-XXXXXXXXXX" data-ad-slot="XXXXXX" data-ad-format="auto" data-full-width-responsive="true"></ins></div></div>
</body>
</html>
