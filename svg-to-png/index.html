<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SVG转PNG转换器</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#fafafa;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;padding:20px;min-height:100vh}
.container{max-width:700px;margin:0 auto}
h1{text-align:center;color:#333;margin-bottom:24px;font-size:22px}
.card{background:#fff;border:1px solid #e0e0e0;border-radius:8px;padding:24px;margin-bottom:16px}
label{display:block;font-weight:600;margin-bottom:6px;color:#555;font-size:14px}
.btn{background:#007bff;color:#fff;border:none;padding:8px 20px;border-radius:4px;cursor:pointer;font-size:14px;margin-top:8px}
.btn:hover{background:#0056b3}
.btn-green{background:#28a745}
.btn-green:hover{background:#218838}
.upload-area{border:2px dashed #ccc;border-radius:8px;padding:40px;text-align:center;cursor:pointer;color:#888;margin:12px 0;transition:border-color .2s}
.upload-area:hover,.upload-area.dragover{border-color:#007bff;color:#007bff}
textarea{width:100%;padding:10px;border:1px solid #ddd;border-radius:4px;font-size:13px;box-sizing:border-box;resize:vertical;font-family:monospace;height:150px}
.preview-area{background:#f5f5f5;border-radius:6px;padding:20px;margin-top:12px;text-align:center;min-height:100px;display:flex;align-items:center;justify-content:center}
.preview-area img{max-width:100%;max-height:300px}
.row{display:flex;gap:12px;margin-top:12px;align-items:center}
.row label{margin:0;white-space:nowrap}
input[type="number"]{width:100px;padding:8px;border:1px solid #ddd;border-radius:4px;font-size:14px}
.info{color:#666;font-size:13px;margin-top:8px}
</style>
</head>
<body>
<div class="container">
<h1>SVG转PNG转换器</h1>
<div class="card">
<label>上传SVG文件</label>
<div class="upload-area" id="dropZone">
<p>点击或拖拽SVG文件到此处</p>
<p style="font-size:12px;margin-top:4px">或直接粘贴SVG代码</p>
<input type="file" id="fileInput" accept=".svg,image/svg+xml" style="display:none">
</div>
<label style="margin-top:12px">或粘贴SVG代码</label>
<textarea id="svgCode" placeholder="<svg>...</svg>"></textarea>
<div class="row">
<label>缩放倍数：</label>
<input type="number" id="scale" value="2" min="0.5" max="10" step="0.5">
<span class="info">（默认2倍，数值越大图片越清晰）</span>
</div>
<button class="btn" onclick="convert()">转换为PNG</button>
<div class="preview-area" id="preview">
<span style="color:#999">预览将显示在这里</span>
</div>
<div style="display:flex;gap:8px;margin-top:12px">
<button class="btn btn-green" onclick="downloadPng()">下载PNG</button>
</div>
</div>
</div>
<script>
const dropZone=document.getElementById('dropZone');
const fileInput=document.getElementById('fileInput');
dropZone.onclick=()=>fileInput.click();
dropZone.addEventListener('dragover',e=>{e.preventDefault();dropZone.classList.add('dragover')});
dropZone.addEventListener('dragleave',()=>dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop',e=>{e.preventDefault();dropZone.classList.remove('dragover');handleFile(e.dataTransfer.files[0])});
fileInput.addEventListener('change',e=>handleFile(e.target.files[0]));
let pngDataUrl='';
function handleFile(file){
if(!file)return;
const reader=new FileReader();
reader.onload=e=>{document.getElementById('svgCode').value=e.target.result};
reader.readAsText(file);
}
function convert(){
const svgStr=document.getElementById('svgCode').value.trim();
if(!svgStr){alert('请上传SVG文件或粘贴SVG代码');return}
const scale=parseFloat(document.getElementById('scale').value)||2;
const blob=new Blob([svgStr],{type:'image/svg+xml;charset=utf-8'});
const url=URL.createObjectURL(blob);
const img=new Image();
img.onload=()=>{
const canvas=document.createElement('canvas');
canvas.width=img.naturalWidth*scale;
canvas.height=img.naturalHeight*scale;
const ctx=canvas.getContext('2d');
ctx.drawImage(img,0,0,canvas.width,canvas.height);
URL.revokeObjectURL(url);
pngDataUrl=canvas.toDataURL('image/png');
document.getElementById('preview').innerHTML=`<img src="${pngDataUrl}">`;
};
img.onerror=()=>{alert('SVG解析失败，请检查SVG代码');URL.revokeObjectURL(url)};
img.src=url;
}
function downloadPng(){
if(!pngDataUrl){alert('请先转换');return}
const a=document.createElement('a');a.href=pngDataUrl;a.download='converted.png';a.click();
}
</script>
</body>
</html>
