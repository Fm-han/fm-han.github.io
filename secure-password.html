<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>安全密码生成器</title>
    <style>
                /* 顶部横幅广告 - 透明样式 */ .ad-banner-top { border-bottom: 1px solid #e0e0e0; padding: 6px 20px; text-align: center; min-height: 50px; display: flex; align-items: center; justify-content: center; } .ad-banner-bottom { border-top: 1px solid #e0e0e0; padding: 6px 20px; text-align: center; min-height: 50px; display: flex; align-items: center; justify-content: center; margin-top: 40px; } .ad-container { max-width: 728px; margin: 0 auto; min-height: 38px; display: flex; align-items: center; justify-content: center; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #fafafa; min-height: 100vh; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; }
        .card { background: #fff; border: 1px solid #e0e0e0; border-radius: 8px; padding: 24px; margin-bottom: 20px; }
        h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: 20px; color: #333; text-align: center; }
        .title { font-size: 1.25rem; font-weight: 600; margin-bottom: 16px; color: #333; }
        label { display: block; margin-bottom: 8px; color: #555; font-weight: 500; }
        input[type="number"] { border: 1px solid #ddd; border-radius: 4px; padding: 8px 12px; width: 100%; box-sizing: border-box; margin-bottom: 16px; }
        input[type="text"] { border: 1px solid #ddd; border-radius: 4px; padding: 8px 12px; width: 100%; box-sizing: border-box; margin-bottom: 16px; font-family: monospace; font-size: 1.2rem; }
        .checkbox-group { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
        .checkbox-item { display: flex; align-items: center; gap: 8px; cursor: pointer; }
        .checkbox-item input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; }
        .slider-container { margin-bottom: 16px; }
        .slider-label { display: flex; justify-content: space-between; margin-bottom: 8px; }
        .slider-value { color: #007bff; font-weight: 600; }
        input[type="range"] { width: 100%; height: 8px; border-radius: 4px; background: #e0e0e0; outline: none; cursor: pointer; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%; background: #007bff; cursor: pointer; }
        button { background: #007bff; color: #fff; border: none; padding: 8px 20px; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
        button.generate-btn { background: #28a745; width: 100%; padding: 12px; font-size: 1.1rem; margin-top: 16px; }
        button.generate-btn:hover { background: #218838; }
        .btn-row { display: flex; gap: 10px; }
        button.copy-btn { flex: 1; background: #6c757d; }
        button.copy-btn:hover { background: #5a6268; }
        .password-display { background: #f8f9fa; padding: 20px; border-radius: 4px; text-align: center; margin-bottom: 16px; position: relative; }
        .password-text { font-family: monospace; font-size: 1.3rem; word-break: break-all; color: #333; }
        .strength-badge { display: inline-block; padding: 4px 12px; border-radius: 12px; font-size: 0.85rem; font-weight: 600; margin-top: 12px; }
        .strength-badge.weak { background: #f8d7da; color: #721c24; }
        .strength-badge.fair { background: #fff3cd; color: #856404; }
        .strength-badge.good { background: #cfe2ff; color: #084298; }
        .strength-badge.strong { background: #d4edda; color: #155724; }
        .history { margin-top: 16px; }
        .history-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: #f8f9fa; border-radius: 4px; margin-bottom: 8px; font-family: monospace; font-size: 0.9rem; }
        .history-copy { background: none; border: none; padding: 4px 8px; cursor: pointer; color: #007bff; }
        .error { color: #dc3545; margin-top: 8px; font-size: 0.9rem; }
        .copy-toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #28a745; color: #fff; padding: 12px 24px; border-radius: 4px; display: none; z-index: 1000; }
    </style>
</head>
<body>
    <div class="ad-banner-top"><div class="ad-container"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-XXXXXXXXXX" data-ad-slot="XXXXXX" data-ad-format="auto" data-full-width-responsive="true"></ins></div></div>
    <div class="container">
        <h1>安全密码生成器</h1>
        <div class="card">
            <div class="slider-container">
                <div class="slider-label">
                    <label>密码长度</label>
                    <span id="lengthValue" class="slider-value">16</span>
                </div>
                <input type="range" id="length" min="8" max="64" value="16" oninput="updateLength()">
            </div>
            
            <label>密码包含</label>
            <div class="checkbox-group">
                <label class="checkbox-item">
                    <input type="checkbox" id="uppercase" checked>
                    大写字母 (A-Z)
                </label>
                <label class="checkbox-item">
                    <input type="checkbox" id="lowercase" checked>
                    小写字母 (a-z)
                </label>
                <label class="checkbox-item">
                    <input type="checkbox" id="numbers" checked>
                    数字 (0-9)
                </label>
                <label class="checkbox-item">
                    <input type="checkbox" id="symbols" checked>
                    特殊字符 (!@#$%)
                </label>
            </div>
            
            <button class="generate-btn" onclick="generatePassword()">生成密码</button>
            
            <div id="passwordDisplay" class="password-display" style="display:none;">
                <div id="passwordText" class="password-text"></div>
                <div id="strengthBadge" class="strength-badge"></div>
            </div>
            
            <div id="btnRow" class="btn-row" style="display:none;">
                <button class="copy-btn" onclick="copyPassword()">复制密码</button>
                <button class="copy-btn" onclick="generatePassword()">重新生成</button>
            </div>
            
            <div id="error" class="error" style="display:none;"></div>
        </div>
        
        <div class="card">
            <div class="title">密码历史</div>
            <div id="history" class="history"></div>
        </div>
    </div>
    
    <div id="copyToast" class="copy-toast">已复制到剪贴板!</div>

    <script>
        let currentPassword = '';
        let passwordHistory = [];
        
        function updateLength() {
            document.getElementById('lengthValue').textContent = document.getElementById('length').value;
        }
        
        function generatePassword() {
            const length = parseInt(document.getElementById('length').value);
            const useUpper = document.getElementById('uppercase').checked;
            const useLower = document.getElementById('lowercase').checked;
            const useNumbers = document.getElementById('numbers').checked;
            const useSymbols = document.getElementById('symbols').checked;
            
            const errorDiv = document.getElementById('error');
            errorDiv.style.display = 'none';
            
            if (!useUpper && !useLower && !useNumbers && !useSymbols) {
                errorDiv.textContent = '请至少选择一种字符类型';
                errorDiv.style.display = 'block';
                return;
            }
            
            let chars = '';
            if (useUpper) chars += 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            if (useLower) chars += 'abcdefghijklmnopqrstuvwxyz';
            if (useNumbers) chars += '0123456789';
            if (useSymbols) chars += '!@#$%^&*()_+-=[]{}|;:,.<>?';
            
            let password = '';
            const cryptoObj = window.crypto || window.msCrypto;
            
            for (let i = 0; i < length; i++) {
                const randomIndex = cryptoObj.getRandomValues(new Uint32Array(1))[0] % chars.length;
                password += chars[randomIndex];
            }
            
            // Ensure at least one of each selected type
            let guaranteeChars = '';
            if (useUpper) guaranteeChars += 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            if (useLower) guaranteeChars += 'abcdefghijklmnopqrstuvwxyz';
            if (useNumbers) guaranteeChars += '0123456789';
            if (useSymbols) guaranteeChars += '!@#$%^&*()_+-=[]{}|;:,.<>?';
            
            const passwordArray = password.split('');
            for (let i = 0; i < Math.min(length, 4); i++) {
                const randomIndex = cryptoObj.getRandomValues(new Uint32Array(1))[0] % guaranteeChars.length;
                const pos = cryptoObj.getRandomValues(new Uint32Array(1))[0] % passwordArray.length;
                passwordArray[pos] = guaranteeChars[randomIndex];
            }
            
            currentPassword = passwordArray.join('');
            
            // Update UI
            document.getElementById('passwordText').textContent = currentPassword;
            document.getElementById('passwordDisplay').style.display = 'block';
            document.getElementById('btnRow').style.display = 'flex';
            
            // Calculate strength
            let score = 0;
            if (length >= 12) score += 25;
            if (length >= 16) score += 25;
            if (useUpper && useLower && useNumbers && useSymbols) score += 50;
            else if ((useUpper || useLower) && (useNumbers || useSymbols)) score += 30;
            
            const strengthBadge = document.getElementById('strengthBadge');
            if (score >= 80) {
                strengthBadge.textContent = '非常强';
                strengthBadge.className = 'strength-badge strong';
            } else if (score >= 60) {
                strengthBadge.textContent = '强';
                strengthBadge.className = 'strength-badge good';
            } else if (score >= 40) {
                strengthBadge.textContent = '中等';
                strengthBadge.className = 'strength-badge fair';
            } else {
                strengthBadge.textContent = '弱';
                strengthBadge.className = 'strength-badge weak';
            }
            
            // Add to history
            addToHistory(currentPassword);
        }
        
        function addToHistory(password) {
            const timestamp = new Date().toLocaleTimeString();
            passwordHistory.unshift({ password, timestamp });
            if (passwordHistory.length > 5) passwordHistory.pop();
            updateHistoryUI();
        }
        
        function updateHistoryUI() {
            const historyDiv = document.getElementById('history');
            historyDiv.innerHTML = passwordHistory.map((item, index) => `
                <div class="history-item">
                    <span>${item.password.substring(0, 20)}${item.password.length > 20 ? '...' : ''}</span>
                    <button class="history-copy" onclick="copyHistory(${index})">复制</button>
                </div>
            `).join('');
        }
        
        function copyPassword() {
            navigator.clipboard.writeText(currentPassword).then(() => {
                showToast();
            });
        }
        
        function copyHistory(index) {
            navigator.clipboard.writeText(passwordHistory[index].password).then(() => {
                showToast();
            });
        }
        
        function showToast() {
            const toast = document.getElementById('copyToast');
            toast.style.display = 'block';
            setTimeout(() => {
                toast.style.display = 'none';
            }, 2000);
        }
    </script>
    <div class="ad-banner-bottom"><div class="ad-container"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-XXXXXXXXXX" data-ad-slot="XXXXXX" data-ad-format="auto" data-full-width-responsive="true"></ins></div></div>
</body>
</html>
