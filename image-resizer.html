<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图片调整器 - 免费在线工具</title>
<style>
                /* 顶部横幅广告 - 透明样式 */ .ad-banner-top { border-bottom: 1px solid #e0e0e0; padding: 6px 20px; text-align: center; min-height: 50px; display: flex; align-items: center; justify-content: center; } .ad-banner-bottom { border-top: 1px solid #e0e0e0; padding: 6px 20px; text-align: center; min-height: 50px; display: flex; align-items: center; justify-content: center; margin-top: 40px; } .ad-container { max-width: 728px; margin: 0 auto; min-height: 38px; display: flex; align-items: center; justify-content: center; }
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #fafafa; color: #333; padding: 20px; }
.container { max-width: 900px; margin: 0 auto; }
h1 { font-size: 1.25rem; font-weight: 600; margin-bottom: 16px; color: #333; }
.desc { color: #666; margin-bottom: 20px; line-height: 1.6; }
.card { background: #fff; border: 1px solid #e0e0e0; border-radius: 8px; padding: 24px; margin-bottom: 16px; }
label { display: block; margin-bottom: 8px; font-weight: 500; }
input[type="file"] { margin-bottom: 12px; font-size: 14px; }
input[type="number"] { border: 1px solid #ddd; border-radius: 4px; padding: 8px 12px; width: 120px; box-sizing: border-box; font-size: 14px; }
input[type="number"]:focus { outline: none; border-color: #007bff; }
select { border: 1px solid #ddd; border-radius: 4px; padding: 8px 12px; font-size: 14px; margin-left: 8px; }
.btn-primary { background: #007bff; color: #fff; border: none; padding: 8px 20px; border-radius: 4px; cursor: pointer; font-size: 14px; }
.btn-primary:hover { background: #0056b3; }
.btn-primary:disabled { background: #ccc; cursor: not-allowed; }
.btn-secondary { background: #28a745; color: #fff; border: none; padding: 8px 20px; border-radius: 4px; cursor: pointer; font-size: 14px; margin-left: 8px; }
.btn-secondary:hover { background: #1e7e34; }
.status { margin-top: 12px; padding: 12px; border-radius: 4px; font-size: 14px; display: none; }
.status.success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
.status.error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
.row { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
 canvas { max-width: 100%; border: 1px solid #e0e0e0; border-radius: 4px; margin-top: 12px; }
.preview { margin-top: 16px; text-align: center; display: none; }
.info { margin-top: 8px; font-size: 14px; color: #666; }
</style>
</head>
<body>
    <div class="ad-banner-top"><div class="ad-container"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-XXXXXXXXXX" data-ad-slot="XXXXXX" data-ad-format="auto" data-full-width-responsive="true"></ins></div></div>
<div class="container">
  <div class="card">
    <h1>图片调整器</h1>
    <p class="desc">上传图片，调整宽度和高度尺寸，支持等比例缩放。</p>
    <label for="fileInput">选择图片文件</label>
    <input type="file" id="fileInput" accept="image/*" onchange="loadImage(event)">
    <div class="row" id="sizeRow" style="display:none">
      <label>原始尺寸: <span id="origSize"></span></label>
    </div>
    <div class="row" id="controls" style="display:none">
      <label>宽度</label>
      <input type="number" id="width" min="1" oninput="onSizeChange('width')">
      <label>高度</label>
      <input type="number" id="height" min="1" oninput="onSizeChange('height')">
      <select id="mode" onchange="onModeChange()">
        <option value="lock">等比例</option>
        <option value="free">自由调整</option>
      </select>
      <button class="btn-primary" onclick="resizeImage()">调整尺寸</button>
      <button class="btn-secondary" onclick="downloadImage()">下载图片</button>
    </div>
    <div class="status" id="status"></div>
    <div class="preview" id="preview">
      <canvas id="canvas"></canvas>
      <div class="info" id="info"></div>
    </div>
  </div>
</div>
<script>
let img = null;
let origW = 0, origH = 0;
let lockRatio = true;
function loadImage(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    img = new Image();
    img.onload = function() {
      origW = img.width;
      origH = img.height;
      document.getElementById('origSize').textContent = img.width + ' × ' + img.height;
      document.getElementById('sizeRow').style.display = 'flex';
      document.getElementById('width').value = img.width;
      document.getElementById('height').value = img.height;
      document.getElementById('controls').style.display = 'flex';
      showPreview();
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}
function onSizeChange(source) {
  if (lockRatio && img) {
    if (source === 'width') {
      const w = parseInt(document.getElementById('width').value) || 0;
      document.getElementById('height').value = Math.round(w * origH / origW);
    } else {
      const h = parseInt(document.getElementById('height').value) || 0;
      document.getElementById('width').value = Math.round(h * origW / origH);
    }
  }
}
function onModeChange() {
  lockRatio = document.getElementById('mode').value === 'lock';
}
function showPreview() {
  const canvas = document.getElementById('canvas');
  const w = parseInt(document.getElementById('width').value) || origW;
  const h = parseInt(document.getElementById('height').value) || origH;
  canvas.width = w;
  canvas.height = h;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(img, 0, 0, w, h);
  document.getElementById('preview').style.display = 'block';
  document.getElementById('info').textContent = w + ' × ' + h;
}
function resizeImage() {
  if (!img) { showStatus('请先选择图片', 'error'); return; }
  showPreview();
  showStatus('尺寸调整完成', 'success');
}
function downloadImage() {
  const canvas = document.getElementById('canvas');
  const a = document.createElement('a');
  a.href = canvas.toDataURL('image/png');
  a.download = 'resized-image.png';
  a.click();
}
function showStatus(msg, type) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = 'status ' + type;
  el.style.display = 'block';
}
</script>
    <div class="ad-banner-bottom"><div class="ad-container"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-XXXXXXXXXX" data-ad-slot="XXXXXX" data-ad-format="auto" data-full-width-responsive="true"></ins></div></div>
</body>
</html>
