<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文本分列器 - 免费在线工具</title>
    <style>
                /* 顶部横幅广告 - 透明样式 */ .ad-banner-top { border-bottom: 1px solid #e0e0e0; padding: 6px 20px; text-align: center; min-height: 50px; display: flex; align-items: center; justify-content: center; } .ad-banner-bottom { border-top: 1px solid #e0e0e0; padding: 6px 20px; text-align: center; min-height: 50px; display: flex; align-items: center; justify-content: center; margin-top: 40px; } .ad-container { max-width: 728px; margin: 0 auto; min-height: 38px; display: flex; align-items: center; justify-content: center; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #fafafa; min-height: 100vh; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        .card { background: #fff; border: 1px solid #e0e0e0; border-radius: 8px; padding: 24px; margin-bottom: 20px; }
        h1 { font-size: 1.25rem; font-weight: 600; margin-bottom: 16px; color: #333; }
        textarea { border: 1px solid #ddd; border-radius: 4px; padding: 12px; width: 100%; min-height: 150px; font-family: monospace; font-size: 14px; box-sizing: border-box; resize: vertical; }
        .btn { background: #007bff; color: #fff; border: none; padding: 8px 20px; border-radius: 4px; cursor: pointer; margin: 5px 5px 5px 0; }
        .btn:hover { background: #0056b3; }
        .btn-secondary { background: #28a745; }
        .btn-secondary:hover { background: #218838; }
        .label { font-weight: 500; margin-bottom: 8px; display: block; color: #333; }
        .options { margin: 16px 0; }
        .options label { margin-right: 20px; color: #555; }
        .options input, .options select { border: 1px solid #ddd; border-radius: 4px; padding: 4px 8px; }
        table { width: 100%; border-collapse: collapse; margin-top: 16px; font-size: 14px; }
        th, td { border: 1px solid #ddd; padding: 8px 12px; text-align: left; }
        th { background: #f5f5f5; font-weight: 600; white-space: nowrap; }
        td { max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        tr:nth-child(even) { background: #fafafa; }
        .result-actions { margin-top: 16px; }
    </style>
</head>
<body>
    <div class="ad-banner-top"><div class="ad-container"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-XXXXXXXXXX" data-ad-slot="XXXXXX" data-ad-format="auto" data-full-width-responsive="true"></ins></div></div>
    <div class="container">
        <h1>文本分列器</h1>
        <div class="card">
            <label class="label">输入文本（带分隔符）</label>
            <textarea id="inputText" placeholder="在此粘贴带分隔符的文本，如 CSV、TAB 分隔的数据..."></textarea>
            <div class="options">
                <label>分隔符: <select id="delimiter">
                    <option value="tab">Tab</option>
                    <option value="comma">逗号 (,)</option>
                    <option value="semicolon">分号 (;)</option>
                    <option value="space">空格</option>
                    <option value="pipe">竖线 (|)</option>
                    <option value="custom">自定义</option>
                </select></label>
                <input type="text" id="customDelimiter" placeholder="自定义分隔符" style="display: none; width: 80px;">
                <label><input type="checkbox" id="trimSpaces" checked> 去除首尾空格</label>
                <label><input type="checkbox" id="hasHeader" checked> 首行作为表头</label>
            </div>
            <button class="btn" onclick="splitText()">拆分</button>
            <button class="btn btn-secondary" onclick="clearAll()">清空</button>
        </div>
        <div class="card">
            <label class="label">结果表格</label>
            <div style="overflow-x: auto;">
                <table id="resultTable">
                    <thead id="tableHead"></thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
            <div class="result-actions">
                <button class="btn" onclick="copyAsCSV()">复制为 CSV</button>
                <button class="btn" onclick="copyAsTSV()">复制为 TSV</button>
                <button class="btn" onclick="copyAsJSON()">复制为 JSON</button>
            </div>
        </div>
    </div>
    <script>
        document.getElementById('delimiter').addEventListener('change', function() {
            document.getElementById('customDelimiter').style.display = this.value === 'custom' ? 'inline-block' : 'none';
        });

        function getDelimiter() {
            const type = document.getElementById('delimiter').value;
            switch(type) {
                case 'tab': return '\t';
                case 'comma': return ',';
                case 'semicolon': return ';';
                case 'space': return ' ';
                case 'pipe': return '|';
                case 'custom': return document.getElementById('customDelimiter').value;
                default: return '\t';
            }
        }

        function splitText() {
            const input = document.getElementById('inputText').value;
            const delimiter = getDelimiter();
            const trimSpaces = document.getElementById('trimSpaces').checked;
            const hasHeader = document.getElementById('hasHeader').checked;
            
            const lines = input.split(/\r?\n/).filter(l => l.trim());
            
            if (lines.length === 0) {
                alert('请输入文本');
                return;
            }
            
            const rows = lines.map(line => {
                let cols = line.split(delimiter);
                if (trimSpaces) {
                    cols = cols.map(c => c.trim());
                }
                return cols;
            });
            
            const maxCols = Math.max(...rows.map(r => r.length));
            
            let headers;
            if (hasHeader && rows.length > 0) {
                headers = rows[0].concat(Array(maxCols - rows[0].length).fill(''));
            } else {
                headers = Array(maxCols).fill(0).map((_, i) => '列' + (i + 1));
            }
            
            document.getElementById('tableHead').innerHTML = '<tr>' + headers.map(h => `<th>${escapeHtml(h)}</th>`).join('') + '</tr>';
            
            const dataRows = hasHeader ? rows.slice(1) : rows;
            document.getElementById('tableBody').innerHTML = dataRows.map(row => {
                return '<tr>' + row.concat(Array(maxCols - row.length).fill('')).map(c => `<td>${escapeHtml(c)}</td>`).join('') + '</tr>';
            }).join('');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function getTableData() {
            const rows = [];
            const headerCells = document.querySelectorAll('#tableHead th');
            const bodyRows = document.querySelectorAll('#tableBody tr');
            
            const headers = Array.from(headerCells).map(th => th.textContent);
            
            bodyRows.forEach(tr => {
                const row = {};
                const cells = tr.querySelectorAll('td');
                headers.forEach((h, i) => {
                    row[h] = cells[i] ? cells[i].textContent : '';
                });
                rows.push(row);
            });
            
            return { headers, rows };
        }

        function copyAsCSV() {
            const { headers, rows } = getTableData();
            if (rows.length === 0) { alert('没有数据'); return; }
            
            let csv = headers.map(h => `"${h}"`).join(',') + '\n';
            csv += rows.map(row => headers.map(h => `"${(row[h] || '').replace(/"/g, '""')}"`).join(',')).join('\n');
            
            copyToClipboard(csv);
            alert('已复制为 CSV 格式');
        }

        function copyAsTSV() {
            const { headers, rows } = getTableData();
            if (rows.length === 0) { alert('没有数据'); return; }
            
            let tsv = headers.join('\t') + '\n';
            tsv += rows.map(row => headers.map(h => row[h] || '').join('\t')).join('\n');
            
            copyToClipboard(tsv);
            alert('已复制为 TSV 格式');
        }

        function copyAsJSON() {
            const { headers, rows } = getTableData();
            if (rows.length === 0) { alert('没有数据'); return; }
            
            const json = JSON.stringify(rows, null, 2);
            copyToClipboard(json);
            alert('已复制为 JSON 格式');
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).catch(() => {
                const textarea = document.createElement('textarea');
                textarea.value = text;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
            });
        }

        function clearAll() {
            document.getElementById('inputText').value = '';
            document.getElementById('tableHead').innerHTML = '';
            document.getElementById('tableBody').innerHTML = '';
        }
    </script>
    <div class="ad-banner-bottom"><div class="ad-container"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-XXXXXXXXXX" data-ad-slot="XXXXXX" data-ad-format="auto" data-full-width-responsive="true"></ins></div></div>
</body>
</html>
